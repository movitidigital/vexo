<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time VEXO · Usuários</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cliente VEXO + helpers -->
  <script src="supabase-client.js"></script>
</head>
<body style="font-family: 'Poppins', sans-serif; background: #f1f5f9; margin: 0; padding: 20px;">

<div style="background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); margin: 20px auto; max-width: 1100px;">

  <!-- HEADER -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <div>
      <h2 style="color: #0f172a; margin: 0; font-weight: 800; letter-spacing: -1px;">👥 Time VEXO</h2>
      <p style="margin: 0; font-size: 12px; color: #64748b;">Gestão de identidades e níveis de acesso</p>
    </div>
    <div style="display: flex; gap: 10px;">
      <button id="btn-novo-membro" onclick="limparForm()"
              style="background: #f1f5f9; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; color: #3b82f6;">
        + Adicionar Membro
      </button>
      <button onclick="logout()"
              style="background: #fee2e2; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; color: #dc2626;">
        Sair
      </button>
    </div>
  </div>

  <!-- PAINEL: CONFIG DE CARGOS (MASTER) -->
  <div id="painel-cargos-admin" style="display: none; background: #fdf2ff; padding: 25px; border-radius: 20px; border: 1px dashed #d8b4fe; margin-bottom: 30px;">
    <h4 style="margin-top: 0; color: #6b21a8; font-weight: 700;">🛡️ Gestão de Hierarquia (Painel Master)</h4>
    <p style="font-size: 11px; color: #7e22ce; margin-bottom: 15px;">Defina as permissões padrão por cargo.</p>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: flex-end;">
      <div>
        <label style="font-size: 11px; font-weight: 700; color: #6b21a8; display: block; margin-bottom: 4px;">CARGO</label>
        <select id="config_cargo_nome" onchange="buscarPermissoesDoBanco(this.value)"
                style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d8b4fe;">
          <option value="">-- Selecione --</option>
          <option value="ADMINISTRADOR">ADMINISTRADOR</option>
          <option value="GERENTE/SUPERVISOR">GERENTE/SUPERVISOR</option>
          <option value="BACKOFFICE">BACKOFFICE</option>
          <option value="CONSULTOR DE VENDAS">CONSULTOR DE VENDAS</option>
          <option value="PARCEIRO">PARCEIRO</option>
          <option value="FREELANCER">FREELANCER</option>
        </select>
      </div>
      <div style="flex: 2;">
        <label style="font-size: 11px; font-weight: 700; color: #6b21a8; display: block; margin-bottom: 4px;">MÓDULOS PERMITIDOS</label>
        <div id="master-perms-container" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px;">
          <!-- preenchido via JS -->
        </div>
      </div>
      <button onclick="salvarConfiguracaoNoBanco()"
              style="padding: 12px; background: #6b21a8; color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;">
        Salvar no Banco
      </button>
    </div>
  </div>

  <!-- PAINEL: CADASTRO/EDIÇÃO -->
  <div id="painel-editor" style="display: none; background: #f8fafc; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; margin-bottom: 30px;">
    <h4 id="editor-titulo" style="margin-top: 0; color: #1e293b; font-weight: 700;">Cadastrar Novo Colaborador</h4>

    <div style="display: flex; flex-wrap: wrap; gap: 25px; align-items: flex-start;">
      <!-- Avatar -->
      <div style="text-align: center; flex: 0 0 130px;">
        <div style="position: relative; display: inline-block;">
          <img id="u_preview" src="https://ui-avatars.com/api/?name=?&background=3b82f6&color=fff"
               style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
          <label for="u_file"
                 style="position: absolute; bottom: 5px; right: 5px; background: #3b82f6; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid #fff; font-size: 14px;">
            📸
          </label>
        </div>
        <input type="file" id="u_file" accept="image/*" style="display: none;" onchange="previewImage(this)">
        <input type="hidden" id="u_photo_url">
      </div>

      <!-- Campos -->
      <div style="flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; min-width: 280px;">
        <div>
          <label style="font-size: 11px; font-weight: 700;">MATRÍCULA</label>
          <input type="text" id="u_user" placeholder="Ex: 12345" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">SENHA</label>
          <input type="password" id="u_pass" placeholder="••••••" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">NOME</label>
          <input type="text" id="u_nome" placeholder="Emanuel" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">SOBRENOME</label>
          <input type="text" id="u_sobrenome" placeholder="Silva" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">E-MAIL</label>
          <input type="email" id="u_email" placeholder="nome@empresa.com.br" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; box-sizing: border-box;">
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">CARGO</label>
          <select id="u_role" onchange="aplicarPermissoesPorCargo(this.value)"
                  style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: white;">
            <option value="">-- Selecione --</option>
            <option value="ADMINISTRADOR">ADMINISTRADOR</option>
            <option value="GERENTE/SUPERVISOR">GERENTE/SUPERVISOR</option>
            <option value="BACKOFFICE">BACKOFFICE</option>
            <option value="CONSULTOR DE VENDAS">CONSULTOR DE VENDAS</option>
            <option value="PARCEIRO">PARCEIRO</option>
            <option value="FREELANCER">FREELANCER</option>
          </select>
        </div>
        <div>
          <label style="font-size: 11px; font-weight: 700;">STATUS</label>
          <select id="u_active" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; background: white;">
            <option value="true">ATIVO</option>
            <option value="false">INATIVO</option>
          </select>
        </div>
      </div>
    </div>

    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid #e2e8f0;">
      <p style="font-weight: 700; font-size: 12px; color: #1e293b; margin-bottom: 12px;">PERMISSÕES ATRIBUÍDAS:</p>
      <div id="perms-check-container" style="display: flex; flex-wrap: wrap; gap: 15px;">
        <!-- preenchido via JS -->
      </div>
    </div>

    <button id="btnSalvarU" onclick="salvarUsuario()"
            style="margin-top: 25px; width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer;">
      Confirmar Cadastro no Time
    </button>
  </div>

  <!-- TABELA -->
  <div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
      <thead>
        <tr style="text-align: left; border-bottom: 2px solid #f1f5f9; color: #64748b;">
          <th style="padding: 15px;">COLABORADOR</th>
          <th style="padding: 15px;">MATRÍCULA</th>
          <th style="padding: 15px;">CARGO</th>
          <th style="padding: 15px;">MÓDULOS</th>
          <th style="padding: 15px;">STATUS</th>
          <th style="padding: 15px; text-align: center;">AÇÃO</th>
        </tr>
      </thead>
      <tbody id="lista-usuarios-tabela">
        <tr><td colspan="6" style="text-align:center; padding: 40px; color: #94a3b8;">Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ============================================================
// VARIÁVEIS GLOBAIS
// ============================================================
let PERMISSOES_DISPONIVEIS = [];
let PROFILE_ATUAL = null;

// ============================================================
// INICIALIZAÇÃO
// ============================================================
(async function init() {
  PROFILE_ATUAL = await getProfile();
  if (!PROFILE_ATUAL) return;

  // Carrega a lista de permissões do banco
  const { data: perms } = await sb.from('permissions').select('*').order('codigo');
  PERMISSOES_DISPONIVEIS = perms || [];

  renderPermissoesCheckboxes();

  // Só administrador vê os painéis
  if (PROFILE_ATUAL.role === 'ADMINISTRADOR') {
    document.getElementById('painel-cargos-admin').style.display = 'block';
    document.getElementById('painel-editor').style.display = 'block';
  } else {
    document.getElementById('btn-novo-membro').style.display = 'none';
  }

  carregarUsuarios();
})();

// ============================================================
// RENDER DE CHECKBOXES DE PERMISSÃO
// ============================================================
function renderPermissoesCheckboxes() {
  const html = PERMISSOES_DISPONIVEIS.map(p => `
    <label style="font-size: 12px; display: flex; align-items: center; gap: 6px;">
      <input type="checkbox" name="u_perm" value="${p.codigo}"> ${p.codigo}
    </label>
  `).join('');

  document.getElementById('perms-check-container').innerHTML = html;
  document.getElementById('master-perms-container').innerHTML = html.replace(/name="u_perm"/g, 'class="master-perm"');
}

// ============================================================
// CRUD — CARREGAR USUÁRIOS
// ============================================================
async function carregarUsuarios() {
  const tbody = document.getElementById('lista-usuarios-tabela');

  let query = sb.from('profiles').select('*').order('nome');

  // Consultor só vê a si mesmo; admin vê todos
  if (PROFILE_ATUAL.role !== 'ADMINISTRADOR') {
    query = query.eq('id', PROFILE_ATUAL.id);
  }

  const { data, error } = await query;

  if (error) {
    console.error('Erro ao carregar usuários:', error);
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#dc2626;">Erro: ${error.message}</td></tr>`;
    return;
  }

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">Nenhum usuário cadastrado.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(u => {
    const foto = u.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nome || 'U')}&background=3b82f6&color=fff`;
    const permsHtml = (u.permissoes || []).map(p =>
      `<small style="background:#e0e7ff; color:#4338ca; padding:2px 6px; border-radius:6px; margin-right:3px; font-weight:600; font-size:10px;">${p.toUpperCase()}</small>`
    ).join('');
    const ativo = u.ativo === true;
    const statusStyle = ativo
      ? 'background:#dcfce7; color:#15803d;'
      : 'background:#fee2e2; color:#b91c1c;';

    const podeEditar = PROFILE_ATUAL.role === 'ADMINISTRADOR';

    return `
      <tr style="border-bottom: 1px solid #f8fafc;">
        <td style="padding: 15px; display: flex; align-items: center; gap: 10px;">
          <img src="${foto}" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #fff;">
          <div>
            <div style="font-weight: 700; color: #1e293b;">${u.nome || ''} ${u.sobrenome || ''}</div>
            <div style="font-size: 10px; color: #94a3b8;">${u.email || ''}</div>
          </div>
        </td>
        <td style="padding: 15px; font-family: monospace;">${u.matricula || ''}</td>
        <td style="padding: 15px;">${u.role || ''}</td>
        <td style="padding: 15px;">${permsHtml}</td>
        <td style="padding: 15px;">
          <span style="${statusStyle} padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800;">
            ${ativo ? 'ATIVO' : 'INATIVO'}
          </span>
        </td>
        <td style="padding: 15px; text-align: center;">
          ${podeEditar ? `<button onclick="prepararEdicao('${u.id}')" style="cursor:pointer; border:none; background:#f1f5f9; padding:8px; border-radius:10px; color:#3b82f6;">✏️</button>` : '—'}
        </td>
      </tr>
    `;
  }).join('');
}

// ============================================================
// FORM — PREVIEW DA FOTO
// ============================================================
function previewImage(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('u_preview').src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

// ============================================================
// FORM — LIMPAR
// ============================================================
function limparForm() {
  ['u_user','u_pass','u_nome','u_sobrenome','u_email','u_photo_url','u_file'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  document.getElementById('u_role').value = '';
  document.getElementById('u_active').value = 'true';
  document.querySelectorAll('input[name="u_perm"]').forEach(cb => cb.checked = false);
  document.getElementById('u_preview').src = 'https://ui-avatars.com/api/?name=?&background=3b82f6&color=fff';
  document.getElementById('editor-titulo').innerText = 'Cadastrar Novo Colaborador';

  const btn = document.getElementById('btnSalvarU');
  btn.dataset.editing = '';
  btn.dataset.editId = '';
  btn.innerText = 'Confirmar Cadastro no Time';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// FORM — PERMISSÕES POR CARGO
// ============================================================
async function aplicarPermissoesPorCargo(cargo) {
  if (!cargo) return;
  const { data, error } = await sb
    .from('role_permissions')
    .select('permission')
    .eq('role', cargo);

  if (error) { console.error(error); return; }

  const permsArray = (data || []).map(r => r.permission);
  document.querySelectorAll('input[name="u_perm"]').forEach(cb => {
    cb.checked = permsArray.includes(cb.value);
  });
}

// ============================================================
// FORM — EDITAR
// ============================================================
async function prepararEdicao(id) {
  const { data: u, error } = await sb.from('profiles').select('*').eq('id', id).single();
  if (error || !u) { alert('Erro ao carregar usuário: ' + (error?.message || 'sem dados')); return; }

  document.getElementById('u_user').value = u.matricula || '';
  document.getElementById('u_pass').value = '';
  document.getElementById('u_nome').value = u.nome || '';
  document.getElementById('u_sobrenome').value = u.sobrenome || '';
  document.getElementById('u_email').value = u.email || '';
  document.getElementById('u_role').value = u.role || '';
  document.getElementById('u_active').value = u.ativo ? 'true' : 'false';
  document.getElementById('u_photo_url').value = u.photo_url || '';
  document.getElementById('u_preview').src = u.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nome || 'U')}&background=3b82f6&color=fff`;

  document.querySelectorAll('input[name="u_perm"]').forEach(cb => {
    cb.checked = (u.permissoes || []).includes(cb.value);
  });

  document.getElementById('editor-titulo').innerText = 'Editando Perfil: ' + (u.nome || '').toUpperCase();

  const btn = document.getElementById('btnSalvarU');
  btn.dataset.editing = 'true';
  btn.dataset.editId = u.id;
  btn.innerText = 'Salvar Alterações';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// FORM — SALVAR (criar ou editar)
// ============================================================
async function salvarUsuario() {
  const btn = document.getElementById('btnSalvarU');
  const editing = btn.dataset.editing === 'true';
  const editId = btn.dataset.editId || '';

  const matricula = document.getElementById('u_user').value.trim();
  const nome      = document.getElementById('u_nome').value.trim();
  const sobrenome = document.getElementById('u_sobrenome').value.trim();
  const email     = document.getElementById('u_email').value.trim();
  const senha     = document.getElementById('u_pass').value;
  const role      = document.getElementById('u_role').value;
  const ativo     = document.getElementById('u_active').value === 'true';

  const perms = [];
  document.querySelectorAll('input[name="u_perm"]:checked').forEach(c => perms.push(c.value));

  // ---- Validações ----
  if (!matricula || !nome || !email || !role) {
    alert('Matrícula, Nome, E-mail e Cargo são obrigatórios.');
    return;
  }
  if (!editing && !senha) {
    alert('Defina uma senha para o novo colaborador.');
    return;
  }
  if (senha && senha.length < 6) {
    alert('A senha precisa ter pelo menos 6 caracteres.');
    return;
  }

  btn.disabled = true;
  btn.innerText = '⏳ Processando...';

  try {
    // ---- Upload de foto (se houver nova) ----
    let photoUrl = document.getElementById('u_photo_url').value || null;
    const fileInput = document.getElementById('u_file');
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const path = `${matricula}-${Date.now()}.${ext}`;

      const { error: upErr } = await sb.storage
        .from('avatars')
        .upload(path, file, { upsert: true });

      if (upErr) throw new Error('Upload de foto falhou: ' + upErr.message);

      const { data: urlData } = sb.storage.from('avatars').getPublicUrl(path);
      photoUrl = urlData.publicUrl;
    }

    // ---- EDITAR EXISTENTE ----
    if (editing && editId) {
      const { error: upProfErr } = await sb
        .from('profiles')
        .update({
          matricula, nome, sobrenome, email, role, ativo,
          permissoes: perms,
          photo_url: photoUrl
        })
        .eq('id', editId);

      if (upProfErr) throw upProfErr;

      alert('✅ Colaborador atualizado com sucesso!');
      limparForm();
      carregarUsuarios();
      btn.disabled = false;
      return;
    }

    // ---- CRIAR NOVO ----
    // Descobre o tenant do admin logado
    const tenant_id = PROFILE_ATUAL.tenant_id;

    // 1) Cria no auth (signUp)
    const { data: signData, error: signErr } = await sb.auth.signUp({
      email,
      password: senha,
      options: {
        data: {
          nome, sobrenome, matricula, role, tenant_id
        }
      }
    });

    if (signErr) throw signErr;
    if (!signData.user) throw new Error('Não foi possível criar o usuário.');

    // 2) Atualiza profile com permissões, foto e status
    //    (o trigger já criou o profile básico; aqui refinamos)
    const { error: updErr } = await sb
      .from('profiles')
      .update({
        permissoes: perms,
        photo_url: photoUrl,
        ativo
      })
      .eq('id', signData.user.id);

    if (updErr) throw updErr;

    alert('✅ Colaborador cadastrado com sucesso!');
    limparForm();
    carregarUsuarios();

  } catch (e) {
    console.error(e);
    alert('❌ Erro: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    if (btn.dataset.editing !== 'true') {
      btn.innerText = 'Confirmar Cadastro no Time';
    } else {
      btn.innerText = 'Salvar Alterações';
    }
  }
}

// ============================================================
// MASTER — PERMISSÕES POR CARGO
// ============================================================
async function buscarPermissoesDoBanco(cargo) {
  if (!cargo) return;
  const { data, error } = await sb
    .from('role_permissions')
    .select('permission')
    .eq('role', cargo);

  if (error) { console.error(error); return; }

  const permsArray = (data || []).map(r => r.permission);
  document.querySelectorAll('.master-perm').forEach(cb => {
    cb.checked = permsArray.includes(cb.value);
  });
}

async function salvarConfiguracaoNoBanco() {
  const cargo = document.getElementById('config_cargo_nome').value;
  if (!cargo) { alert('Selecione um cargo.'); return; }

  const selecionadas = [];
  document.querySelectorAll('.master-perm:checked').forEach(cb => selecionadas.push(cb.value));

  try {
    // Apaga as permissões antigas e regrava
    await sb.from('role_permissions').delete().eq('role', cargo);

    if (selecionadas.length > 0) {
      const rows = selecionadas.map(p => ({ role: cargo, permission: p }));
      const { error } = await sb.from('role_permissions').insert(rows);
      if (error) throw error;
    }

    alert('✅ Permissões de "' + cargo + '" salvas com sucesso!');
  } catch (e) {
    console.error(e);
    alert('❌ Erro: ' + e.message);
  }
}

// Expor globalmente
window.limparForm = limparForm;
window.salvarUsuario = salvarUsuario;
window.prepararEdicao = prepararEdicao;
window.previewImage = previewImage;
window.aplicarPermissoesPorCargo = aplicarPermissoesPorCargo;
window.buscarPermissoesDoBanco = buscarPermissoesDoBanco;
window.salvarConfiguracaoNoBanco = salvarConfiguracaoNoBanco;
window.logout = logout;
</script>
</body>
</html>
