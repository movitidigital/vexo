<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .pesquisa-container {
      max-width: 600px;
      width: 100%;
      background: white;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      animation: fadeInUp 0.5s ease-out;
    }
    
    .pesquisa-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }
    
    .pesquisa-header i {
      font-size: 60px;
      margin-bottom: 15px;
    }
    
    .pesquisa-header h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .pesquisa-header p {
      font-size: 13px;
      opacity: 0.8;
    }
    
    .pesquisa-body {
      padding: 35px;
    }
    
    .ticket-info {
      background: #f8fafc;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      border: 1px solid #e2e8f0;
    }
    
    .ticket-info .label {
      font-size: 10px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    
    .ticket-info .value {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 10px;
    }
    
    .rating-section {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .rating-section .question {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
    }
    
    .rating-stars {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .rating-star {
      font-size: 48px;
      cursor: pointer;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    
    .rating-star:hover {
      transform: scale(1.1);
    }
    
    .rating-star.active {
      color: #f59e0b;
    }
    
    .rating-star.active:hover {
      transform: scale(1.1);
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      transition: all 0.2s;
    }
    
    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .btn-enviar {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-enviar:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }
    
    .btn-enviar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .mensagem-sucesso {
      text-align: center;
      padding: 20px;
      background: #d1fae5;
      border-radius: 14px;
      color: #065f46;
      margin-bottom: 20px;
    }
    
    .mensagem-erro {
      text-align: center;
      padding: 20px;
      background: #fee2e2;
      border-radius: 14px;
      color: #991b1b;
      margin-bottom: 20px;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="pesquisa-container" id="pesquisa-container">
  <div class="pesquisa-header">
    <i class="fa-regular fa-star"></i>
    <h2>Avalie nosso atendimento</h2>
    <p>Sua opinião é muito importante para nós</p>
  </div>
  
  <div class="pesquisa-body" id="pesquisa-body">
    <div style="text-align: center; padding: 40px;">
      <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; color: #3b82f6;"></i>
      <p style="margin-top: 15px; color: #64748b;">Carregando...</p>
    </div>
  </div>
</div>

<script>
  // Obter parâmetros da URL
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const ticketId = urlParams.get('ticket');
  
  let ratingSelecionado = 0;
  let dadosTicket = null;
  
  // Carregar dados do ticket
  function carregarTicket() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          dadosTicket = res;
          renderizarFormulario();
        } else {
          mostrarErro(res.message || 'Link inválido ou expirado.');
        }
      })
      .withFailureHandler(function(err) {
        mostrarErro('Erro ao carregar dados: ' + err);
      })
      .p_validarTokenPesquisa(token);
  }
  
  function renderizarFormulario() {
    const container = document.getElementById('pesquisa-body');
    
    container.innerHTML = `
      <div class="ticket-info">
        <div class="label">📋 TICKET</div>
        <div class="value">#${dadosTicket.ticketId} - ${escapeHtml(dadosTicket.titulo)}</div>
        <div class="label">👤 PARCEIRO</div>
        <div class="value">${escapeHtml(dadosTicket.parceiroNome)}</div>
      </div>
      
      <div class="rating-section">
        <div class="question">Como você avalia o atendimento recebido?</div>
        <div class="rating-stars" id="rating-stars">
          <i class="fa-regular fa-star rating-star" data-value="1"></i>
          <i class="fa-regular fa-star rating-star" data-value="2"></i>
          <i class="fa-regular fa-star rating-star" data-value="3"></i>
          <i class="fa-regular fa-star rating-star" data-value="4"></i>
          <i class="fa-regular fa-star rating-star" data-value="5"></i>
        </div>
      </div>
      
      <div class="form-group">
        <label>💬 Deixe um comentário (opcional)</label>
        <textarea id="comentario" rows="4" placeholder="Conte-nos como foi sua experiência..."></textarea>
      </div>
      
      <button class="btn-enviar" onclick="enviarAvaliacao()">
        <i class="fa-regular fa-paper-plane"></i> Enviar Avaliação
      </button>
    `;
    
    configurarRatingStars();
  }
  
  function configurarRatingStars() {
    const stars = document.querySelectorAll('#rating-stars .rating-star');
    stars.forEach(star => {
      star.addEventListener('click', function() {
        ratingSelecionado = parseInt(this.getAttribute('data-value'));
        stars.forEach(s => {
          s.classList.remove('active');
          s.classList.remove('fa-solid');
          s.classList.add('fa-regular');
        });
        for (let i = 0; i < ratingSelecionado; i++) {
          stars[i].classList.add('active');
          stars[i].classList.remove('fa-regular');
          stars[i].classList.add('fa-solid');
        }
      });
    });
  }
  
  function enviarAvaliacao() {
    if (ratingSelecionado === 0) {
      alert('Por favor, selecione uma nota de 1 a 5 estrelas!');
      return;
    }
    
    const btn = document.querySelector('.btn-enviar');
    const comentario = document.getElementById('comentario').value;
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
    
    const dados = {
      token: token,
      nota: ratingSelecionado,
      comentario: comentario
    };
    
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          mostrarSucesso(res.message);
        } else {
          mostrarErro(res.message || 'Erro ao enviar avaliação');
        }
      })
      .withFailureHandler(function(err) {
        mostrarErro('Erro de comunicação: ' + err);
      })
      .p_registrarAvaliacaoViaLink(dados);
  }
  
  function mostrarSucesso(mensagem) {
    const container = document.getElementById('pesquisa-body');
    container.innerHTML = `
      <div class="mensagem-sucesso">
        <i class="fa-regular fa-circle-check" style="font-size: 48px; margin-bottom: 15px; display: block;"></i>
        <h3 style="margin-bottom: 10px;">✅ ${mensagem}</h3>
        <p>Sua opinião nos ajuda a melhorar cada vez mais!</p>
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <button onclick="window.close()" style="padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">
          Fechar
        </button>
      </div>
    `;
  }
  
  function mostrarErro(mensagem) {
    const container = document.getElementById('pesquisa-body');
    container.innerHTML = `
      <div class="mensagem-erro">
        <i class="fa-regular fa-circle-xmark" style="font-size: 48px; margin-bottom: 15px; display: block;"></i>
        <h3 style="margin-bottom: 10px;">❌ ${mensagem}</h3>
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <button onclick="window.close()" style="padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">
          Fechar
        </button>
      </div>
    `;
  }
  
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  // Inicializar
  carregarTicket();
</script>
</body>
</html>
