<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXO · Central de Relatórios</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Poppins', sans-serif;
    background: #ffffff; color: #0f172a;
    min-height: 100vh;
  }

  .vx-topbar {
    background: #0a0e27; color: white; padding: 14px 32px;
    display: flex; align-items: center; gap: 18px;
    border-bottom: 3px solid #1e3c72;
  }
  .vx-topbar .vx-mark {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; letter-spacing: 0.5px; font-size: 17px; color: #ffffff;
  }
  .vx-topbar .vx-mark .bars { display: inline-flex; gap: 3px; align-items: center; }
  .vx-topbar .vx-mark .bars span {
    display: inline-block; width: 4px; height: 18px;
    background: #e11d2e; border-radius: 1px;
  }
  .vx-topbar .vx-mark .bars span:nth-child(2) { height: 22px; }
  .vx-topbar .vx-mark .bars span:nth-child(3) { height: 14px; }
  .vx-topbar h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: 0.2px; color: #cbd5e1; }
  .vx-topbar .spacer { flex: 1; }
  .vx-topbar .vx-user { font-size: 11px; color: #94a3b8; }
  .vx-topbar .vx-role-badge {
    background: rgba(255,255,255,0.1); padding: 5px 12px;
    border-radius: 20px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: #93c5fd; margin-left: 8px;
  }

  .vx-crumbs {
    padding: 16px 32px 0; font-size: 12.5px; color: #64748b;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .vx-crumbs a { color: #0b1a3a; text-decoration: none; font-weight: 600; cursor: pointer; }
  .vx-crumbs a:hover { text-decoration: underline; }
  .vx-crumbs .sep { color: #cbd5e1; }
  .vx-crumbs .atual { color: #0f172a; font-weight: 700; }

  .vx-page { padding: 20px 32px 60px; max-width: 1280px; margin: 0 auto; }
  .vx-page-title { font-size: 24px; font-weight: 800; color: #0a0e27; margin: 4px 0 4px; letter-spacing: -0.3px; }
  .vx-page-sub { color: #64748b; font-size: 12.5px; margin: 0 0 28px; }

  .vx-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
  }
  .vx-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 24px 24px 20px; cursor: pointer; transition: all 0.18s ease;
    display: flex; flex-direction: column; gap: 6px;
    text-align: left; font-family: inherit; position: relative;
  }
  .vx-card:hover {
    border-color: #0a0e27;
    box-shadow: 0 14px 34px -10px rgba(10, 14, 39, 0.15);
    transform: translateY(-2px);
  }
  .vx-card-icon { font-size: 28px; line-height: 1; margin-bottom: 6px; }
  .vx-card-title { font-size: 17px; font-weight: 700; color: #0a0e27; letter-spacing: -0.2px; }
  .vx-card-desc { font-size: 12px; color: #64748b; line-height: 1.5; }
  .vx-card-foot {
    margin-top: 10px; padding-top: 12px; border-top: 1px dashed #e2e8f0;
    font-size: 10.5px; font-weight: 700; color: #94a3b8;
    text-transform: uppercase; letter-spacing: 0.4px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .vx-card-foot .qtd-disp { color: #166534; }
  .vx-card-foot .qtd-breve { color: #92400e; }

  .vx-card-badge {
    position: absolute; top: 14px; right: 14px;
    font-size: 9px; font-weight: 800;
    padding: 3px 8px; border-radius: 10px;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .vx-card-badge.disp { background: #dcfce7; color: #166534; }
  .vx-card-badge.em_breve { background: #fef3c7; color: #92400e; }

  .vx-card[data-status="em_breve"] { opacity: 0.72; }
  .vx-card[data-status="em_breve"]:hover { transform: none; box-shadow: none; border-color: #e2e8f0; cursor: default; }

  .vx-report-frame {
    width: 100%; height: calc(100vh - 180px); min-height: 680px;
    border: 1px solid #e2e8f0; border-radius: 12px; background: white;
    display: block; box-shadow: 0 4px 16px -8px rgba(10, 14, 39, 0.08);
  }

  .vx-view { display: none; }
  .vx-view.active { display: block; }

  /* Estado de carregamento / sem acesso */
  .vx-loading { padding: 80px 20px; text-align: center; color: #94a3b8; font-size: 14px; }
  .vx-acesso-negado {
    padding: 80px 20px; text-align: center;
  }
  .vx-acesso-negado .icon { font-size: 56px; margin-bottom: 12px; }
  .vx-acesso-negado h3 { color: #991b1b; margin: 0 0 8px; font-size: 20px; }
  .vx-acesso-negado p { color: #64748b; font-size: 13px; margin: 0; }

  @media (max-width: 640px) {
    .vx-topbar { padding: 12px 16px; gap: 12px; }
    .vx-topbar h1 { font-size: 13px; }
    .vx-topbar .vx-user { display: none; }
    .vx-page { padding: 16px 16px 40px; }
    .vx-crumbs { padding: 12px 16px 0; }
    .vx-grid { grid-template-columns: 1fr; gap: 14px; }
  }
</style>
</head>
<body>

<!-- ═══════════ TOPBAR ═══════════ -->
<div class="vx-topbar">
  <div class="vx-mark">
    <span class="bars"><span></span><span></span><span></span></span>
    VEXO
  </div>
  <h1>Central de Relatórios</h1>
  <div class="spacer"></div>
  <div class="vx-user" id="vx-user-info">—</div>
  <div class="vx-role-badge" id="vx-user-role" style="display:none;">—</div>
</div>

<!-- ═══════════ VIEW 1: HOME (PASTAS) ═══════════ -->
<div class="vx-view active" id="view-home">
  <div class="vx-crumbs">
    <span class="atual">📁 Relatórios</span>
  </div>
  <div class="vx-page">
    <h2 class="vx-page-title">Central de Relatórios</h2>
    <p class="vx-page-sub">Selecione uma pasta para visualizar os relatórios disponíveis</p>
    <div id="home-conteudo">
      <div class="vx-loading">⏳ Carregando permissões...</div>
    </div>
  </div>
</div>

<!-- ═══════════ VIEW 2: PASTA ═══════════ -->
<div class="vx-view" id="view-pasta">
  <div class="vx-crumbs">
    <a onclick="Rel.showHome()">📁 Relatórios</a>
    <span class="sep">›</span>
    <span class="atual" id="crumb-pasta">—</span>
  </div>
  <div class="vx-page">
    <h2 class="vx-page-title" id="titulo-pasta">—</h2>
    <p class="vx-page-sub" id="sub-pasta">—</p>
    <div class="vx-grid" id="grid-relatorios"></div>
  </div>
</div>

<!-- ═══════════ VIEW 3: RELATÓRIO ═══════════ -->
<div class="vx-view" id="view-relatorio">
  <div class="vx-crumbs">
    <a onclick="Rel.showHome()">📁 Relatórios</a>
    <span class="sep">›</span>
    <a id="crumb-pasta-link" onclick="Rel.voltarPasta()">—</a>
    <span class="sep">›</span>
    <span class="atual" id="crumb-relatorio">—</span>
  </div>
  <div class="vx-page">
    <iframe class="vx-report-frame" id="iframe-relatorio" src="about:blank"
            allow="clipboard-read; clipboard-write"></iframe>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     CONFIGURAÇÃO DAS PASTAS E RELATÓRIOS
     ─────────────────────────────────────────────────────────────
     Cada relatório tem um array `roles` com quem PODE ver.
     Roles válidos: CONSULTOR, BACKOFFICE, GERENTE, FINANCEIRO,
                    ADMINISTRADOR, ADMIN, DIRETORIA
     Regras:
       - Um relatório só aparece se o role do usuário estiver na lista
       - Uma pasta só aparece se tiver pelo menos 1 relatório visível
       - Admin vê tudo automaticamente (não precisa listar)
  ═══════════════════════════════════════════════════════════════ */
  const PASTAS = [
    {
      id: 'vendas',
      icone: '📈',
      titulo: 'Vendas & Performance',
      descricao: 'Relatórios de vendas, ativações e performance comercial',
      relatorios: [
        { id: '2.1', titulo: 'Vendas Detalhado',  descricao: 'Relatório completo de vendas com filtros, KPIs e exportação', arquivo: 'relatorio_vendas_detalhado.html', status: 'disponivel', roles: ['BACKOFFICE','GERENTE'] },
        { id: '2.2', titulo: 'Minhas Vendas',     descricao: 'Visão pessoal do consultor sobre suas vendas',                 arquivo: 'relatorio_minhas_vendas.html',    status: 'disponivel', roles: ['CONSULTOR','BACKOFFICE','GERENTE','FINANCEIRO'] },
        { id: '2.3', titulo: 'Raio-X Backoffice', descricao: 'Análise de funil e gargalos do backoffice',                    arquivo: 'relatorio_raiox_backoffice.html', status: 'em_breve',   roles: ['BACKOFFICE'] }
      ]
    },
    {
      id: 'comissoes',
      icone: '💰',
      titulo: 'Comissões & Financeiro',
      descricao: 'Extratos de comissão, faturas e histórico de pagamentos',
      relatorios: [
        { id: '3.1', titulo: 'Extrato por Consultor',    descricao: 'Detalhamento de comissões por consultor',      arquivo: 'relatorio_extrato_consultor.html', status: 'em_breve', roles: ['GERENTE'] },
        { id: '3.2', titulo: 'Consolidado da Loja',      descricao: 'Consolidação mensal da loja',                  arquivo: 'relatorio_consolidado_loja.html',  status: 'em_breve', roles: ['GERENTE','DIRETORIA'] },
        { id: '3.3', titulo: 'Comissões de Cargos',      descricao: 'Comissões por cargo e função',                  arquivo: 'relatorio_comissoes_cargos.html',  status: 'em_breve', roles: [] },
        { id: '3.4', titulo: 'Relatório de Faturas',     descricao: 'Faturas emitidas e status de pagamento',        arquivo: 'relatorio_faturas.html',           status: 'em_breve', roles: ['FINANCEIRO','DIRETORIA'] },
        { id: '3.5', titulo: 'Histórico de Pagamentos',  descricao: 'Histórico completo de pagamentos realizados',   arquivo: 'relatorio_hist_pagamentos.html',   status: 'em_breve', roles: ['DIRETORIA'] }
      ]
    },
    {
      id: 'crm',
      icone: '📞',
      titulo: 'Clientes & CRM',
      descricao: 'Carteira de clientes, reincidência e análise de base',
      relatorios: [
        { id: '6.1', titulo: 'Carteira Ativa',    descricao: 'Clientes ativos e status da carteira',                arquivo: 'relatorio_carteira_ativa.html',    status: 'em_breve', roles: ['BACKOFFICE','GERENTE'] },
        { id: '6.2', titulo: 'Reincidência',      descricao: 'Análise de clientes reincidentes',                    arquivo: 'relatorio_reincidencia.html',      status: 'em_breve', roles: ['GERENTE'] },
        { id: '6.3', titulo: 'Operadora Doadora', descricao: 'Distribuição por operadora doadora (portabilidade)', arquivo: 'relatorio_operadora_doadora.html', status: 'em_breve', roles: ['GERENTE','DIRETORIA'] }
      ]
    },
    {
      id: 'inteligencia',
      icone: '📊',
      titulo: 'Inteligência TIM',
      descricao: 'Cálculos de remuneração, bônus e regras TIM',
      relatorios: [
        { id: 'TIM', titulo: 'Inteligência de Receita TIM', descricao: 'Remuneração básica, bônus corporate, renegociação, permanência e portabilidade', arquivo: 'relatorio_tim.html', status: 'disponivel', roles: ['DIRETORIA'] }
      ]
    },
    {
      id: 'gestao',
      icone: '🏆',
      titulo: 'Gestão & Diretoria',
      descricao: 'Rankings, previsões e visão executiva',
      relatorios: [
        { id: '7.1', titulo: 'Ranking de TBPs',        descricao: 'Ranking de parceiros por performance',            arquivo: 'relatorio_ranking_tbps.html',     status: 'em_breve', roles: ['GERENTE','DIRETORIA'] },
        { id: '7.2', titulo: 'Previsão de Fechamento', descricao: 'Projeção de fechamento do mês',                   arquivo: 'relatorio_previsao_fech.html',    status: 'em_breve', roles: ['GERENTE','DIRETORIA'] },
        { id: '7.3', titulo: 'Resumo Executivo',       descricao: 'Visão executiva consolidada para diretoria',       arquivo: 'relatorio_resumo_executivo.html', status: 'em_breve', roles: ['DIRETORIA'] }
      ]
    }
  ];

  /* ═══════════ HELPERS ═══════════ */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));

  let USER_ROLE = null;
  let USER_NOME = null;
  let pastaAtual = null;
  let relatorioAtual = null;

  /* ═══════════ PERMISSÕES ═══════════ */
  const ADMIN_ROLES = ['ADMINISTRADOR', 'ADMIN'];

  function ehAdmin(role) {
    return ADMIN_ROLES.includes(String(role || '').toUpperCase().trim());
  }

  function podeVer(relatorio, role) {
    if (ehAdmin(role)) return true;              // Admin vê tudo
    if (!relatorio.roles || relatorio.roles.length === 0) return false; // [] = só admin
    return relatorio.roles.map(r => r.toUpperCase()).includes(String(role || '').toUpperCase().trim());
  }

  function filtrarPastasPorRole(pastas, role) {
    return pastas.map(pasta => {
      const relatoriosVisiveis = pasta.relatorios.filter(r => podeVer(r, role));
      return { ...pasta, relatorios: relatoriosVisiveis };
    }).filter(pasta => pasta.relatorios.length > 0);
  }

  /* ═══════════ NAVEGAÇÃO ═══════════ */
  function showHome() {
    $('view-home').classList.add('active');
    $('view-pasta').classList.remove('active');
    $('view-relatorio').classList.remove('active');
    $('iframe-relatorio').src = 'about:blank';
    pastaAtual = null;
    relatorioAtual = null;
    renderHome();
  }

  function abrirPasta(idPasta) {
    const pastasVisiveis = filtrarPastasPorRole(PASTAS, USER_ROLE);
    const pasta = pastasVisiveis.find(p => p.id === idPasta);
    if (!pasta) return;
    pastaAtual = pasta;

    $('view-home').classList.remove('active');
    $('view-pasta').classList.add('active');
    $('view-relatorio').classList.remove('active');

    $('crumb-pasta').textContent = pasta.titulo;
    $('titulo-pasta').textContent = pasta.icone + '  ' + pasta.titulo;
    $('sub-pasta').textContent = pasta.descricao;

    renderRelatorios(pasta);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function abrirRelatorio(idPasta, idRel) {
    const pastasVisiveis = filtrarPastasPorRole(PASTAS, USER_ROLE);
    const pasta = pastasVisiveis.find(p => p.id === idPasta);
    if (!pasta) return;
    const rel = pasta.relatorios.find(r => r.id === idRel);
    if (!rel || rel.status !== 'disponivel') return;

    pastaAtual = pasta;
    relatorioAtual = rel;

    $('view-home').classList.remove('active');
    $('view-pasta').classList.remove('active');
    $('view-relatorio').classList.add('active');

    $('crumb-pasta-link').textContent = pasta.titulo;
    $('crumb-relatorio').textContent = rel.titulo;

    const frame = $('iframe-relatorio');
    frame.src = rel.arquivo;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function voltarPasta() {
    if (pastaAtual) abrirPasta(pastaAtual.id);
  }

  /* ═══════════ RENDER — HOME ═══════════ */
  function renderHome() {
    const pastasVisiveis = filtrarPastasPorRole(PASTAS, USER_ROLE);
    const container = $('home-conteudo');

    if (pastasVisiveis.length === 0) {
      container.innerHTML = `
        <div class="vx-acesso-negado">
          <div class="icon">🔒</div>
          <h3>Sem relatórios disponíveis</h3>
          <p>Seu perfil (<b>${esc(USER_ROLE || '—')}</b>) não tem acesso a nenhum relatório no momento.<br>
             Fale com o administrador se acha que isso é um engano.</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="vx-grid">${pastasVisiveis.map(p => {
      const disp  = p.relatorios.filter(r => r.status === 'disponivel').length;
      const total = p.relatorios.length;

      let qtdHtml;
      if (disp === 0) {
        qtdHtml = `<span class="qtd-breve">● ${total} relatório${total > 1 ? 's' : ''} · em breve</span>`;
      } else if (disp === total) {
        qtdHtml = `<span class="qtd-disp">● ${disp} disponível${disp > 1 ? 'is' : ''}</span>`;
      } else {
        qtdHtml = `<span class="qtd-disp">● ${disp} de ${total} disponíveis</span>`;
      }

      return `
        <div class="vx-card" onclick="Rel.abrirPasta('${p.id}')">
          <div class="vx-card-icon">${p.icone}</div>
          <div class="vx-card-title">${esc(p.titulo)}</div>
          <div class="vx-card-desc">${esc(p.descricao)}</div>
          <div class="vx-card-foot">
            ${qtdHtml}
            <span>›</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  /* ═══════════ RENDER — RELATÓRIOS DA PASTA ═══════════ */
  function renderRelatorios(pasta) {
    $('grid-relatorios').innerHTML = pasta.relatorios.map(r => {
      const isDisp = r.status === 'disponivel';
      const badge  = isDisp
        ? '<span class="vx-card-badge disp">Disponível</span>'
        : '<span class="vx-card-badge em_breve">Em breve</span>';
      const onclick = isDisp
        ? `onclick="Rel.abrirRelatorio('${pasta.id}','${r.id}')"`
        : '';

      return `
        <div class="vx-card" data-status="${r.status}" ${onclick}>
          ${badge}
          <div class="vx-card-icon">${isDisp ? '📄' : '🔒'}</div>
          <div class="vx-card-title">${esc(r.titulo)}</div>
          <div class="vx-card-desc">${esc(r.descricao)}</div>
          <div class="vx-card-foot">
            <span>Relatório ${esc(r.id)}</span>
            ${isDisp ? '<span>›</span>' : ''}
          </div>
        </div>`;
    }).join('');
  }

  /* ═══════════ INJEÇÃO DO SUPABASE NO IFRAME ═══════════ */
  function configurarIframe() {
    const frame = $('iframe-relatorio');
    frame.addEventListener('load', () => {
      try {
        const w = frame.contentWindow;
        if (!w) return;
        if (!w.sb && window.sb) w.sb = window.sb;
        setTimeout(() => {
          try {
            const h = w.document.documentElement.scrollHeight;
            if (h && h > 400) frame.style.height = Math.max(680, h + 40) + 'px';
          } catch(e) {}
        }, 400);
      } catch(e) {
        console.warn('[Central] Não foi possível injetar sb no iframe:', e.message);
      }
    });
  }

  /* ═══════════ ESC = VOLTAR ═══════════ */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if ($('view-relatorio').classList.contains('active')) voltarPasta();
    else if ($('view-pasta').classList.contains('active')) showHome();
  });

  /* ═══════════ INIT ═══════════ */
  async function init() {
    try {
      const sb = window.sb;
      if (!sb) throw new Error('Supabase não carregado');

      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        $('home-conteudo').innerHTML = `
          <div class="vx-acesso-negado">
            <div class="icon">🔒</div>
            <h3>Não autenticado</h3>
            <p>Faça login para acessar a Central de Relatórios.</p>
          </div>`;
        return;
      }

      const { data: prof } = await sb
        .from('profiles')
        .select('nome, role')
        .eq('id', user.id)
        .maybeSingle();

      USER_NOME = prof?.nome || user.email || '';
      USER_ROLE = (prof?.role || '').toUpperCase().trim() || 'DESCONHECIDO';

      // Atualiza header
      $('vx-user-info').textContent = USER_NOME;
      const roleBadge = $('vx-user-role');
      roleBadge.textContent = USER_ROLE;
      roleBadge.style.display = 'inline-block';
    } catch(e) {
      console.error('[Central] Erro no init:', e);
      $('home-conteudo').innerHTML = `
        <div class="vx-acesso-negado">
          <div class="icon">⚠️</div>
          <h3>Erro ao carregar</h3>
          <p>${esc(e.message || 'Erro desconhecido')}</p>
        </div>`;
      return;
    }

    configurarIframe();
    renderHome();
  }

  /* ═══════════ API PÚBLICA ═══════════ */
  window.Rel = { showHome, abrirPasta, abrirRelatorio, voltarPasta };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else setTimeout(init, 80);
})();
</script>
</body>
</html>
