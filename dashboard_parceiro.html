<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    if (typeof supabase === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
    }
  </script>
  <script>
    if (typeof window.sb === 'undefined') {
      document.write('<script src="supabase-client.js"><\/script>');
    }
  </script>

  <style>
    :root {
      --primary: #3b82f6;      --primary-hover: #2563eb;
      --bg-dark: #0f172a;      --bg-side: #1e293b;
      --text-main: #f8fafc;    --text-muted: #94a3b8;
      --accent: #8b5cf6;       --white: #ffffff;
      --sidebar-width: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f1f5f9; display: flex; height: 100vh; overflow: hidden; position: relative; }

    aside {
      width: var(--sidebar-width); background: var(--bg-side); height: 100%;
      display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000;
    }

    .brand {
      padding: 30px 25px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .brand img { width: 40px; }
    .brand h2 { color: white; font-size: 20px; font-weight: 800; letter-spacing: -1px; }

    .nav-menu { flex: 1; padding: 20px 15px; overflow-y: auto; overflow-x: hidden; }
    .nav-menu::-webkit-scrollbar { width: 5px; }
    .nav-menu::-webkit-scrollbar-track { background: transparent; }
    .nav-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .nav-menu:hover::-webkit-scrollbar-thumb { background: var(--primary); }

    .nav-section { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 10px; font-weight: 700; }

    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 15px;
      color: var(--text-muted); text-decoration: none; border-radius: 10px;
      margin-bottom: 5px; cursor: pointer; transition: all 0.3s; font-size: 14px;
    }
    .menu-item:hover { background: rgba(255,255,255,0.05); color: var(--white); }
    .menu-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }

    header {
      height: 70px; background: white; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
    }

    #menu-toggle {
      display: none; font-size: 22px; color: var(--bg-side); cursor: pointer;
      background: #f8fafc; width: 40px; height: 40px; border-radius: 10px;
      align-items: center; justify-content: center; border: 1px solid #e2e8f0;
    }

    .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .user-info { text-align: right; }
    .user-info p { font-size: 14px; font-weight: 600; color: #1e293b; }
    .user-info span { font-size: 11px; color: var(--text-muted); }
    .user-avatar { width: 40px; height: 40px; border-radius: 10px; background: #e2e8f0; object-fit: cover; border: 2px solid var(--primary); }

    #main-content { flex: 1; overflow-y: auto; padding: 30px; scroll-behavior: smooth; }
    #main-content::-webkit-scrollbar { width: 8px; }
    #main-content::-webkit-scrollbar-track { background: #f1f5f9; }
    #main-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    .module-loader { display: flex; justify-content: center; align-items: center; height: 100%; }

    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: 999;
    }

    @media (max-width: 768px) {
      #menu-toggle { display: flex; }
      aside { position: fixed; left: calc(-1 * var(--sidebar-width)); }
      aside.mobile-open { left: 0; }
      .sidebar-overlay.active { display: block; }
      header { padding: 0 15px; }
      #main-content { padding: 15px; }
      .user-info { display: none; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="overlay" onclick="window.toggleMobileMenu()"></div>

  <aside id="sidebar">
    <div class="brand">
      <img src="https://www.weebly.com/editor/uploads/1/3/4/2/134260582/custom_themes/739339945850558639/files/vexo-imglogo.png" alt="Logo">
      <h2>VEXO <span style="color:var(--primary)">HUB</span></h2>
    </div>

    <div class="nav-menu">
      <div class="nav-section">Principal</div>
      <div class="menu-item active" data-pagina="home_parceiro" onclick="navegar('home_parceiro', this)">
        <i class="fa-solid fa-house"></i> Dashboard
      </div>
      <div class="menu-item" id="btn-menu-vendas" data-pagina="vendas" onclick="navegar('vendas', this)">
        <i class="fa-solid fa-cart-shopping"></i> Vendas TIM
      </div>
      <div class="menu-item" id="btn-menu-pedidos-input" data-pagina="meus_pedidos" onclick="navegar('meus_pedidos', this)">
        <i class="fa-solid fa-box"></i> Meus Pedidos
      </div>

      <div class="nav-section">Operação</div>
      <div class="menu-item" data-pagina="estoque" onclick="navegar('estoque', this)">
        <i class="fa-solid fa-box-archive"></i> Produtos & Estoque
      </div>
      <div class="menu-item" id="btn-menu-suporte" data-pagina="suporte" onclick="navegar('suporte', this)">
        <i class="fa-solid fa-headset"></i> Suporte Técnico
      </div>
      <div class="menu-item" data-pagina="contratos" onclick="navegar('contratos', this)">
        <i class="fa-solid fa-file-signature"></i> Contratos & Docs
      </div>

      <div class="nav-section">Resultados</div>
      <div class="menu-item" data-pagina="financeiro_parceiro" onclick="navegar('financeiro_parceiro', this)">
        <i class="fa-solid fa-coins"></i> Financeiro
      </div>
      <div class="menu-item" data-pagina="comunicacao" onclick="navegar('comunicacao', this)">
        <i class="fa-solid fa-comments"></i> Comunicação
      </div>

      <div class="nav-section">Gestão</div>
      <div class="menu-item" id="menu-credenciamento" data-pagina="credenciamento" onclick="navegar('credenciamento', this)" style="display: none;">
        <i class="fa-solid fa-user-check"></i> Credenciamento
      </div>
      <div class="menu-item" id="menu-parceiros" data-pagina="usuarios_parceiro" onclick="navegar('usuarios_parceiro', this)" style="display: none;">
        <i class="fa-solid fa-handshake"></i> Gestão de Parceiros
      </div>
      <div class="menu-item" id="menu-configuracoes" data-pagina="configuracoes_parceiro" onclick="navegar('configuracoes_parceiro', this)" style="display: none;">
        <i class="fa-solid fa-gear"></i> Configurações do Sistema
      </div>

      <div class="menu-item" onclick="logout()" style="margin-top: 40px; color: #f43f5e;">
        <i class="fa-solid fa-right-from-bracket"></i> Sair do Sistema
      </div>
    </div>
  </aside>

  <main>
    <header>
      <div style="display: flex; align-items: center; gap: 15px;">
        <div id="menu-toggle" onclick="window.toggleMobileMenu()">
          <i class="fa-solid fa-bars-staggered"></i>
        </div>
        <div class="page-title">
          <h4 id="current-page-name" style="color: #1e293b; font-weight: 700;">Dashboard</h4>
        </div>
      </div>

      <div class="user-profile">
        <div class="user-info">
          <p id="user-display-name">Carregando...</p>
          <span id="user-role">Parceiro PE</span>
        </div>
        <img src="" id="user-avatar" class="user-avatar" alt="User"
             onerror="this.src='https://ui-avatars.com/api/?name=U&background=3b82f6&color=fff'">
      </div>
    </header>

    <div id="main-content">
      <div class="module-loader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 30px; color: var(--primary);"></i>
      </div>
    </div>
  </main>

<script>
(function () {
  'use strict';

  if (window._vexoDashboardParceiroLoaded) return;
  window._vexoDashboardParceiroLoaded = true;

  // ═══════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════
  const $ = (id) => document.getElementById(id);

  function getSessao() {
    try {
      return JSON.parse(sessionStorage.getItem('usuarioLogado') || '{}');
    } catch (e) { return {}; }
  }

  // ═══════════════════════════════════════════════════════
  // PERMISSÕES — uma única função, blindada
  // ═══════════════════════════════════════════════════════
  async function verificarPermissoesMenus() {
    let cargo = String(getSessao().role || getSessao().cargo || '').toUpperCase().trim();

    // Se não tiver no sessionStorage, busca no banco
    if (!cargo && window.sb) {
      try {
        const { data: { user } } = await window.sb.auth.getUser();
        if (user) {
          const { data: prof } = await window.sb
            .from('profiles')
            .select('role')
            .eq('id', user.id)
            .single();
          if (prof?.role) {
            cargo = String(prof.role).toUpperCase().trim();
            // Atualiza o sessionStorage também
            const s = getSessao();
            s.role = cargo;
            s.cargo = cargo;
            sessionStorage.setItem('usuarioLogado', JSON.stringify(s));
          }
        }
      } catch (e) {
        console.warn('⚠️ Não foi possível buscar o role do banco:', e);
      }
    }

    console.log('🔎 [Dashboard Parceiro] Role detectado:', cargo || '(vazio)');

    // Atualiza o subtítulo do header
    const roleEl = $('user-role');
    if (roleEl) roleEl.innerText = cargo || 'PARCEIRO';

    // Menu Gestão: só ADMINISTRADOR, BACKOFFICE, GERENTE
    const gestorRoles = ['ADMINISTRADOR', 'BACKOFFICE', 'GERENTE'];
    const podeGestao = gestorRoles.includes(cargo);

    ['menu-parceiros', 'menu-credenciamento'].forEach(id => {
      const el = $(id);
      if (el) el.style.display = podeGestao ? 'flex' : 'none';
    });

    // Menu Configurações: só ADMINISTRADOR e MASTER
    const adminRoles = ['ADMINISTRADOR', 'MASTER'];
    const menuConf = $('menu-configuracoes');
    if (menuConf) menuConf.style.display = adminRoles.includes(cargo) ? 'flex' : 'none';

    return cargo;
  }

  // ═══════════════════════════════════════════════════════
  // NAVEGAÇÃO ENTRE MÓDULOS
  // ═══════════════════════════════════════════════════════
  async function navegar(pagina, element) {
    // Permite chamar navegar('x') sem elemento
    let menuItem = null;
    if (element) {
      menuItem = element.closest ? (element.closest('.menu-item') || element) : element;
    } else {
      menuItem = document.querySelector(`.menu-item[data-pagina="${pagina}"]`);
    }

    // 🔥 Redirecionamento inteligente por cargo
    try {
      const cargo = String(getSessao().role || getSessao().cargo || '').toUpperCase().trim();
      if (pagina === 'home_parceiro' && (cargo === 'FREELANCER' || cargo === 'TERCEIRO')) {
        pagina = 'home_freelancer';
        console.log('🔄 Redirecionado para home_freelancer (cargo:', cargo, ')');
      }
    } catch (e) { /* ignora */ }

    const content = $('main-content');
    const pageTitle = $('current-page-name');

    // UX Mobile: fecha sidebar
    if (window.innerWidth <= 768) {
      const sidebar = $('sidebar');
      const overlay = $('overlay');
      if (sidebar) sidebar.classList.remove('mobile-open');
      if (overlay) overlay.classList.remove('active');
    }

    // Atualiza estado ativo do menu
    document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
    if (menuItem) menuItem.classList.add('active');

    // Título
    if (pageTitle) {
      pageTitle.innerText = pagina === 'home_freelancer'
        ? 'Dashboard Freelancer'
        : (menuItem ? menuItem.innerText.trim() : pagina);
    }

    // Loader
    content.innerHTML = `
      <div class="module-loader" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:15px;">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: var(--primary);"></i>
        <span style="color: #94a3b8; font-size: 13px;">Carregando módulo...</span>
      </div>`;

    // Busca o HTML via fetch
    try {
      const arquivo = `${pagina}.html`;
      const resp = await fetch(arquivo);

      if (!resp.ok) {
        throw new Error(`Módulo "${pagina}" não encontrado (HTTP ${resp.status})`);
      }

      const html = await resp.text();

      content.innerHTML = '';

      // Injeta o HTML
      const range = document.createRange();
      range.selectNode(content);
      const fragment = range.createContextualFragment(html);
      content.appendChild(fragment);
      content.scrollTop = 0;

      // Reprocessa <script> tags (fetch não executa por padrão)
      content.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(a => newScript.setAttribute(a.name, a.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      // Hooks específicos de módulos
      if (pagina === 'home_freelancer' && typeof window.inicializarHomeFreelancer === 'function') {
        setTimeout(() => window.inicializarHomeFreelancer(), 100);
      }
      if (pagina === 'usuarios_parceiro' && window.UP && typeof window.UP.carregar === 'function') {
        setTimeout(() => window.UP.carregar(), 100);
      }

      console.log('✅ [navegar] Módulo carregado:', pagina);

    } catch (err) {
      console.error(`[navegar] Erro ao carregar ${pagina}:`, err);
      content.innerHTML = `
        <div style="text-align:center; padding:60px 30px; background:white; border-radius:20px; border:2px dashed #e2e8f0;">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:40px; color:#ef4444; margin-bottom:15px; display:block;"></i>
          <h3 style="color:#1e293b; margin:0 0 8px 0;">Erro ao carregar módulo</h3>
          <p style="color:#64748b; font-size:13px;">${err.message}</p>
          <p style="color:#94a3b8; font-size:11px; margin-top:10px;">
            Verifique se o arquivo <code>${pagina}.html</code> existe na mesma pasta
          </p>
        </div>`;
    }
  }

  // ═══════════════════════════════════════════════════════
  // LOGOUT
  // ═══════════════════════════════════════════════════════
  async function logout() {
    const content = $('main-content');
    if (content) {
      content.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:15px;">
          <i class="fa-solid fa-right-from-bracket fa-fade" style="font-size: 32px; color: #f43f5e;"></i>
          <span style="color: #94a3b8; font-size: 14px; font-weight: 600;">Encerrando sessão com segurança...</span>
        </div>`;
    }

    try {
      if (window.sb) await window.sb.auth.signOut();
    } catch (e) {
      console.warn('Erro ao fazer signOut:', e);
    }

    sessionStorage.clear();
    localStorage.removeItem('vexo_ultimo_acesso');

    setTimeout(() => {
      window.location.replace('login.html');
    }, 400);
  }

  // ═══════════════════════════════════════════════════════
  // MOBILE
  // ═══════════════════════════════════════════════════════
  function toggleMobileMenu() {
    const sidebar = $('sidebar');
    const overlay = $('overlay');
    if (sidebar) sidebar.classList.toggle('mobile-open');
    if (overlay) overlay.classList.toggle('active');
  }

  // ═══════════════════════════════════════════════════════
  // STUBS — serão reescritas quando migrarmos cada módulo
  // ═══════════════════════════════════════════════════════
  window.inicializarHomeFreelancer = window.inicializarHomeFreelancer || function () {
    console.log('ℹ️ inicializarHomeFreelancer: aguardando migração do módulo');
  };
  window.carregarDadosFreelancer = window.carregarDadosFreelancer || function () {
    console.log('ℹ️ carregarDadosFreelancer: aguardando migração');
  };
  window.carregarComunicadosFreelancer = window.carregarComunicadosFreelancer || function () {
    console.log('ℹ️ carregarComunicadosFreelancer: aguardando migração');
  };

  // ═══════════════════════════════════════════════════════
  // ATALHOS GLOBAIS
  // ═══════════════════════════════════════════════════════
  window.navegar = navegar;
  window.logout = logout;
  window.toggleMobileMenu = toggleMobileMenu;

  window.irParaVendas = () => navegar('vendas');
  window.irParaModulo = (p) => navegar(p);

  // ═══════════════════════════════════════════════════════
  // INICIALIZAÇÃO
  // ═══════════════════════════════════════════════════════
  window.onload = async () => {
    const user = getSessao();
    if (user) {
      const nameEl = $('user-display-name');
      const avEl = $('user-avatar');
      if (nameEl) nameEl.innerText = user.nome || user.username || 'Usuário';
      if (avEl) {
        avEl.src = user.photoUrl
          || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.username || user.nome || 'U')}&background=3b82f6&color=fff`;
      }
    }

    // Verifica permissões ANTES de navegar (para os menus ficarem corretos)
    await verificarPermissoesMenus();

    // Carrega o dashboard inicial
    navegar('home_parceiro', document.querySelector('.menu-item.active'));
  };

  console.log('✅ [VEXO] Dashboard Parceiro carregado');
})();
</script>
</body>
</html>
