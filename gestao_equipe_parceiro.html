<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Equipe · VEXO</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>if (typeof supabase === 'undefined') { document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>'); }</script>
  <script>if (typeof window.sb === 'undefined') { document.write('<script src="supabase-client.js"><\/script>'); }</script>

  <style>
    * { box-sizing: border-box; }
    body { background: #f8fafc; margin: 0; }
    .up-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; font-family: 'Poppins', sans-serif; }

    /* ─── HEADER ─── */
    .up-header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 55%, #4338ca 100%);
      border-radius: 20px; padding: 26px 30px; color: white;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 18px; margin-bottom: 22px;
      position: relative; overflow: hidden; box-shadow: 0 12px 32px rgba(30,60,114,0.22);
    }
    .up-header::before { content: '👥'; position: absolute; font-size: 200px; opacity: 0.06; right: -40px; top: -60px; transform: rotate(-15deg); pointer-events: none; }
    .up-header h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; position: relative; z-index: 1; }
    .up-header p { margin: 0; font-size: 13px; opacity: 0.85; position: relative; z-index: 1; }
    .up-header-actions { display: flex; gap: 12px; position: relative; z-index: 1; }
    .up-btn { border: none; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .up-btn-white { background: white; color: #1e3c72; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .up-btn-white:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0,0,0,0.22); }

    /* ─── KPIs ─── */
    .up-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .up-kpi { background: white; border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; border: 1px solid #eef2f6; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .up-kpi-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .up-kpi-icon.blue { background: #eff6ff; color: #2563eb; }
    .up-kpi-icon.green { background: #ecfdf5; color: #059669; }
    .up-kpi-icon.red { background: #fef2f2; color: #dc2626; }
    .up-kpi-body { flex: 1; }
    .up-kpi-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
    .up-kpi-value { font-size: 22px; font-weight: 800; color: #1e293b; line-height: 1; }

    /* ─── FILTROS ─── */
    .up-filters { background: white; border-radius: 16px; padding: 16px 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; border: 1px solid #eef2f6; }
    .up-search { flex: 1; min-width: 240px; position: relative; }
    .up-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    .up-search input { width: 100%; padding: 11px 14px 11px 38px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 13px; transition: all 0.2s; }
    .up-search input:focus { outline: none; border-color: #1e3c72; box-shadow: 0 0 0 3px rgba(30,60,114,0.08); }

    /* ─── GRID & CARDS ─── */
    .up-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .up-card { background: white; border-radius: 16px; padding: 20px 22px; border: 1px solid #eef2f6; box-shadow: 0 4px 14px rgba(0,0,0,0.04); position: relative; overflow: hidden; transition: all 0.25s; }
    .up-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 5px; background: #94a3b8; }
    .up-card.ativo::before { background: linear-gradient(180deg, #3b82f6, #2563eb); }
    .up-card.inativo::before { background: #cbd5e1; }
    .up-card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(30,60,114,0.1); }
    .up-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .up-badge { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.4px; display: inline-flex; align-items: center; gap: 5px; }
    .up-badge-ativo { background: #ecfdf5; color: #065f46; }
    .up-badge-inativo { background: #f1f5f9; color: #475569; }
    .up-card-name { font-size: 15px; font-weight: 800; color: #0f172a; margin: 0 0 4px 0; line-height: 1.3; }
    .up-card-doc { font-size: 11px; font-family: ui-monospace, monospace; color: #64748b; margin-bottom: 12px; }
    .up-card-info { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #475569; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed #e2e8f0; }
    .up-card-info div { display: flex; align-items: center; gap: 6px; }
    .up-card-info i { color: #94a3b8; width: 14px; }
    .up-card-comissao { background: #f8fafc; border-radius: 10px; padding: 10px 12px; font-size: 11px; color: #475569; margin-bottom: 14px; }
    .up-card-comissao b { color: #1e3c72; }
    .up-card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .up-act { flex: 1; padding: 9px 12px; border: 1px solid #e2e8f0; background: white; color: #475569; border-radius: 10px; font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.18s; }
    .up-act:hover { background: #f8fafc; border-color: #cbd5e1; }
    .up-act.edit:hover { background: #eff6ff; border-color: #3b82f6; color: #1e40af; }
    .up-act.toggle:hover { background: #fef2f2; border-color: #ef4444; color: #991b1b; }

    /* ─── MODAL ─── */
    .up-modal { position: fixed; inset: 0; z-index: 10000; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
    .up-modal.open { display: flex; }
    .up-modal-box { background: white; width: 95%; max-width: 720px; max-height: 92vh; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.35); animation: upIn 0.28s cubic-bezier(0.4,0,0.2,1); }
    @keyframes upIn { from { transform: scale(0.94) translateY(12px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    .up-modal-head { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 55%, #4338ca 100%); padding: 22px 26px; color: white; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
    .up-modal-head h3 { margin: 0; font-size: 17px; font-weight: 800; position: relative; z-index: 1; }
    .up-modal-head p { margin: 2px 0 0 0; font-size: 12px; opacity: 0.85; position: relative; z-index: 1; }
    .up-modal-head .close { margin-left: auto; width: 34px; height: 34px; border: none; border-radius: 50%; background: rgba(255,255,255,0.15); color: white; font-size: 18px; cursor: pointer; position: relative; z-index: 1; transition: all 0.2s; }
    .up-modal-head .close:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }
    .up-modal-body { padding: 22px 26px; overflow-y: auto; flex: 1; background: #f8fafc; }
    .up-fs { background: white; border-radius: 14px; border: 1px solid #eef2f6; padding: 18px 20px; margin-bottom: 14px; }
    .up-fs-title { font-size: 11px; font-weight: 800; color: #1e3c72; text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 14px 0; display: flex; align-items: center; gap: 8px; }
    .up-fs-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, #e2e8f0, transparent); }
    .up-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .up-row:last-child { margin-bottom: 0; }
    .up-fg { display: flex; flex-direction: column; gap: 5px; }
    .up-fg.full { grid-column: 1 / -1; }
    .up-fg label { font-size: 10px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.4px; }
    .up-input { padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 9px; font-family: inherit; font-size: 13px; background: white; transition: all 0.2s; }
    .up-input:focus { outline: none; border-color: #1e3c72; box-shadow: 0 0 0 3px rgba(30,60,114,0.08); }
    .up-com-tipo { display: flex; gap: 10px; margin-bottom: 14px; }
    .up-com-tipo label { display: inline-flex; cursor: pointer; }
    .up-com-tipo input { position: absolute; opacity: 0; pointer-events: none; }
    .up-pill { padding: 9px 16px; border: 2px solid #e2e8f0; background: white; border-radius: 22px; font-size: 12px; font-weight: 800; text-transform: uppercase; transition: all 0.2s; color: #475569; }
    .up-com-tipo input:checked + .up-pill.simplificado { border-color: #10b981; background: #ecfdf5; color: #065f46; }
    .up-com-tipo input:checked + .up-pill.detalhado { border-color: #8b5cf6; background: #f5f3ff; color: #5b21b6; }
    .up-com-extra { display: none; }
    .up-com-extra.active { display: block; }
    .up-senha-wrap { display: flex; gap: 6px; align-items: stretch; }
    .up-senha-wrap .up-input { flex: 1; font-family: ui-monospace, monospace; }
    .up-gerar-btn { padding: 0 14px; border: 1.5px solid #cbd5e1; background: #f1f5f9; color: #1e3c72; border-radius: 9px; cursor: pointer; font-size: 15px; transition: all 0.18s; }
    .up-gerar-btn:hover { background: #1e3c72; color: white; border-color: #1e3c72; }
    .up-modal-foot { padding: 16px 26px; background: white; border-top: 1px solid #eef2f6; display: flex; justify-content: flex-end; gap: 10px; }
    .up-foot-btn { padding: 12px 24px; border-radius: 11px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .up-foot-btn.cancel { background: #f1f5f9; color: #64748b; }
    .up-foot-btn.save { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; box-shadow: 0 6px 16px rgba(30,60,114,0.25); }
    
    .up-toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 20px; border-radius: 12px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-left: 4px solid #10b981; font-size: 13px; font-weight: 600; color: #1e293b; z-index: 99999; display: none; font-family: 'Poppins', sans-serif; }
    .up-toast.show { display: block; animation: upToastIn 0.3s ease; }
    .up-toast.error { border-left-color: #ef4444; }
    @keyframes upToastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    .up-empty { grid-column: 1 / -1; text-align: center; padding: 70px 30px; background: white; border-radius: 20px; border: 2px dashed #e2e8f0; }
    .up-empty i { font-size: 54px; color: #cbd5e1; margin-bottom: 14px; display: block; }
    .up-empty h3 { color: #475569; margin: 0 0 6px 0; font-weight: 800; font-size: 16px; }
    .up-empty p { color: #94a3b8; font-size: 13px; margin: 0; }
  </style>
</head>
<body>

<div class="up-wrap">
  <div class="up-header">
    <div>
      <h2>👥 Gestão de Equipe</h2>
      <p>Cadastre e gerencie os consultores da sua equipe</p>
    </div>
    <div class="up-header-actions">
      <button class="up-btn up-btn-white" onclick="UP.abrirModal()">
        <i class="fas fa-plus"></i> Novo Consultor
      </button>
    </div>
  </div>

  <div class="up-kpis" id="up-kpis"></div>

  <div class="up-filters">
    <div class="up-search">
      <i class="fas fa-search"></i>
      <input type="text" id="up-busca" placeholder="Buscar consultor por nome ou e-mail...">
    </div>
  </div>

  <div class="up-grid" id="up-grid">
    <div class="up-empty">
      <i class="fas fa-spinner fa-spin"></i>
      <h3>Carregando equipe...</h3>
    </div>
  </div>
</div>

<!-- ═══ MODAL ═══ -->
<div class="up-modal" id="up-modal">
  <div class="up-modal-box">
    <div class="up-modal-head">
      <div>
        <h3 id="up-modal-titulo">Novo Consultor</h3>
        <p id="up-modal-sub">Preencha os dados e crie o acesso</p>
      </div>
      <button class="close" onclick="UP.fecharModal()">&times;</button>
    </div>

    <div class="up-modal-body">
      <input type="hidden" id="up-edit-id">

      <!-- DADOS BÁSICOS -->
      <div class="up-fs">
        <div class="up-fs-title">📋 Dados do Consultor</div>
        <div class="up-row">
          <div class="up-fg full">
            <label>Nome Completo *</label>
            <input type="text" id="up-nome" class="up-input" placeholder="Nome do consultor">
          </div>
        </div>
        <div class="up-row">
          <div class="up-fg">
            <label>Telefone / WhatsApp</label>
            <input type="text" id="up-telefone" class="up-input" placeholder="(00) 00000-0000">
          </div>
          <div class="up-fg">
            <label>E-mail (login) *</label>
            <input type="email" id="up-email" class="up-input" placeholder="consultor@email.com">
          </div>
        </div>
        <div class="up-row" id="up-senha-row">
          <div class="up-fg full">
            <label>Senha inicial *</label>
            <div class="up-senha-wrap">
              <input type="text" id="up-senha" class="up-input" placeholder="Mínimo 6 caracteres">
              <button type="button" class="up-gerar-btn" onclick="UP.gerarSenha()" title="Gerar senha aleatória">
                <i class="fas fa-dice"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- COMISSÃO INDIVIDUAL -->
      <div class="up-fs">
        <div class="up-fs-title" style="color: #6d28d9;">💸 Comissão do Consultor</div>
        <div class="up-com-tipo">
          <label>
            <input type="radio" name="up-com-tipo" value="SIMPLIFICADO" checked onchange="UP.trocarComissao()">
            <span class="up-pill simplificado">Simplificado</span>
          </label>
          <label>
            <input type="radio" name="up-com-tipo" value="DETALHADO" onchange="UP.trocarComissao()">
            <span class="up-pill detalhado">Detalhado</span>
          </label>
        </div>

        <div id="up-com-simplificado" class="up-com-extra active">
          <div class="up-row">
            <div class="up-fg">
              <label>Vendas (%)</label>
              <input type="number" id="up-com-vendas" class="up-input" value="5" step="0.5" min="0" max="100">
            </div>
            <div class="up-fg">
              <label>Renegociação (%)</label>
              <input type="number" id="up-com-reneg" class="up-input" value="3" step="0.5" min="0" max="100">
            </div>
          </div>
        </div>

        <div id="up-com-detalhado" class="up-com-extra">
          <div class="up-row" id="grid-com-detalhado">
            <!-- Inputs dinâmicos gerados via JS -->
          </div>
        </div>
      </div>

      <!-- STATUS -->
      <div class="up-fs" id="up-fs-status" style="display:none;">
        <div class="up-fs-title">⚙️ Status</div>
        <div class="up-row">
          <div class="up-fg full">
            <label>Status do Consultor</label>
            <select id="up-status" class="up-input">
              <option value="ATIVO">🟢 Ativo</option>
              <option value="INATIVO">⚪ Inativo / Bloqueado</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="up-modal-foot">
      <button class="up-foot-btn cancel" onclick="UP.fecharModal()">Cancelar</button>
      <button class="up-foot-btn save" id="up-btn-salvar" onclick="UP.salvar()">
        <i class="fas fa-check"></i> Criar Consultor
      </button>
    </div>
  </div>
</div>

<div class="up-toast" id="up-toast"></div>

<script>
(function () {
  'use strict';

  const MODALIDADES_COMISSAO = [
    { id: 'acessos_novos', label: 'Acessos Novos (%)', padrao: 10 },
    { id: 'aditivo', label: 'Aditivo (%)', padrao: 5 },
    { id: 'migracao', label: 'Migração (%)', padrao: 8 },
    { id: 'portabilidade', label: 'Portabilidade (%)', padrao: 12 },
    { id: 'm2m', label: 'Corporate M2M (%)', padrao: 15 },
    { id: 'vas', label: 'VAS (%)', padrao: 20 },
    { id: 'renegociacao', label: 'Renegociação (%)', padrao: 7 },
    { id: 'ultra_fibra', label: 'Ultra Fibra (%)', padrao: 10 },
    { id: 'tim_fixo', label: 'TIM Fixo (%)', padrao: 0 }
  ];

  let EQUIPE = [];
  let MEU_ID = null; // ID do parceiro logado

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

  function toast(msg, tipo) {
    const t = $('up-toast');
    t.className = 'up-toast show' + (tipo ? ' ' + tipo : '');
    t.textContent = msg;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ─── INIT ───
  (async function init() {
    if (!window.sb) return toast('Erro: Supabase não carregado', 'error');

    // Pega o ID do parceiro logado
    const session = await window.sb.auth.getSession();
    if (session?.data?.session?.user?.id) {
      MEU_ID = session.data.session.user.id;
    } else {
      return toast('Sessão expirada. Faça login novamente.', 'error');
    }

    renderizarInputsComissao();
    $('up-busca').addEventListener('input', aplicarFiltros);
    $('up-modal').addEventListener('click', (e) => { if (e.target === $('up-modal')) fecharModal(); });
    
    carregar();
  })();

  function renderizarInputsComissao() {
    const html = MODALIDADES_COMISSAO.map(m => `
      <div class="up-fg">
        <label>${m.label}</label>
        <input type="number" id="com-${m.id}" class="up-input input-com-dinamico" data-id="${m.id}" value="${m.padrao}" step="0.5" min="0" max="100">
      </div>
    `).join('');
    $('grid-com-detalhado').innerHTML = html;
  }

  // ─── CARREGAR ───
  async function carregar() {
    $('up-grid').innerHTML = `<div class="up-empty"><i class="fas fa-spinner fa-spin"></i><h3>Carregando equipe...</h3></div>`;

    const { data, error } = await window.sb.rpc('listar_minha_equipe');

    if (error || !data?.success) {
      console.error(error || data);
      $('up-grid').innerHTML = `<div class="up-empty"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i><h3>Erro ao carregar</h3><p>${esc(error?.message || data?.message)}</p></div>`;
      return;
    }

    EQUIPE = data.data || [];
    renderKPIs();
    aplicarFiltros();
  }

  function renderKPIs() {
    const total = EQUIPE.length;
    const ativos = EQUIPE.filter(c => c.ativo).length;
    const inativos = total - ativos;

    $('up-kpis').innerHTML = `
      <div class="up-kpi">
        <div class="up-kpi-icon blue"><i class="fas fa-users"></i></div>
        <div class="up-kpi-body"><div class="up-kpi-label">Total Consultores</div><div class="up-kpi-value">${total}</div></div>
      </div>
      <div class="up-kpi">
        <div class="up-kpi-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="up-kpi-body"><div class="up-kpi-label">Ativos</div><div class="up-kpi-value">${ativos}</div></div>
      </div>
      <div class="up-kpi">
        <div class="up-kpi-icon red"><i class="fas fa-user-slash"></i></div>
        <div class="up-kpi-body"><div class="up-kpi-label">Inativos / Bloqueados</div><div class="up-kpi-value">${inativos}</div></div>
      </div>
    `;
  }

  function aplicarFiltros() {
    const busca = ($('up-busca').value || '').toLowerCase().trim();
    let filtrados = [...EQUIPE];
    if (busca) {
      filtrados = filtrados.filter(c => 
        (c.nome || '').toLowerCase().includes(busca) || 
        (c.email || '').toLowerCase().includes(busca)
      );
    }
    renderLista(filtrados);
  }

  function renderLista(lista) {
    if (!lista.length) {
      $('up-grid').innerHTML = `<div class="up-empty"><i class="fas fa-users"></i><h3>Nenhum consultor encontrado</h3><p>Clique em "Novo Consultor" para começar a montar sua equipe.</p></div>`;
      return;
    }

    $('up-grid').innerHTML = lista.map(c => {
      const cfg = c.comissao_config || {};
      const isSimpl = cfg.tipo === 'SIMPLIFICADO' || !cfg.tipo;
      const comResumo = isSimpl
        ? `Simplificado · Vendas ${cfg.vendas ?? 5}% / Reneg ${cfg.renegociacao ?? 3}%`
        : 'Detalhado (Múltiplas Modalidades)';

      return `
        <div class="up-card ${c.ativo ? 'ativo' : 'inativo'}">
          <div class="up-card-head">
            <div class="up-badge ${c.ativo ? 'up-badge-ativo' : 'up-badge-inativo'}">
              ${c.ativo ? '🟢 Ativo' : '⚪ Inativo'}
            </div>
            <div style="font-size: 10px; color:#94a3b8; font-family:monospace;">${esc(c.matricula || '')}</div>
          </div>
          <h4 class="up-card-name">${esc(c.nome || '—')}</h4>
          <div class="up-card-info">
            <div><i class="fas fa-envelope"></i> ${esc(c.email || '—')}</div>
            ${c.telefone ? `<div><i class="fas fa-phone"></i> ${esc(c.telefone)}</div>` : ''}
          </div>
          <div class="up-card-comissao">💸 <b>${esc(comResumo)}</b></div>
          <div class="up-card-actions">
            <button class="up-act edit" onclick="UP.abrirModal('${esc(c.id)}')"><i class="fas fa-pen"></i> Editar</button>
            <button class="up-act toggle" onclick="UP.toggleStatus('${esc(c.id)}', ${c.ativo})"><i class="fas fa-power-off"></i> ${c.ativo ? 'Bloquear' : 'Ativar'}</button>
          </div>
        </div>`;
    }).join('');
  }

  // ─── MODAL ───
  function abrirModal(id) {
    const edit = !!id;
    $('up-edit-id').value = id || '';
    $('up-modal-titulo').textContent = edit ? 'Editar Consultor' : 'Novo Consultor';
    $('up-modal-sub').textContent = edit ? 'Atualize os dados e comissão' : 'Preencha os dados e crie o acesso';

    limparForm();

    if (edit) {
      const c = EQUIPE.find(x => x.id === id);
      if (!c) return toast('Consultor não encontrado', 'error');

      $('up-nome').value = c.nome || '';
      $('up-email').value = c.email || '';
      $('up-telefone').value = c.telefone || '';
      $('up-senha-row').style.display = 'none';
      $('up-fs-status').style.display = '';
      $('up-status').value = c.ativo ? 'ATIVO' : 'INATIVO';
      $('up-email').disabled = true; // E-mail não é editável aqui (evita quebra de auth)

      const cfg = c.comissao_config || {};
      const tipoCom = cfg.tipo === 'DETALHADO' ? 'DETALHADO' : 'SIMPLIFICADO';
      document.querySelector(`input[name="up-com-tipo"][value="${tipoCom}"]`).checked = true;
      trocarComissao();

      if (tipoCom === 'SIMPLIFICADO') {
        $('up-com-vendas').value = cfg.vendas ?? 5;
        $('up-com-reneg').value  = cfg.renegociacao ?? 3;
      } else {
        MODALIDADES_COMISSAO.forEach(m => {
          const el = $('com-' + m.id);
          if (el) el.value = cfg[m.id] ?? m.padrao;
        });
      }

      $('up-btn-salvar').textContent = 'Salvar Alterações';
    } else {
      $('up-fs-status').style.display = 'none';
      $('up-btn-salvar').innerHTML = '<i class="fas fa-check"></i> Criar Consultor';
    }

    $('up-modal').classList.add('open');
  }

  function fecharModal() { $('up-modal').classList.remove('open'); }

  function limparForm() {
    $('up-nome').value = '';
    $('up-email').value = '';
    $('up-email').disabled = false;
    $('up-telefone').value = '';
    $('up-senha').value = '';
    
    $('up-com-vendas').value = 5;
    $('up-com-reneg').value = 3;
    document.querySelector('input[name="up-com-tipo"][value="SIMPLIFICADO"]').checked = true;
    
    document.querySelectorAll('.input-com-dinamico').forEach(input => {
      const id = input.getAttribute('data-id');
      const mod = MODALIDADES_COMISSAO.find(m => m.id === id);
      input.value = mod ? mod.padrao : 0;
    });

    trocarComissao();
    $('up-senha-row').style.display = '';
  }

  function trocarComissao() {
    const tipo = document.querySelector('input[name="up-com-tipo"]:checked').value;
    $('up-com-simplificado').classList.toggle('active', tipo === 'SIMPLIFICADO');
    $('up-com-detalhado').classList.toggle('active', tipo === 'DETALHADO');
  }

  function gerarSenha() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    let s = '';
    for (let i = 0; i < 10; i++) s += chars[Math.floor(Math.random() * chars.length)];
    $('up-senha').value = s;
  }

  // ─── SALVAR ───
  async function salvar() {
    const editId = $('up-edit-id').value;
    const btn = $('up-btn-salvar');
    btn.disabled = true;
    const txtAntigo = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

    try {
      const nome = $('up-nome').value.trim();
      const email = $('up-email').value.trim().toLowerCase();
      const senha = $('up-senha').value;
      const telefone = $('up-telefone').value.trim() || null;

      if (!nome) throw new Error('Nome é obrigatório.');

      const tipoCom = document.querySelector('input[name="up-com-tipo"]:checked').value;
      let comissao_config;
      if (tipoCom === 'SIMPLIFICADO') {
        comissao_config = { tipo: 'SIMPLIFICADO', vendas: parseFloat($('up-com-vendas').value) || 0, renegociacao: parseFloat($('up-com-reneg').value) || 0 };
      } else {
        comissao_config = { tipo: 'DETALHADO' };
        MODALIDADES_COMISSAO.forEach(m => {
          comissao_config[m.id] = parseFloat($('com-' + m.id).value) || 0;
        });
      }

      const status = $('up-status').value;

      const { data, error } = await window.sb.rpc('salvar_consultor', {
        p_parceiro_id: MEU_ID,
        p_consultor_id: editId || null,
        p_nome: nome,
        p_email: editId ? null : email, // Email só vai na criação
        p_senha: editId ? null : senha,
        p_telefone: telefone,
        p_comissao_config: comissao_config,
        p_status: editId ? status : 'ATIVO'
      });

      if (error) throw error;
      if (!data?.success) throw new Error(data?.message || 'Erro ao salvar');

      toast(editId ? '✅ Consultor atualizado!' : '✅ Consultor criado com sucesso!', 'success');
      fecharModal();
      await carregar();

    } catch (e) {
      console.error(e);
      toast('❌ ' + (e.message || 'Erro inesperado'), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = txtAntigo;
    }
  }

  // ─── TOGGLE STATUS ───
  async function toggleStatus(id, ativoAtual) {
    const novoStatus = ativoAtual ? 'INATIVO' : 'ATIVO';
    if (!confirm(`Deseja ${novoStatus === 'ATIVO' ? 'ativar' : 'bloquear'} este consultor?`)) return;

    const consultor = EQUIPE.find(x => x.id === id);
    if (!consultor) return;

    const { data, error } = await window.sb.rpc('salvar_consultor', {
      p_parceiro_id: MEU_ID,
      p_consultor_id: id,
      p_status: novoStatus,
      p_comissao_config: consultor.comissao_config // Mantém a comissão atual
    });

    if (error || !data?.success) {
      toast('❌ Erro: ' + (error?.message || data?.message || '?'), 'error');
      return;
    }

    toast(`✅ Consultor ${novoStatus === 'ATIVO' ? 'ativado' : 'bloqueado'}!`, 'success');
    await carregar();
  }

  window.UP = { abrirModal, fecharModal, salvar, trocarComissao, gerarSenha, toggleStatus };
})();
</script>
</body>
</html>
