        <option value="TODOS">📋 Todos os Status</option>

<script>
// ============================================
// VARIÁVEIS GLOBAIS
// ============================================
let calendarioVexo;
let usuarioLogadoAgenda = null;
let cargoUsuarioAgenda = null;
let pdfBlobAtual = null;
let pdfNomeAtual = '';

// ============================================
// FUNÇÕES DE EXPORTAÇÃO
// ============================================

function abrirModalExportacao() {
  const modal = document.getElementById('modal-exportacao');
  const box = document.querySelector('#modal-exportacao div');
  
  document.getElementById('export-periodo').value = 'mes_atual';
  document.getElementById('export-status').value = 'TODOS';
  document.getElementById('export-data-inicio').value = '';
  document.getElementById('export-data-fim').value = '';
  document.getElementById('export-datas-personalizadas').style.display = 'none';
  
  modal.style.display = 'flex';
  setTimeout(() => { 
    modal.style.opacity = '1'; 
    if (box) box.style.transform = 'scale(1)'; 
  }, 10);
}

function fecharModalExportacao() {
  const modal = document.getElementById('modal-exportacao');
  const box = document.querySelector('#modal-exportacao div');
  modal.style.opacity = '0';
  if (box) box.style.transform = 'scale(0.95)';
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

document.addEventListener('DOMContentLoaded', function() {
  const periodoSelect = document.getElementById('export-periodo');
  if (periodoSelect) {
    periodoSelect.addEventListener('change', function() {
      const divDatas = document.getElementById('export-datas-personalizadas');
      if (this.value === 'personalizado') {
        divDatas.style.display = 'block';
      } else {
        divDatas.style.display = 'none';
      }
    });
  }
});

function exportarAgenda(formato) {
  const periodo = document.getElementById('export-periodo').value;
  const statusFiltro = document.getElementById('export-status').value;
  
  let dataInicio, dataFim;
  const hoje = new Date();
  
  switch(periodo) {
    case 'mes_atual':
      dataInicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      dataFim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      break;
    case 'mes_proximo':
      dataInicio = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
      dataFim = new Date(hoje.getFullYear(), hoje.getMonth() + 2, 0);
      break;
    case 'trimestre':
      dataInicio = new Date(hoje.getFullYear(), hoje.getMonth() - 2, 1);
      dataFim = hoje;
      break;
    case 'semestre':
      dataInicio = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1);
      dataFim = hoje;
      break;
    case 'ano':
      dataInicio = new Date(hoje.getFullYear(), 0, 1);
      dataFim = new Date(hoje.getFullYear(), 11, 31);
      break;
    case 'personalizado':
      dataInicio = new Date(document.getElementById('export-data-inicio').value);
      dataFim = new Date(document.getElementById('export-data-fim').value);
      if (isNaN(dataInicio) || isNaN(dataFim)) {
        alert('Selecione as datas de início e fim corretamente!');
        return;
      }
      break;
    default:
      dataInicio = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      dataFim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
  }
  
  const inicioStr = dataInicio.toISOString().split('T')[0];
  const fimStr = dataFim.toISOString().split('T')[0];
  
  const sessao = JSON.parse(sessionStorage.getItem('usuarioLogado') || '{}');
  const nome = sessao.username || "SISTEMA";
  const cargo = sessao.role || "CONSULTOR";
  
  const btnExcel = document.getElementById('btn-export-excel');
  const btnPdf = document.getElementById('btn-export-pdf');
  if (btnExcel) btnExcel.disabled = true;
  if (btnPdf) btnPdf.disabled = true;
  
  const botoes = document.querySelectorAll('#modal-exportacao button[onclick^="exportar"]');
  botoes.forEach(btn => {
    btn.innerHTML = '⏳ Processando...';
  });
  
  google.script.run
    .withSuccessHandler(function(resultado) {
      if (btnExcel) btnExcel.disabled = false;
      if (btnPdf) btnPdf.disabled = false;
      botoes.forEach(btn => {
        if (formato === 'excel') btn.innerHTML = '📊 Excel (XLSX)';
        else btn.innerHTML = '📄 PDF';
      });
      
      if (resultado.success) {
        if (formato === 'excel') {
          downloadExcel(resultado.conteudo, resultado.nomeArquivo);
        } else {
          // Para PDF/HTML, abrir modal de visualização
          abrirModalVisualizacaoRelatorio(resultado.conteudo, resultado.nomeArquivo);
        }
        fecharModalExportacao();
        
        if (typeof notificacaoVexo === 'function') {
          notificacaoVexo(`Relatório ${formato.toUpperCase()} gerado com sucesso!`, 'success');
        }
      } else {
        alert('Erro ao gerar relatório: ' + resultado.mensagem);
      }
    })
    .withFailureHandler(function(erro) {
      if (btnExcel) btnExcel.disabled = false;
      if (btnPdf) btnPdf.disabled = false;
      botoes.forEach(btn => {
        if (formato === 'excel') btn.innerHTML = '📊 Excel (XLSX)';
        else btn.innerHTML = '📄 PDF';
      });
      alert('Erro de comunicação: ' + erro);
    })
    .exportarAgendaVexo(inicioStr, fimStr, statusFiltro, nome, cargo, formato);
}

// 🌟 NOVA FUNÇÃO: Abrir modal com o relatório HTML (evita bloqueio do Chrome)
function abrirModalVisualizacaoRelatorio(htmlContent, nomeArquivo) {
  // Criar modal se não existir
  let modal = document.getElementById('modal-visualizacao-pdf');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal-visualizacao-pdf';
    modal.style.cssText = `
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10001;
      justify-content: center; align-items: center; flex-direction: column;
    `;
    document.body.appendChild(modal);
  }
  
  // Criar um blob HTML e gerar URL
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  
  modal.innerHTML = `
    <div style="background: white; border-radius: 24px; width: 90%; max-width: 1100px; height: 85%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #e2e8f0; background: #0f172a;">
        <div>
          <h3 style="margin: 0; color: white; font-size: 16px; font-weight: 700;">📄 Visualização do Relatório</h3>
          <p style="margin: 4px 0 0 0; color: #94a3b8; font-size: 11px;">${nomeArquivo}</p>
        </div>
        <div style="display: flex; gap: 12px;">

function base64ToBlob(base64, contentType) {
  const byteCharacters = atob(base64);
  const byteNumbers = new Array(byteCharacters.length);
  for (let i = 0; i < byteCharacters.length; i++) {
    byteNumbers[i] = byteCharacters.charCodeAt(i);
  }
  const byteArray = new Uint8Array(byteNumbers);
  return new Blob([byteArray], { type: contentType });
}

function downloadExcel(conteudo, nomeArquivo) {
  const blob = base64ToBlob(conteudo, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.setAttribute('download', nomeArquivo);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function downloadPDF(blob, nomeArquivo) {
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.setAttribute('download', nomeArquivo);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// Criar o container de notificações ao carregar a página
function criarContainerNotificacoes() {

// Função principal de notificação
function notificacaoVexo(mensagem, tipo, tituloPersonalizado = null) {
  criarContainerNotificacoes();
  
  const container = document.getElementById('vexo-toast-container');
  
  // Configurações por tipo
  const config = {
    success: {
      icone: '✅',
      titulo: tituloPersonalizado || 'Sucesso!',
      classe: 'vexo-toast-success'
    },
    warning: {
      icone: '⚠️',
      titulo: tituloPersonalizado || 'Atenção',
      classe: 'vexo-toast-warning'
    },
    error: {
      icone: '❌',
      titulo: tituloPersonalizado || 'Erro',
      classe: 'vexo-toast-error'
    },
    info: {
      icone: 'ℹ️',
      titulo: tituloPersonalizado || 'Informação',
      classe: 'vexo-toast-info'
    }
  };
  
  const tipoCorrigido = tipo || 'info';
  const cfg = config[tipoCorrigido] || config.info;
  
  // Criar elemento da notificação
  const toast = document.createElement('div');
  toast.className = `vexo-toast ${cfg.classe}`;
  
  toast.innerHTML = `
    <div class="vexo-toast-icon">${cfg.icone}</div>
    <div class="vexo-toast-content">
      <div class="vexo-toast-title">${cfg.titulo}</div>
      <div class="vexo-toast-message">${mensagem}</div>
    </div>
    <div class="vexo-toast-close" onclick="fecharNotificacaoVexo(this.parentElement)">✕</div>
  `;
  
  container.appendChild(toast);
  
  // Auto-fechar após 5 segundos
  setTimeout(() => {
    if (toast && toast.parentElement) {
      fecharNotificacaoVexo(toast);
    }
  }, 5000);
  
  return toast;
}

function fecharNotificacaoVexo(toast) {
  toast.classList.add('vexo-toast-fadeout');
  setTimeout(() => {
    if (toast && toast.parentElement) {
      toast.remove();
    }
  }, 300);
}

function iniciarAgendaVexo() {
  if (typeof FullCalendar === 'undefined') {
    setTimeout(iniciarAgendaVexo, 100);
    return;
  }

  carregarDadosUsuario();
  
  const calendarEl = document.getElementById('calendario-vexo');
  if (!calendarEl) return;

  calendarioVexo = new FullCalendar.Calendar(calendarEl, {
    locale: 'pt-br',
    firstDay: 0,
    weekText: 'Semana',
    buttonText: {
      today: 'Hoje',
      month: 'Mês',
      week: 'Semana',
      day: 'Dia',
      list: 'Lista',
      prev: 'Anterior',
      next: 'Próximo'
    },
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
    },
    navLinks: true,
    editable: true,
    selectable: true,
    nowIndicator: true,
    dayMaxEvents: true,
    displayEventTime: true,
    eventTimeFormat: {
      hour: '2-digit',
      minute: '2-digit',
      meridiem: false,
      hour12: false
    },
    
    select: function(info) {
      abrirModalAgenda(null, info.startStr, info.endStr);
    },
    
    eventClick: function(info) {
      const ev = info.event;
      abrirModalAgenda({
        id: ev.id,
        titulo: ev.title,
        cliente: ev.extendedProps.cliente,
        tipo: ev.extendedProps.tipo,
        status: ev.extendedProps.status,
        inicio: toLocalDatetime(ev.start),
        fim: ev.end ? toLocalDatetime(ev.end) : toLocalDatetime(ev.start),
        obs: ev.extendedProps.obs
      });
    },

    eventDrop: function(info) {
      atualizarDataEventoArraste(info.event);
    },
    
    datesSet: function() {
      traduzirBotoesCalendario();
    }
  });

  calendarioVexo.render();
  
  setTimeout(() => { 
    calendarioVexo.updateSize();
    traduzirBotoesCalendario();
  }, 200);
  
  carregarEventos();
}

function traduzirBotoesCalendario() {
  if (!calendarioVexo) return;
  
  const botoes = document.querySelectorAll('.fc-toolbar .fc-button');
  const traducoes = {
    'today': 'Hoje',
    'month': 'Mês',
    'week': 'Semana',
    'day': 'Dia',
    'list': 'Lista',
    'prev': 'Anterior',
    'next': 'Próximo'
  };
  
  botoes.forEach(botao => {
    const textoOriginal = botao.innerText.toLowerCase().trim();
    for (let [eng, pt] of Object.entries(traducoes)) {
      if (textoOriginal === eng || textoOriginal.includes(eng)) {
        if (botao.innerText !== pt) {
          botao.innerText = pt;
        }
        break;
      }
    }
  });
  
  const tituloMes = document.querySelector('.fc-toolbar-title');
  if (tituloMes) {
    const mesesEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const mesesPT = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    let texto = tituloMes.innerText;
    mesesEN.forEach((mes, idx) => {
      texto = texto.replace(new RegExp(mes, 'gi'), mesesPT[idx]);
    });
    if (tituloMes.innerText !== texto) {
      tituloMes.innerText = texto;
    }
  }
}

function carregarDadosUsuario() {
  try {
    const sessao = JSON.parse(sessionStorage.getItem('usuarioLogado') || '{}');
    usuarioLogadoAgenda = sessao.username || "";
    cargoUsuarioAgenda = sessao.role || "CONSULTOR";
    
    const filtroSelect = document.getElementById('filtro-vendedor-agenda');
    if (filtroSelect && (cargoUsuarioAgenda === "ADMINISTRADOR" || cargoUsuarioAgenda === "BACKOFFICE")) {
      filtroSelect.style.display = 'inline-block';
      carregarListaVendedores();
      filtroSelect.addEventListener('change', function() {
        carregarEventos();
      });
    }
  } catch(e) {
    console.warn("Erro ao carregar dados do usuário:", e);
  }
}

function carregarListaVendedores() {
  google.script.run
    .withSuccessHandler(function(vendedores) {
      const select = document.getElementById('filtro-vendedor-agenda');
      if (!select) return;
      
      select.innerHTML = '<option value="TODOS">👥 Todos os Vendedores</option>';
      if (Array.isArray(vendedores)) {
        vendedores.forEach(v => {
          select.innerHTML += `<option value="${v}">👤 ${v}</option>`;
        });
      }
    })
    .withFailureHandler(function(err) {
      console.error("Erro ao carregar vendedores:", err);
    })
    .buscarNomesUsuarios();
}

function toLocalDatetime(dateObj) {
  if (!dateObj) return "";
  const tzoffset = (new Date()).getTimezoneOffset() * 60000;
  const localISOTime = (new Date(dateObj - tzoffset)).toISOString().slice(0,16);
  return localISOTime;
}

function abrirModalAgenda(dados = null, dataStart = null, dataEnd = null) {
  const modal = document.getElementById('modal-agenda');
  const box = document.getElementById('modal-agenda-box');
  const btnExcluir = document.getElementById('btn-excluir-ag');
  
  document.getElementById('ag_id').value = "";
  document.getElementById('ag_titulo').value = "";
  document.getElementById('ag_cliente').value = "";
  document.getElementById('ag_obs').value = "";
  document.getElementById('titulo-modal-agenda').innerText = "Novo Compromisso";
  btnExcluir.style.display = "none";

  const selectTipo = document.getElementById('ag_tipo');
  if (selectTipo) selectTipo.value = "Telefonar";
  
  const selectStatus = document.getElementById('ag_status');
  if (selectStatus) selectStatus.value = "Pendente";

  if (dataStart && !dataStart.includes("T")) {
    document.getElementById('ag_inicio').value = dataStart + "T09:00"; 
    document.getElementById('ag_fim').value = dataStart + "T10:00";
  } else if (dataStart) {
    document.getElementById('ag_inicio').value = dataStart.slice(0,16);
    document.getElementById('ag_fim').value = dataEnd ? dataEnd.slice(0,16) : dataStart.slice(0,16);
  } else {
    const agora = toLocalDatetime(new Date());
    document.getElementById('ag_inicio').value = agora;
    document.getElementById('ag_fim').value = agora;
  }

  if (dados && dados.id) {
    document.getElementById('ag_id').value = dados.id;
    document.getElementById('ag_titulo').value = dados.titulo;
    document.getElementById('ag_cliente').value = dados.cliente;
    document.getElementById('ag_inicio').value = dados.inicio;
    document.getElementById('ag_fim').value = dados.fim;
    document.getElementById('ag_obs').value = dados.obs;
    document.getElementById('titulo-modal-agenda').innerText = "Editar Compromisso";
    btnExcluir.style.display = "block";

    if (dados.tipo && selectTipo) {
      let opcaoExiste = Array.from(selectTipo.options).some(opt => opt.value === dados.tipo);
      selectTipo.value = opcaoExiste ? dados.tipo : "Outros";
    }

    if (dados.status && selectStatus) {
      let txtStatus = String(dados.status).toUpperCase();
      if (txtStatus.includes("CONCLU")) selectStatus.value = "Concluido";
      else if (txtStatus.includes("CANCEL")) selectStatus.value = "Cancelado";
      else selectStatus.value = "Pendente";
    }
  }

  modal.style.display = 'flex';
  setTimeout(() => { 
    modal.style.opacity = '1'; 
    box.style.transform = 'scale(1)'; 
  }, 10);
}

function fecharModalAgenda() {
  const modal = document.getElementById('modal-agenda');
  const box = document.getElementById('modal-agenda-box');
  modal.style.opacity = '0';
  box.style.transform = 'scale(0.95)';
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

function carregarEventos() {
  const sessao = JSON.parse(sessionStorage.getItem('usuarioLogado') || '{}');
  const nome = sessao.username || "SISTEMA";
  const cargo = sessao.role || "CONSULTOR";
  
  const filtroSelect = document.getElementById('filtro-vendedor-agenda');
  let vendedorFiltro = null;
  
  if (filtroSelect && filtroSelect.style.display !== 'none' && filtroSelect.value !== 'TODOS') {
    vendedorFiltro = filtroSelect.value;
  }

  google.script.run
    .withSuccessHandler(function(eventos) {
      if(calendarioVexo) {
        calendarioVexo.removeAllEvents();
        
        let eventosFiltrados = eventos;
        if (vendedorFiltro) {
          eventosFiltrados = eventos.filter(ev => ev.extendedProps?.vendedor === vendedorFiltro);
        }
        
        calendarioVexo.addEventSource(eventosFiltrados);
      }
    })
    .buscarAgendamentosVexo(nome, cargo);
}

function salvarAgendaBase() {
  const btn = document.getElementById('btn-salvar-ag');
  const titulo = document.getElementById('ag_titulo').value;
  const inicio = document.getElementById('ag_inicio').value;

  if (!titulo || !inicio) {
    notificacaoVexo("O Título e a Data de Início são obrigatórios!", "warning");
    return;
  }

  const sessao = JSON.parse(sessionStorage.getItem('usuarioLogado') || '{}');

  let tipoSelecionado = document.getElementById('ag_tipo') ? document.getElementById('ag_tipo').value : "Outros";
  let statusSelecionado = document.getElementById('ag_status') ? document.getElementById('ag_status').value : "Pendente";

  let corAutomatica = "#3b82f6";
  if (statusSelecionado === "Concluido") corAutomatica = "#10b981";
  if (statusSelecionado === "Cancelado") corAutomatica = "#ef4444";

  const payload = {
    id: document.getElementById('ag_id').value,
    titulo: titulo,
    cliente: document.getElementById('ag_cliente').value,
    tipo: tipoSelecionado, 
    status: statusSelecionado,
    inicio: inicio,
    fim: document.getElementById('ag_fim').value,
    cor: corAutomatica,
    obs: document.getElementById('ag_obs').value,
    vendedor: sessao.username || "SISTEMA"
  };

  btn.innerText = "⏳ SALVANDO...";
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(res) {
      fecharModalAgenda();
      carregarEventos(); 
      btn.innerText = "SALVAR COMPROMISSO";
      btn.disabled = false;
      
      // 🌟 INDICADOR VISUAL DE SINCRONIZAÇÃO COM GOOGLE AGENDA
      let mensagem = "✅ Compromisso salvo com sucesso!";
      let tipoMensagem = "success";
      
      // Verifica o status de sincronização retornado pelo backend
      if (res && res.syncStatus) {
        switch(res.syncStatus) {
          // Sincronização bem sucedida com o email do usuário
          case "CRIADO":
            mensagem = "✅ Compromisso salvo e agendado no seu Google Agenda! Você receberá uma notificação 15 minutos antes.";
            break;
          case "ATUALIZADO":
            mensagem = "🔄 Compromisso atualizado no seu Google Agenda. As alterações foram sincronizadas automaticamente.";
            break;
          case "CANCELADO_NO_GCAL":
            mensagem = "❌ Compromisso cancelado e removido do seu Google Agenda com sucesso!";
            break;
          case "CANCELADO_SEM_GCAL":
            mensagem = "❌ Compromisso cancelado com sucesso!";
            break;
          case "CANCELADO_SEM_EMAIL":
            mensagem = "❌ Compromisso cancelado com sucesso! (Sincronização não disponível)";
            tipoMensagem = "warning";
            break;
          
          // Sincronização com calendário padrão (fallback)
          case "CRIADO_PADRAO":
            mensagem = "✅ Compromisso salvo! 🔔 ATENÇÃO: Não foi possível sincronizar com seu Google Agenda. Verifique se seu email está cadastrado corretamente no sistema.";
            tipoMensagem = "warning";
            break;
          case "ATUALIZADO_PADRAO":
            mensagem = "🔄 Compromisso atualizado! 🔔 ATENÇÃO: As alterações não foram sincronizadas com seu Google Agenda. Verifique seu cadastro de email.";
            tipoMensagem = "warning";
            break;
          case "CRIADO_COM_CONVITE":
            mensagem = "✅ Compromisso salvo! 📧 Um convite foi enviado para seu email. Aceite-o para adicionar automaticamente ao seu Google Agenda.";
            break;
          case "ATUALIZADO_COM_CONVITE":
            mensagem = "🔄 Compromisso atualizado! 📧 Um novo convite foi enviado para seu email com as alterações.";
            break;
          case "USANDO_CALENDARIO_PADRAO":
            mensagem = "✅ Compromisso salvo! 🔔 Seu email não foi encontrado no sistema. Entre em contato com o administrador para configurar sua conta.";
            tipoMensagem = "warning";
            break;
          
          // Erros e alertas
          case "EMAIL_NAO_ENCONTRADO":
            mensagem = "⚠️ Compromisso salvo, mas não foi possível sincronizar com o Google Agenda. Seu email não está cadastrado na coluna E da aba USERS. Procure o administrador.";
            tipoMensagem = "warning";
            break;
          case "CALENDARIO_NAO_ENCONTRADO":
            mensagem = "⚠️ Compromisso salvo, mas não foi possível encontrar seu Google Agenda. Verifique se sua conta Google está ativa.";
            tipoMensagem = "warning";
            break;
          case "CALENDARIO_NAO_DISPONIVEL":
            mensagem = "⚠️ Compromisso salvo, mas nenhum calendário disponível para sincronização. Verifique suas configurações de conta.";
            tipoMensagem = "warning";
            break;
          case "SEM_SINCRONIA":
            mensagem = "✅ Compromisso salvo com sucesso!";
            break;
          case "ERRO_AO_CANCELAR":
            mensagem = "⚠️ Compromisso cancelado na planilha, mas houve um erro ao remover do Google Agenda. Verifique manualmente se o evento foi removido.";
            tipoMensagem = "warning";
            break;
          default:
            if (res.syncStatus && res.syncStatus.startsWith("ERRO:")) {
              mensagem = "⚠️ Compromisso salvo, mas ocorreu um erro na sincronização: " + res.syncStatus.replace("ERRO_", "");
              tipoMensagem = "warning";
            } else if (res.syncStatus && res.syncStatus.startsWith("ERRO_CRIACAO:")) {
              mensagem = "⚠️ Compromisso salvo, mas erro ao criar evento no Google Agenda: " + res.syncStatus.replace("ERRO_CRIACAO: ", "");
              tipoMensagem = "warning";
            }
        }
      }
      
      // Exibe a notificação personalizada
      if (typeof notificacaoVexo === 'function') {
        notificacaoVexo(mensagem, tipoMensagem);
      } else {
        alert(mensagem);
      }
    })
    .withFailureHandler(function(err) {
      notificacaoVexo("Erro de comunicação com o servidor: " + err, "error");
      btn.innerText = "SALVAR COMPROMISSO";
      btn.disabled = false;
    })
    .salvarAgendamentoVexo(payload);
}

function excluirAgendamento() {
  const id = document.getElementById('ag_id').value;
  if (!id) return;
  
  // Usar confirmação personalizada VEXO
  confirmarVexo(
    "ATENÇÃO: Você está prestes a CANCELAR este compromisso.\n\nEle será removido da sua agenda e também do Google Agenda (se sincronizado).\n\nDeseja continuar?",
    "Cancelar Compromisso",
    function() {
      // Usuário confirmou
      const btn = document.getElementById('btn-excluir-ag');
      const textoOriginal = btn.innerText;
      btn.innerText = "⏳ CANCELANDO...";
      btn.disabled = true;
      
      google.script.run
        .withSuccessHandler(function(res) {
          fecharModalAgenda();
          carregarEventos();
          btn.innerText = textoOriginal;
          btn.disabled = false;
          
          let mensagem = "Compromisso cancelado com sucesso!";
          let tipo = "success";
          
          if (res && res.syncStatus) {
            switch(res.syncStatus) {
              case "CANCELADO_NO_GCAL":
                mensagem = "Compromisso cancelado e removido do Google Agenda!";
                break;
              case "CANCELADO_SEM_EMAIL":
                mensagem = "Compromisso cancelado, mas email não encontrado para remover do Google Agenda.";
                tipo = "warning";
                break;
              case "CANCELADO_ERRO_GCAL":
                mensagem = "Compromisso cancelado, mas houve erro ao remover do Google Agenda: " + (res.erroMsg || "");
                tipo = "warning";
                break;
              default:
                mensagem = "Compromisso cancelado com sucesso!";
            }
          }
          
          notificacaoVexo(mensagem, tipo);
        })
        .withFailureHandler(function(err) {
          notificacaoVexo("Erro ao cancelar compromisso: " + err, "error");
          btn.innerText = textoOriginal;
          btn.disabled = false;
        })
        .excluirAgendamentoVexo(id);
    },
    function() {
      // Usuário cancelou - não fazer nada
      notificacaoVexo("Operação cancelada.", "info");
    }
  );
}

function atualizarDataEventoArraste(ev) {
  const payload = {
    id: ev.id,
    titulo: ev.title,
    cliente: ev.extendedProps.cliente,
    tipo: ev.extendedProps.tipo, 
    status: ev.extendedProps.status,
    inicio: ev.start.toISOString(),
    fim: ev.end ? ev.end.toISOString() : ev.start.toISOString(),
    cor: ev.backgroundColor,
    obs: ev.extendedProps.obs
  };
  google.script.run.salvarAgendamentoVexo(payload);
}

// Inicializar o calendário
iniciarAgendaVexo();
</script>
