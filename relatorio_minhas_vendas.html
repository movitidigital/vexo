<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  .mv-wrap { font-family: 'Poppins', sans-serif; color: #0f172a; padding: 4px; }
  .mv-filters {
    background: white; border-radius: 14px; padding: 20px 22px;
    border: 1px solid #e2e8f0; margin-bottom: 22px;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
  }
  .mv-field { display: flex; flex-direction: column; gap: 5px; min-width: 140px; }
  .mv-field label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .mv-field input, .mv-field select {
    padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
    font-family: inherit; font-size: 13px; outline: none; transition: 0.2s;
  }
  .mv-field input:focus, .mv-field select:focus { border-color: #0b1a3a; box-shadow: 0 0 0 3px rgba(11,26,58,0.08); }
  .mv-btn { padding: 10px 20px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
  .mv-btn-primary { background: #0b1a3a; color: white; }
  .mv-btn-primary:hover:not(:disabled) { background: #1a3060; }
  .mv-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .mv-btn-soft { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .mv-btn-soft:hover { background: #e2e8f0; }
  .mv-btn-pdf { background: #dc2626; color: white; }
  .mv-btn-pdf:hover:not(:disabled) { background: #b91c1c; }
  .mv-btn-xls { background: #16a34a; color: white; }
  .mv-btn-xls:hover:not(:disabled) { background: #15803d; }
  .mv-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .mv-hello {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white; border-radius: 14px; padding: 20px 24px;
    margin-bottom: 22px; display: flex; justify-content: space-between;
    align-items: center; flex-wrap: wrap; gap: 12px;
    box-shadow: 0 10px 25px rgba(30,58,138,0.22);
  }
  .mv-hello h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  .mv-hello small { opacity: 0.75; font-size: 11.5px; }
  .mv-hello .badge-role {
    background: rgba(255,255,255,0.12); padding: 6px 14px;
    border-radius: 20px; font-size: 10px; font-weight: 800;
    letter-spacing: 0.5px; text-transform: uppercase;
    text-align: right;
  }
  .mv-hello .badge-role b { color: #93c5fd; }

  .mv-kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px; margin-bottom: 22px;
  }
  .mv-kpi {
    background: white; border-radius: 14px; padding: 16px 18px;
    border: 1px solid #e2e8f0; position: relative;
  }
  .mv-kpi::before { content: ''; position: absolute; top: 0; left: 0; height: 3px; width: 100%; border-radius: 14px 14px 0 0; background: var(--c, #0b1a3a); }
  .mv-kpi-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .mv-kpi-value { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 4px; }
  .mv-kpi-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }

  .mv-tabela { background: white; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; }
  .mv-thead {
    padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .mv-thead h3 { margin: 0; font-size: 13px; font-weight: 800; color: #0b1a3a; }
  .mv-thead span { font-size: 11px; color: #64748b; }

  .mv-scroll { max-height: 620px; overflow-y: auto; }
  .mv-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .mv-tab th {
    text-align: left; padding: 10px 14px; background: #f8fafc;
    color: #475569; font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 2;
  }
  .mv-tab td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }
  .mv-tab tr:hover td { background: #f8fafc; }
  .mv-tab td.r { text-align: right; font-weight: 700; }
  .mv-tab td.mono { font-family: monospace; font-size: 11px; color: #1e3c72; }
  .mv-tab td.lancamento { font-size: 10.5px; color: #64748b; white-space: nowrap; }

  /* Link WhatsApp na coluna Linha */
  .mv-linha-wpp {
    display: inline-flex; align-items: center; gap: 4px;
    color: #0f172a; text-decoration: none; font-family: monospace;
    font-size: 11px; font-weight: 700;
    padding: 3px 7px; border-radius: 6px;
    background: #f0fdf4; border: 1px solid #bbf7d0;
    transition: 0.15s;
  }
  .mv-linha-wpp:hover {
    background: #25D366; color: white; border-color: #25D366;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(37, 211, 102, 0.3);
  }
  .mv-linha-sem-fone { color: #94a3b8; font-family: monospace; font-size: 11px; }

  /* Coluna Consultor — só aparece para gestão */
  .mv-col-consultor { display: none !important; }
  .mv-wrap.show-consultor .mv-col-consultor { display: table-cell !important; }
  .mv-tab thead .mv-col-consultor { display: none !important; }
  .mv-wrap.show-consultor .mv-tab thead .mv-col-consultor { display: table-cell !important; }

  .mv-badge {
    display: inline-block; padding: 3px 9px; border-radius: 12px;
    font-size: 10px; font-weight: 800; text-transform: uppercase;
  }
  .mv-badge.ativo   { background: #dcfce7; color: #166534; }
  .mv-badge.pend    { background: #fef3c7; color: #92400e; }
  .mv-badge.cancel  { background: #fee2e2; color: #991b1b; }
  .mv-badge.outros  { background: #f1f5f9; color: #475569; }

  .mv-vazio { padding: 60px; text-align: center; color: #94a3b8; }

  /* ═══════════ MULTI-SELECT CUSTOMIZADO ═══════════ */
  .mv-multi { position: relative; min-width: 200px; }
  .mv-multi-trigger {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
    background: white; cursor: pointer; font-size: 13px;
    font-family: inherit; min-height: 38px;
    transition: 0.2s; user-select: none;
  }
  .mv-multi-trigger:hover { border-color: #0b1a3a; }
  .mv-multi-trigger.aberto { border-color: #0b1a3a; box-shadow: 0 0 0 3px rgba(11,26,58,0.08); }
  .mv-multi-trigger .mv-multi-label {
    flex: 1; text-align: left; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: #0f172a;
  }
  .mv-multi-trigger .mv-multi-label.vazio { color: #94a3b8; }
  .mv-multi-trigger .mv-multi-seta {
    font-size: 10px; color: #64748b; margin-left: 8px;
    transition: transform 0.2s;
  }
  .mv-multi-trigger.aberto .mv-multi-seta { transform: rotate(180deg); }

  .mv-multi-painel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: white; border: 1.5px solid #cbd5e1; border-radius: 10px;
    box-shadow: 0 12px 28px -8px rgba(15,23,42,0.18);
    z-index: 100; display: none;
    max-height: 340px; overflow: hidden;
    flex-direction: column;
  }
  .mv-multi-painel.aberto { display: flex; }

  .mv-multi-busca { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
  .mv-multi-busca input {
    width: 100%; padding: 7px 10px; border: 1px solid #e2e8f0;
    border-radius: 7px; font-size: 12px; outline: none;
    font-family: inherit; box-sizing: border-box;
  }
  .mv-multi-busca input:focus { border-color: #0b1a3a; }

  .mv-multi-lista { overflow-y: auto; padding: 6px; flex: 1; }
  .mv-multi-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; color: #334155; user-select: none;
    transition: background 0.15s;
  }
  .mv-multi-opt:hover { background: #f1f5f9; }
  .mv-multi-opt input {
    accent-color: #0b1a3a; width: 15px; height: 15px; cursor: pointer;
    flex-shrink: 0;
  }
  .mv-multi-opt.escondido { display: none; }

  .mv-multi-rodape {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-top: 1px solid #e2e8f0;
    background: #f8fafc; gap: 8px;
  }
  .mv-multi-rodape button {
    padding: 6px 12px; border: none; border-radius: 7px;
    font-family: inherit; font-size: 11px; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .mv-multi-limpar { background: #f1f5f9; color: #475569; }
  .mv-multi-limpar:hover { background: #e2e8f0; }
  .mv-multi-aplicar { background: #0b1a3a; color: white; }
  .mv-multi-aplicar:hover { background: #1a3060; }
</style>

<div class="mv-wrap" id="mv-wrap">

  <!-- SAUDAÇÃO PERSONALIZADA -->
  <div class="mv-hello" id="mv-hello" style="display:none;">
    <div>
      <h2 id="mv-hello-nome">Olá! 👋</h2>
      <small id="mv-hello-sub">Veja suas vendas, ativações e comissões estimadas no período selecionado</small>
    </div>
    <div class="badge-role" id="mv-hello-role">—</div>
  </div>

  <!-- FILTROS -->
  <div class="mv-filters">
    <div class="mv-field">
      <label>Início</label>
      <input type="date" id="mv-ini">
    </div>
    <div class="mv-field">
      <label>Fim</label>
      <input type="date" id="mv-fim">
    </div>

    <div class="mv-field" id="mv-field-consultor" style="display:none;">
      <label>Consultores</label>
      <div class="mv-multi" id="mv-multi-consultor" data-tipo="consultor">
        <div class="mv-multi-trigger" data-tipo="consultor">
          <span class="mv-multi-label vazio" id="mv-label-consultor">Todos</span>
          <span class="mv-multi-seta">▼</span>
        </div>
        <div class="mv-multi-painel" id="mv-painel-consultor">
          <div class="mv-multi-busca">
            <input type="text" placeholder="🔍 Buscar consultor..." data-busca-tipo="consultor">
          </div>
          <div class="mv-multi-lista" id="mv-lista-consultor"></div>
          <div class="mv-multi-rodape">
            <button class="mv-multi-limpar" data-acao="limpar" data-tipo="consultor">Limpar</button>
            <button class="mv-multi-aplicar" data-acao="aplicar" data-tipo="consultor">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mv-field">
      <label>Modalidades</label>
      <div class="mv-multi" id="mv-multi-modalidade" data-tipo="modalidade">
        <div class="mv-multi-trigger" data-tipo="modalidade">
          <span class="mv-multi-label vazio" id="mv-label-modalidade">Todas</span>
          <span class="mv-multi-seta">▼</span>
        </div>
        <div class="mv-multi-painel" id="mv-painel-modalidade">
          <div class="mv-multi-busca">
            <input type="text" placeholder="🔍 Buscar modalidade..." data-busca-tipo="modalidade">
          </div>
          <div class="mv-multi-lista" id="mv-lista-modalidade"></div>
          <div class="mv-multi-rodape">
            <button class="mv-multi-limpar" data-acao="limpar" data-tipo="modalidade">Limpar</button>
            <button class="mv-multi-aplicar" data-acao="aplicar" data-tipo="modalidade">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mv-field">
      <label>Status</label>
      <div class="mv-multi" id="mv-multi-status" data-tipo="status">
        <div class="mv-multi-trigger" data-tipo="status">
          <span class="mv-multi-label vazio" id="mv-label-status">Todos</span>
          <span class="mv-multi-seta">▼</span>
        </div>
        <div class="mv-multi-painel" id="mv-painel-status">
          <div class="mv-multi-lista" id="mv-lista-status"></div>
          <div class="mv-multi-rodape">
            <button class="mv-multi-limpar" data-acao="limpar" data-tipo="status">Limpar</button>
            <button class="mv-multi-aplicar" data-acao="aplicar" data-tipo="status">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <button class="mv-btn mv-btn-primary" id="mv-btn-filtrar" onclick="MV.filtrar()">🔍 Filtrar</button>
    <button class="mv-btn mv-btn-soft" onclick="MV.limpar()">Limpar</button>
    <button class="mv-btn mv-btn-pdf" id="mv-btn-pdf" onclick="MV.exportarPDF()" disabled>📄 PDF</button>
    <button class="mv-btn mv-btn-xls" id="mv-btn-xls" onclick="MV.exportarExcel()" disabled>📊 Excel</button>
  </div>

  <!-- KPIs -->
  <div class="mv-kpis" id="mv-kpis"></div>

  <!-- TABELA -->
  <div class="mv-tabela">
    <div class="mv-thead">
      <h3 id="mv-titulo-tabela">📋 Minhas Vendas</h3>
      <span id="mv-info"></span>
    </div>
    <div class="mv-scroll">
      <table class="mv-tab">
        <thead>
          <tr>
            <th>Lançamento</th>
            <th>Ativação</th>
            <th>Venda</th>
            <th>Cliente</th>
            <th>CNPJ</th>
            <th>Modalidade</th>
            <th>Plano</th>
            <th>Linha</th>
            <th class="mv-col-consultor">Consultor</th>
            <th class="r">Valor</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="mv-tbody">
          <tr><td colspan="11" class="mv-vazio">Selecione o período e clique em Filtrar.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const fmt = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtInt = (v) => Number(v || 0).toLocaleString('pt-BR');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const soDigitos = (s) => String(s ?? '').replace(/\D/g, '');

  // 🔥 Formata timestamp ISO em "dd/mm/aaaa hh:mm"
  const fmtDataHora = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '—';
      return d.toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    } catch(e) { return '—'; }
  };

  let DADOS_ATUAIS = null;

  function getSb() {
    if (window.sb) return window.sb;
    try { if (typeof sb !== 'undefined' && sb) return sb; } catch(e) {}
    return null;
  }

  function toISO(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }

  // Helper: monta link do WhatsApp a partir do número da linha
  function getWhatsAppLink(numeroLinha) {
    const nums = soDigitos(numeroLinha);
    if (nums.length < 10) return null;
    return 'https://wa.me/55' + nums;
  }

  /* ═══════════════════════════════════════════════════════════
     MVMulti — Multi-select customizado (v3)
     ═══════════════════════════════════════════════════════════ */
  const MVMulti = (function() {
    const estado = {
      consultor:  { aplicados: new Set(), temp: new Set(), opcoes: [] },
      modalidade: { aplicados: new Set(), temp: new Set(), opcoes: [] },
      status:     { aplicados: new Set(), temp: new Set(), opcoes: [] }
    };

    const STATUS_OPCOES = [
      { valor: 'PENDENTE DE INPUT',        label: 'Pendente' },
      { valor: '1. INPUT REALIZADO',       label: 'Input Realizado' },
      { valor: '2. ANTIFRAUDE APROVADO',   label: 'Antifraude' },
      { valor: '3. DOCS VALIDADOS BOC',    label: 'Docs BOC' },
      { valor: '4. NOTA FISCAL EMITIDA',   label: 'NF Emitida' },
      { valor: '5. CONFIRMAÇÃO LOGÍSTICA', label: 'Logística' },
      { valor: '6. ATIVADO',               label: 'Ativado' }
    ];

    function getTipo(tipo) {
      if (tipo === 'status') return STATUS_OPCOES;
      return estado[tipo].opcoes;
    }

    function toggle(tipo) {
      const painel = document.getElementById('mv-painel-' + tipo);
      const trigger = document.querySelector('#mv-multi-' + tipo + ' .mv-multi-trigger');
      if (!painel || !trigger) return;

      const abrindo = !painel.classList.contains('aberto');

      ['consultor','modalidade','status'].forEach(t => {
        const p = document.getElementById('mv-painel-' + t);
        const tr = document.querySelector('#mv-multi-' + t + ' .mv-multi-trigger');
        if (p) p.classList.remove('aberto');
        if (tr) tr.classList.remove('aberto');
      });

      if (abrindo) {
        estado[tipo].temp = new Set(estado[tipo].aplicados);
        renderLista(tipo);
        painel.classList.add('aberto');
        trigger.classList.add('aberto');
        const busca = painel.querySelector('input[data-busca-tipo]');
        if (busca) setTimeout(() => busca.focus(), 50);
      }
    }

    function fechar(tipo) {
      const painel = document.getElementById('mv-painel-' + tipo);
      const trigger = document.querySelector('#mv-multi-' + tipo + ' .mv-multi-trigger');
      if (painel) painel.classList.remove('aberto');
      if (trigger) trigger.classList.remove('aberto');
    }

    function renderLista(tipo) {
      const lista = document.getElementById('mv-lista-' + tipo);
      if (!lista) return;
      const opcoes = getTipo(tipo);

      if (opcoes.length === 0) {
        lista.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:12px;">Nenhuma opção disponível</div>';
        return;
      }

      lista.innerHTML = opcoes.map(op => {
        const valor = typeof op === 'string' ? op : op.valor;
        const label = typeof op === 'string' ? op : op.label;
        const marcado = estado[tipo].temp.has(valor);
        return `<label class="mv-multi-opt" data-valor="${esc(valor)}" data-busca="${esc(label.toLowerCase())}">
          <input type="checkbox" ${marcado ? 'checked' : ''} data-item-tipo="${tipo}" data-item-valor="${esc(valor)}">
          <span>${esc(label)}</span>
        </label>`;
      }).join('');
    }

    function toggleItem(tipo, valor) {
      if (estado[tipo].temp.has(valor)) estado[tipo].temp.delete(valor);
      else estado[tipo].temp.add(valor);
    }

    function limpar(tipo) {
      estado[tipo].temp.clear();
      renderLista(tipo);
    }

    function aplicar(tipo) {
      estado[tipo].aplicados = new Set(estado[tipo].temp);
      atualizarLabel(tipo);
      fechar(tipo);
      if (typeof MV !== 'undefined' && MV.filtrar) MV.filtrar();
    }

    function atualizarLabel(tipo) {
      const label = document.getElementById('mv-label-' + tipo);
      if (!label) return;
      const sel = Array.from(estado[tipo].aplicados);

      if (sel.length === 0) {
        const padrao = tipo === 'status' ? 'Todos' : (tipo === 'consultor' ? 'Todos' : 'Todas');
        label.textContent = padrao;
        label.classList.add('vazio');
      } else if (sel.length === 1) {
        const opcoes = getTipo(tipo);
        const op = opcoes.find(o => (typeof o === 'string' ? o : o.valor) === sel[0]);
        label.textContent = typeof op === 'string' ? op : (op?.label || sel[0]);
        label.classList.remove('vazio');
      } else {
        label.textContent = `${sel.length} selecionados`;
        label.classList.remove('vazio');
      }
    }

    function filtrarBusca(tipo, termo) {
      const lista = document.getElementById('mv-lista-' + tipo);
      if (!lista) return;
      const t = termo.toLowerCase().trim();
      lista.querySelectorAll('.mv-multi-opt').forEach(el => {
        const busca = el.dataset.busca || '';
        el.classList.toggle('escondido', t && !busca.includes(t));
      });
    }

    function setOpcoes(tipo, arr) {
      estado[tipo].opcoes = (arr || []).filter(Boolean).map(String).sort((a,b) => 
        a.localeCompare(b, 'pt-BR')
      );
      const painel = document.getElementById('mv-painel-' + tipo);
      if (painel && painel.classList.contains('aberto')) renderLista(tipo);
    }

    function getValores(tipo) {
      const arr = Array.from(estado[tipo].aplicados);
      return arr.length === 0 ? null : arr;
    }

    function limparTudo() {
      ['consultor','modalidade','status'].forEach(t => {
        estado[t].aplicados.clear();
        estado[t].temp.clear();
        atualizarLabel(t);
      });
    }

    function initTriggers() {
      document.querySelectorAll('.mv-multi-trigger').forEach(trigger => {
        if (trigger.dataset.bind) return;
        trigger.dataset.bind = '1';
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          toggle(trigger.dataset.tipo);
        });
      });

      document.querySelectorAll('.mv-multi-lista').forEach(lista => {
        if (lista.dataset.bind) return;
        lista.dataset.bind = '1';
        lista.addEventListener('click', (e) => e.stopPropagation());
        lista.addEventListener('change', (e) => {
          const input = e.target;
          if (input.matches('input[type="checkbox"][data-item-tipo]')) {
            toggleItem(input.dataset.itemTipo, input.dataset.itemValor);
          }
        });
      });

      document.querySelectorAll('.mv-multi-rodape button').forEach(btn => {
        if (btn.dataset.bind) return;
        btn.dataset.bind = '1';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tipo = btn.dataset.tipo;
          const acao = btn.dataset.acao;
          if (acao === 'limpar') limpar(tipo);
          else if (acao === 'aplicar') aplicar(tipo);
        });
      });

      document.querySelectorAll('input[data-busca-tipo]').forEach(input => {
        if (input.dataset.bind) return;
        input.dataset.bind = '1';
        input.addEventListener('click', (e) => e.stopPropagation());
        input.addEventListener('input', (e) => {
          filtrarBusca(input.dataset.buscaTipo, e.target.value);
        });
      });

      if (!window._mvMultiGlobalBind) {
        window._mvMultiGlobalBind = true;
        document.addEventListener('click', (e) => {
          ['consultor','modalidade','status'].forEach(tipo => {
            const box = document.getElementById('mv-multi-' + tipo);
            if (box && box.contains(e.target)) return;
            fechar(tipo);
          });
        });
      }
    }

    return {
      toggle, toggleItem, limpar, aplicar, filtrarBusca,
      setOpcoes, getValores, limparTudo, atualizarLabel,
      initTriggers
    };
  })();

  window.MVMulti = MVMulti;

  function initDatas() {
    const hoje = new Date();
    const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
    if (!$('mv-ini').value) $('mv-ini').value = toISO(ini);
    if (!$('mv-fim').value) $('mv-fim').value = toISO(fim);
  }

  async function filtrar() {
    const sb = getSb();
    if (!sb) return alert('Supabase indisponível');

    const ini = $('mv-ini').value;
    const fim = $('mv-fim').value;
    if (!ini || !fim) return alert('Selecione o período');

    const btn = $('mv-btn-filtrar');
    btn.disabled = true; btn.textContent = '⏳ Carregando...';
    $('mv-tbody').innerHTML = `<tr><td colspan="11" class="mv-vazio">Carregando...</td></tr>`;

    const modalidades = MVMulti.getValores('modalidade');
    const statuses    = MVMulti.getValores('status');
    const consultores = MVMulti.getValores('consultor');

    try {
      const { data, error } = await sb.rpc('consultor_minhas_vendas', {
        p_inicio: ini,
        p_fim: fim,
        p_modalidades: modalidades,
        p_statuses: statuses,
        p_consultores: consultores
      });

      if (error) throw error;
      if (!data?.success) throw new Error(data?.message || 'Erro');

      DADOS_ATUAIS = data;
      render(data);

      $('mv-btn-pdf').disabled = false;
      $('mv-btn-xls').disabled = false;
    } catch (e) {
      console.error(e);
      $('mv-tbody').innerHTML = `<tr><td colspan="11" class="mv-vazio" style="color:#ef4444;">❌ ${esc(e.message||e)}</td></tr>`;
    } finally {
      btn.disabled = false; btn.textContent = '🔍 Filtrar';
    }
  }

  function render(d) {
    const t = d.totais || {};
    const isGestao = !!d.is_gestao;

    if (d.consultor) {
      $('mv-hello').style.display = 'flex';
      $('mv-hello-nome').textContent = `Olá, ${d.consultor.split(' ')[0]}! 👋`;

      if (isGestao) {
        $('mv-hello-sub').textContent = 'Visualize as vendas consolidadas da operação no período selecionado';
        const alvo = d.consultor_alvo
          ? `Vendo: <b>${esc(d.consultor_alvo)}</b>`
          : 'Vendo vendas de <b>todos os consultores</b>';
        $('mv-hello-role').innerHTML = `${esc(d.role)} · ${alvo}`;
      } else {
        $('mv-hello-sub').textContent = 'Veja suas vendas, ativações e comissões estimadas no período selecionado';
        $('mv-hello-role').textContent = d.role || '—';
      }
    }

    const fieldConsultor = $('mv-field-consultor');
    if (fieldConsultor) fieldConsultor.style.display = isGestao ? 'flex' : 'none';

    const wrap = $('mv-wrap');
    if (isGestao) wrap.classList.add('show-consultor');
    else wrap.classList.remove('show-consultor');

    $('mv-titulo-tabela').textContent = isGestao
      ? '📋 Vendas' + (d.consultor_alvo ? ` — ${d.consultor_alvo}` : ' — Todos os Consultores')
      : '📋 Minhas Vendas';

    const lblTotal = isGestao ? 'Total de Vendas' : 'Minhas Vendas';
    const lblPort  = isGestao ? 'Portabilidades' : 'Minhas Portabilidades';

    $('mv-kpis').innerHTML = `
      <div class="mv-kpi" style="--c:#0b1a3a;">
        <div class="mv-kpi-label">${lblTotal}</div>
        <div class="mv-kpi-value">${fmtInt(t.qtd_total)}</div>
        <div class="mv-kpi-sub">${fmt(t.valor_total)}</div>
      </div>
      <div class="mv-kpi" style="--c:#10b981;">
        <div class="mv-kpi-label">Ativadas</div>
        <div class="mv-kpi-value">${fmtInt(t.qtd_ativadas)}</div>
        <div class="mv-kpi-sub">${fmt(t.valor_ativado)}</div>
      </div>
      <div class="mv-kpi" style="--c:#f59e0b;">
        <div class="mv-kpi-label">Pendentes</div>
        <div class="mv-kpi-value">${fmtInt(t.qtd_pendentes)}</div>
        <div class="mv-kpi-sub">Aguardando ativação</div>
      </div>
      <div class="mv-kpi" style="--c:#a855f7;">
        <div class="mv-kpi-label">Ticket Médio</div>
        <div class="mv-kpi-value">${fmt(t.valor_medio)}</div>
        <div class="mv-kpi-sub">Por venda</div>
      </div>
      <div class="mv-kpi" style="--c:#3b82f6;">
        <div class="mv-kpi-label">${lblPort}</div>
        <div class="mv-kpi-value">${fmtInt(t.qtd_portabilidade)}</div>
        <div class="mv-kpi-sub">Linhas portadas</div>
      </div>
      <div class="mv-kpi" style="--c:#ef4444;">
        <div class="mv-kpi-label">Renegociações</div>
        <div class="mv-kpi-value">${fmtInt(t.qtd_renegociacao)}</div>
        <div class="mv-kpi-sub">Acordos</div>
      </div>`;

    popularFiltros(d.filtros_disponiveis || {}, isGestao);

    const vendas = d.vendas || [];
    $('mv-info').textContent = `${vendas.length} linha(s) · ${fmt(t.valor_total)}`;

    const colspan = isGestao ? 12 : 11;

    if (vendas.length === 0) {
      $('mv-tbody').innerHTML = `<tr><td colspan="${colspan}" class="mv-vazio">Nenhuma venda ${isGestao ? 'no período' : 'sua no período'}.</td></tr>`;
      return;
    }

    $('mv-tbody').innerHTML = vendas.map(v => {
      const status = String(v.status || '').toUpperCase();
      let badgeCls = 'outros';
      if (v.status_etapa === 6) badgeCls = 'ativo';
      else if (status.includes('CANCEL')) badgeCls = 'cancel';
      else if (status.includes('PENDENTE') || (v.status_etapa != null && v.status_etapa < 6)) badgeCls = 'pend';

      const tdConsultor = isGestao
        ? `<td class="mv-col-consultor">${esc(v.consultor || '—')}</td>`
        : '';

      // 🔥 CNPJ limpo (só dígitos)
      const cnpjLimpo = soDigitos(v.cnpj);

      // 🔥 Linha limpa (só dígitos) + link WhatsApp
      const linhaLimpa = soDigitos(v.numero_linha);
      const wppLink = getWhatsAppLink(linhaLimpa);
      const tdLinha = wppLink
        ? `<td><a class="mv-linha-wpp" href="${wppLink}" target="_blank" title="Abrir WhatsApp">💬 ${esc(linhaLimpa)}</a></td>`
        : `<td><span class="mv-linha-sem-fone">${esc(linhaLimpa || '—')}</span></td>`;

      // 🔥 Data de lançamento (created_at)
      const dataLanc = fmtDataHora(v.data_lancamento);

      return `<tr>
        <td class="lancamento">${esc(dataLanc)}</td>
        <td>${esc(v.data_ativacao || '—')}</td>
        <td>${esc(v.data_venda || '—')}</td>
        <td><strong>${esc(v.razao_social || '—')}</strong></td>
        <td class="mono">${esc(cnpjLimpo || '—')}</td>
        <td>${esc(v.modalidade || '—')}</td>
        <td>${esc(v.plano || '—')}</td>
        ${tdLinha}
        ${tdConsultor}
        <td class="r">${fmt(v.valor_numeric)}</td>
        <td><span class="mv-badge ${badgeCls}">${esc(v.status || '—')}</span></td>
      </tr>`;
    }).join('');
  }

  function popularFiltros(f, isGestao) {
    if (isGestao) {
      MVMulti.setOpcoes('consultor', f.consultores || []);
    }
    MVMulti.setOpcoes('modalidade', f.modalidades || []);
  }

  function limpar() {
    MVMulti.limparTudo();
    initDatas();
    filtrar();
  }

  // ═══════════════════════════════════════════════════════════
  // EXPORTAR PDF
  // ═══════════════════════════════════════════════════════════
  function exportarPDF() {
    if (!DADOS_ATUAIS) return;
    const d = DADOS_ATUAIS;
    const t = d.totais || {};
    const isGestao = !!d.is_gestao;

    const rows = (d.vendas || []).map(v => `
      <tr>
        <td>${esc(fmtDataHora(v.data_lancamento))}</td>
        <td>${esc(v.data_ativacao || '—')}</td>
        <td>${esc(v.razao_social || '—')}</td>
        <td>${esc(soDigitos(v.cnpj) || '—')}</td>
        <td>${esc(v.modalidade || '—')}</td>
        <td>${esc(v.plano || '—')}</td>
        <td>${esc(soDigitos(v.numero_linha) || '—')}</td>
        ${isGestao ? `<td>${esc(v.consultor || '—')}</td>` : ''}
        <td class="r">${fmt(v.valor_numeric)}</td>
      </tr>`).join('');

    const titulo = isGestao
      ? `Vendas ${d.consultor_alvo ? '· ' + esc(d.consultor_alvo) : '· Todos os Consultores'}`
      : `Minhas Vendas · ${esc(d.consultor || 'Consultor')}`;

    const thConsultor = isGestao ? '<th>Consultor</th>' : '';

    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Vendas</title>
<style>
  @page { size: A4 landscape; margin: 12mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; color: #0f172a; padding: 20px; }
  .head { border-bottom: 3px solid #0b1a3a; padding-bottom: 12px; margin-bottom: 18px; display:flex; justify-content:space-between; align-items:flex-end; }
  .head h1 { margin: 0; font-size: 18px; color: #0b1a3a; }
  .head .meta { text-align: right; font-size: 10px; color: #64748b; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
  .kpi { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 10px; }
  .kpi small { font-size: 8px; color: #64748b; text-transform: uppercase; font-weight: 700; }
  .kpi strong { display: block; font-size: 14px; color: #0f172a; margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 9px; }
  th { background: #f1f5f9; text-align: left; padding: 6px 8px; border-bottom: 1px solid #cbd5e1; font-size: 8px; text-transform: uppercase; color: #475569; }
  td { padding: 5px 8px; border-bottom: 1px solid #f1f5f9; }
  td.r { text-align: right; font-weight: 700; }
  .foot { margin-top: 20px; font-size: 9px; color: #94a3b8; text-align: center; }
  .no-print { text-align:center; margin-top:20px; }
  @media print { .no-print { display:none; } body { padding: 0; } }
</style></head><body>
  <div class="no-print">
    <button onclick="window.print()" style="padding:10px 24px;background:#0b1a3a;color:white;border:none;border-radius:8px;font-weight:700;cursor:pointer;">🖨️ Imprimir / Salvar PDF</button>
  </div>
  <div class="head">
    <div>
      <h1>${titulo}</h1>
      <small style="color:#64748b;">Período: ${d.periodo.inicio} a ${d.periodo.fim}</small>
    </div>
    <div class="meta"><div>Emitido em ${new Date().toLocaleString('pt-BR')}</div></div>
  </div>
  <div class="kpis">
    <div class="kpi"><small>Total</small><strong>${fmtInt(t.qtd_total)}</strong></div>
    <div class="kpi"><small>Valor Total</small><strong>${fmt(t.valor_total)}</strong></div>
    <div class="kpi"><small>Ativadas</small><strong>${fmtInt(t.qtd_ativadas)}</strong></div>
    <div class="kpi"><small>Pendentes</small><strong>${fmtInt(t.qtd_pendentes)}</strong></div>
    <div class="kpi"><small>Ticket Médio</small><strong>${fmt(t.valor_medio)}</strong></div>
    <div class="kpi"><small>Portabilidade</small><strong>${fmtInt(t.qtd_portabilidade)}</strong></div>
  </div>
  <table>
    <thead><tr>
      <th>Lançamento</th><th>Ativação</th><th>Cliente</th><th>CNPJ</th><th>Modalidade</th><th>Plano</th><th>Linha</th>
      ${thConsultor}
      <th class="r">Valor</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="foot">Gerado por VEXO Intelligent Management · ${new Date().toLocaleString('pt-BR')}</div>
</body></html>`;

    const w = window.open('', '_blank', 'width=1200,height=800');
    w.document.write(html);
    w.document.close();
  }

  // ═══════════════════════════════════════════════════════════
  // EXPORTAR EXCEL
  // ═══════════════════════════════════════════════════════════
  function exportarExcel() {
    if (!DADOS_ATUAIS) return;
    const d = DADOS_ATUAIS;
    const isGestao = !!d.is_gestao;

    const dados = (d.vendas || []).map(v => {
      const base = {
        'Lançamento': fmtDataHora(v.data_lancamento),
        'Data Ativação': v.data_ativacao || '',
        'Data Venda': v.data_venda || '',
        'Cliente': v.razao_social || '',
        'CNPJ': soDigitos(v.cnpj),
        'Modalidade': v.modalidade || '',
        'Plano': v.plano || '',
        'Linha': soDigitos(v.numero_linha),
        'Origem': v.origem || '',
        'Valor': Number(v.valor_numeric) || 0,
        'Status': v.status || ''
      };
      if (isGestao) base['Consultor'] = v.consultor || '';
      return base;
    });

    const ws = XLSX.utils.json_to_sheet(dados);

    ws['!cols'] = isGestao
      ? [{wch:17},{wch:12},{wch:12},{wch:35},{wch:20},{wch:18},{wch:25},{wch:15},{wch:14},{wch:25},{wch:12},{wch:22}]
      : [{wch:17},{wch:12},{wch:12},{wch:35},{wch:20},{wch:18},{wch:25},{wch:15},{wch:14},{wch:12},{wch:22}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Vendas');

    const sufixo = isGestao
      ? (d.consultor_alvo ? `_${d.consultor_alvo.replace(/\s+/g,'_')}` : '_todos')
      : '';

    XLSX.writeFile(wb, `vendas_${d.periodo.inicio}_a_${d.periodo.fim}${sufixo}.xlsx`);
  }

  function init() {
    initDatas();
    MVMulti.initTriggers();
    setTimeout(filtrar, 300);
  }

  window.MV = { filtrar, limpar, exportarPDF, exportarExcel };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else setTimeout(init, 100);
})();
</script>
</body>
</html>
