<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* --- VEXO PREMIUM BRANDING --- */
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    
    body { 
      background: #0f172a; /* Fundo escuro Slate Dark */
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden;
    }

    /* 1. TELA DE CARREGAMENTO (SPLASH) */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f172a; z-index: 10000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .splash-logo { width: 120px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }

    /* 2. CONTAINER PRINCIPAL (SPLIT-SCREEN) */
    .login-wrapper {
      display: none; /* Começa oculto */
      width: 1000px;
      max-width: 95%;
      min-height: 600px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 35px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .login-revelado {
      display: flex !important;
      opacity: 1 !important;
      transform: translateY(0) !important;
    }

    /* --- LADO ESQUERDO: FORMULÁRIO --- */
    .form-side {
      width: 50%;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: white;
    }
    
    .logo-container { margin-bottom: 20px; text-align: left; }
    .logo-vexo { width: 90px; height: auto; user-select: none; margin-bottom: 5px; }

    /* ESTILO SOLICITADO PARA O TÍTULO VEXO */
    .form-side h2 { 
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 5px 0;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .form-side p { color: #64748b; font-size: 14px; margin-bottom: 25px; }

    /* 🌟 NOVO: SELETOR DE ACESSO (MULTILOGIN) */
    .type-selector {
      display: flex; background: #f1f5f9; border-radius: 12px;
      padding: 5px; margin-bottom: 20px; border: 1px solid #e2e8f0;
    }
    .type-btn {
      flex: 1; background: transparent; border: none; color: #64748b;
      padding: 12px; border-radius: 10px; font-weight: 600; font-size: 13px;
      cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .type-btn:hover { color: #1e3c72; }
    .type-btn.active {
      background: white; color: #1e3c72; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .input-group { margin-bottom: 20px; position: relative; }
    .input-group label {
      display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    input {
      width: 100%; padding: 15px 20px; border: 2px solid #e2e8f0; border-radius: 12px;
      outline: none; transition: 0.3s; font-size: 15px; background: #f8fafc; color: #1e293b;
    }
    input:focus { border-color: #3b82f6; background: white; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

    button#btn-login {
      width: 100%; padding: 16px; border: none; border-radius: 12px;
      background: #0f172a; 
      color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2);
    }
    button#btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(15, 23, 42, 0.3); background: #1e293b; }
    button#btn-login:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }

    #status { margin-top: 20px; font-size: 13px; font-weight: 500; text-align: center; min-height: 20px; }

    .assinatura { 
      margin-top: 30px;
      text-align: center; 
      border-top: 1px solid #f1f5f9; 
      padding-top: 15px; 
    }
    .assinatura span { font-size: 10px; color: #94a3b8; letter-spacing: 1px; font-weight: 500; text-transform: uppercase;}
    .assinatura b { color: #1e3c72; font-size: 11px; margin-left: 5px; font-weight: 700; letter-spacing: 0.5px; }

    /* --- LADO DIREITO: BRANDING VISUAL --- */
    .brand-side {
      width: 50%;
      background: linear-gradient(135deg, #0f172a 0%, #1e3c72 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: white;
      text-align: center;
    }

    .glass-circle {
      position: absolute; border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
      backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05);
    }
    .c1 { width: 350px; height: 350px; top: -100px; right: -100px; }
    .c2 { width: 200px; height: 200px; bottom: -50px; left: -50px; }
    .c3 { width: 100px; height: 100px; top: 40%; left: 10%; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); opacity: 0.8; filter: blur(30px); }

    .brand-content { position: relative; z-index: 2; }
    .brand-icon { font-size: 48px; margin-bottom: 20px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    .brand-title { font-size: 28px; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.5px; line-height: 1.2; }
    .brand-desc { font-size: 14px; color: #94a3b8; line-height: 1.6; font-weight: 300; max-width: 80%; margin: 0 auto; }

    .loader { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 850px) {
      .login-wrapper { flex-direction: column; height: auto; min-height: 500px; width: 90%; }
      .brand-side { display: none; }
      .form-side { width: 100%; padding: 40px; }
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="https://www.weebly.com/editor/uploads/1/3/4/2/134260582/custom_themes/739339945850558639/files/vexo-imglogo.png" class="splash-logo" alt="Carregando VEXO">
    <div style="color: #64748b; letter-spacing: 3px; font-size: 11px; font-weight: 600;">INICIALIZANDO SISTEMA</div>
  </div>

  <div class="login-wrapper" id="login-box">
    
    <div class="form-side">
      <div class="logo-container">
        <img src="https://www.weebly.com/editor/uploads/1/3/4/2/134260582/custom_themes/739339945850558639/files/vexo-imglogo.png" alt="VEXO Logo" class="logo-vexo">
        <h2>VEXO</h2>
      </div>
      
      <p>Gestão Inteligente & Performance.</p>

      <div class="type-selector">
       <button type="button" class="type-btn active" id="btn-proprio">
  🏢 Equipe E&E
</button>
       <button type="button" class="type-btn" id="btn-parceiro">
  🤝 Parceiro
</button>
      </div>
      <input type="hidden" id="tipoAcesso" value="PROPRIO">
      
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" id="user" placeholder="Digite seu usuário" autocomplete="off">
      </div>
      
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="pass" placeholder="••••••••••••" autocomplete="off">
      </div>
      
      <button id="btn-login" onclick="executarLogin()">
        <span id="loader" class="loader"></span>
        <span id="btn-text">Acessar Painel</span>
      </button>
      
      <div id="status"></div>

      <div class="assinatura">
        <span>Desenvolvido por</span> <b>EWERTON BENEVIDES</b>
      </div>
    </div>

    <div class="brand-side">
      <div class="glass-circle c1"></div>
      <div class="glass-circle c2"></div>
      <div class="glass-circle c3"></div>
      
      <div class="brand-content">
        <div class="brand-icon">🚀</div>
        <h1 class="brand-title">Gestão Inteligente &<br>Performance</h1>
        <p class="brand-desc">Automatização de rotinas, gerenciamento de clientes B2B e controle total de operações em um ambiente blindado e veloz.</p>
      </div>
    </div>

  </div>

<script>
// ============================================
// CONFIGURAÇÃO DO BANCO DE DADOS (SUPABASE)
// ============================================
const supabaseUrl = 'https://supabase.com/dashboard/project/stibecxkiupfbarftftd';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0aWJlY3hraXVwZmJhcmZ0ZnRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzE4NDMsImV4cCI6MjEwNDYwNzg0M30.hsaGJAs7HQfI3tssAI1ONa8TtbCVtqwNB1j-7-z7BeI';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// ============================================
// FUNÇÕES DE PREFERÊNCIA (LOCALSTORAGE)
// ============================================
function salvarPreferencia(tipo) {
  localStorage.setItem('vexo_ultimo_acesso', tipo);
}

function carregarPreferencia() {
  const ultimo = localStorage.getItem('vexo_ultimo_acesso');
  if (ultimo && (ultimo === 'PROPRIO' || ultimo === 'PARCEIRO')) {
    return ultimo;
  }
  return 'PROPRIO';
}

function setTipoAcesso(tipo, salvar = true) {
  const inputTipo = document.getElementById('tipoAcesso');
  const btnProprio = document.getElementById('btn-proprio');
  const btnParceiro = document.getElementById('btn-parceiro');
  
  if (!inputTipo) return;
  inputTipo.value = tipo;
  
  if (btnProprio) tipo === 'PROPRIO' ? btnProprio.classList.add('active') : btnProprio.classList.remove('active');
  if (btnParceiro) tipo === 'PARCEIRO' ? btnParceiro.classList.add('active') : btnParceiro.classList.remove('active');
  
  if (salvar) salvarPreferencia(tipo);
}

function onProprioClick() { setTipoAcesso('PROPRIO', true); }
function onParceiroClick() { setTipoAcesso('PARCEIRO', true); }

// ============================================
// INTEGRAÇÃO DE LOGIN COM SUPABASE
// ============================================
async function executarLogin() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;
  const tipoAcesso = document.getElementById("tipoAcesso").value;
  const btn = document.getElementById("btn-login");
  const loader = document.getElementById("loader");
  const status = document.getElementById("status");

  if(!user || !pass) {
    status.innerHTML = "<span style='color:#ef4444'>Preencha e-mail e senha!</span>";
    return;
  }

  btn.disabled = true;
  if(loader) loader.style.display = "inline-block";
  status.innerHTML = "<span style='color:#64748b'>Autenticando no servidor seguro...</span>";

  // Chamada nativa para o Supabase
  const { data, error } = await supabase.auth.signInWithPassword({
    email: user, // Certifique-se de usar um e-mail no campo "Usuário"
    password: pass,
  });

  if (error) {
    status.innerHTML = "<span style='color:#ef4444'>Credenciais inválidas. Tente novamente.</span>";
    btn.disabled = false;
    if(loader) loader.style.display = "none";
  } else {
    // Sucesso no login
    sessionStorage.setItem('usuarioLogado', JSON.stringify(data.user));
    sessionStorage.setItem('tipoAcessoLogado', tipoAcesso);
    salvarPreferencia(tipoAcesso);
    
    status.innerHTML = "<span style='color:#10b981'>Acesso Liberado!</span>";
    carregarPainel(tipoAcesso);
  }
}

// ============================================
// TRANSIÇÃO PARA O PAINEL
// ============================================
function carregarPainel(tipoAcesso) {
  const box = document.getElementById('login-box');
  const splash = document.getElementById('splash-screen');
  const statusTexto = splash.querySelector('div') || splash.querySelector('p');

  if (box) box.classList.remove('login-revelado');
  
  setTimeout(() => {
    if (box) box.style.display = "none";
    if (splash) {
      splash.style.display = "flex";
      splash.style.opacity = "1";
      if (statusTexto) statusTexto.innerText = "CARREGANDO PAINEL MVT...";
    }

    // Redirecionamento de fato para o novo sistema
    const moduloDestino = (tipoAcesso === 'PARCEIRO') ? 'dashboard_parceiro.html' : 'dashboard.html';
    
    setTimeout(() => {
      window.location.href = moduloDestino;
    }, 1500);

  }, 300);
}

// ============================================
// INICIALIZAÇÃO
// ============================================
window.onload = function() {
  const box = document.getElementById('login-box');
  const splash = document.getElementById('splash-screen');
  
  const sessaoAtiva = sessionStorage.getItem('usuarioLogado');
  if (sessaoAtiva) {
    carregarPainel(sessionStorage.getItem('tipoAcessoLogado'));
    return;
  }
  
  setTipoAcesso(carregarPreferencia(), false);
  
  document.getElementById('btn-proprio').addEventListener('click', onProprioClick);
  document.getElementById('btn-parceiro').addEventListener('click', onParceiroClick);
  
  setTimeout(() => {
    splash.style.opacity = '0';
    setTimeout(() => {
      splash.style.display = 'none';
      box.classList.add('login-revelado');
      document.getElementById('user').focus();
    }, 500);
  }, 400);

  document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && box.classList.contains('login-revelado')) executarLogin();
  });
};



</script>
</body>
</html>
