<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Corporativo | Moviti Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#030712',
                        cardBg: 'rgba(17, 24, 39, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
            z-index: -1;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">

    <!-- Brilho de fundo decorativo -->
    <div class="glow-effect top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <div class="w-full max-w-md">
        <!-- Logo / Identidade -->
        <div class="text-center mb-8">
            <span class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent inline-block mb-2">
                MOVITI<span class="text-white font-light">.DIGITAL</span>
            </span>
            <p class="text-sm text-gray-400">Plataforma de Gestão e Inteligência</p>
        </div>

        <!-- Card de Login -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl border border-gray-800">
            <div class="mb-6">
                <h2 class="text-xl font-bold text-white mb-1">Acesso ao Sistema</h2>
                <p class="text-xs text-gray-400">Entre com suas credenciais corporativas para acessar o painel.</p>
            </div>

            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">E-mail Corporativo</label>
                    <input type="email" id="email" required class="w-full bg-gray-900/80 border border-gray-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="seu.nome@movitidigital.com.br">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400">Senha</label>
                        <a href="#" class="text-xs text-blue-400 hover:underline">Esqueceu a senha?</a>
                    </div>
                    <input type="password" id="password" required class="w-full bg-gray-900/80 border border-gray-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-sm transition-all shadow-lg shadow-blue-600/25">
                    Entrar no Sistema
                </button>
            </form>

            <!-- Área de Alerta / Simulação -->
            <div id="alertBox" class="mt-4 hidden p-3 rounded-xl bg-blue-500/10 border border-blue-500/20 text-xs text-blue-300 text-center">
                Autenticando credenciais na nuvem...
            </div>
        </div>

        <!-- Rodapé da Tela de Login -->
        <div class="text-center mt-8 text-xs text-gray-600">
            <p>&copy; 2026 Moviti Digital. Segurança e Controle de Acessos RBAC.</p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const alertBox = document.getElementById('alertBox');
            
            alertBox.classList.remove('hidden');
            alertBox.innerText = `Autenticando ${email} via ambiente seguro MVT...`;

            setTimeout(() => {
                alertBox.innerText = 'Login realizado com sucesso! Redirecionando...';
                alertBox.className = 'mt-4 p-3 rounded-xl bg-green-500/10 border border-green-500/20 text-xs text-green-300 text-center';
                
                // Aqui no futuro faremos a integração real com o backend ou Supabase
                setTimeout(() => {
                    alert('Simulação de Acesso Autorizado ao Core da Moviti Digital!');
                }, 800);
            }, 1200);
        }
    </script>
</body>
</html>
