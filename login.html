<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso | Moviti Digital</title>
    <!-- Tailwind CSS para estilização moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Google Fonts: Plus Jakarta Sans para tech/modernidade -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#030712',
                        cardBg: 'rgba(17, 24, 39, 0.7)',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        /* Efeito Glassmorphism refinado */
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-effect {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 50%, transparent 70%);
            z-index: -1;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased selection:bg-blue-500 selection:text-white overflow-x-hidden min-h-screen flex items-center justify-center p-6 relative">

    <!-- Brilho de fundo decorativo -->
    <div class="glow-effect top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <div class="w-full max-w-md">
        <!-- Logo / Identidade -->
        <div class="text-center mb-8">
            <span class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent inline-block mb-1">
                MOVITI<span class="text-white font-light">.DIGITAL</span>
            </span>
            <p class="text-xs text-gray-400 tracking-wide uppercase">Acesso ao Sistema</p>
        </div>

        <!-- Card de Login -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl border border-gray-800 relative z-10 group hover:-translate-y-1 transition-transform">
            
            <!-- Aqui inseriremos o ID do formulário do seu Apps Script -->
            <form id="formularioDeLogin" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Usuário / Matrícula</label>
                    <input type="text" required class="w-full bg-gray-900/80 border border-gray-700/80 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="Seu login">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Senha</label>
                    <input type="password" required class="w-full bg-gray-900/80 border border-gray-700/80 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full px-8 py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-center transition-all shadow-xl shadow-blue-600/20">
                    Entrar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
