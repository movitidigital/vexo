<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Dia — VEXO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Inter', 'Poppins', sans-serif;
    min-height: 100vh;
    color: #0f172a;
    background: #f4f7fb;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ═══════════════════════════════════════════════════════
     FUNDO — mesh gradient + orbes de luz animados
  ═══════════════════════════════════════════════════════ */
  .vx-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 10% 0%, #dbeafe 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 95% 10%, #f3e8ff 0%, transparent 50%),
      radial-gradient(ellipse 90% 70% at 50% 100%, #d1fae5 0%, transparent 55%),
      linear-gradient(180deg, #f8fafc 0%, #eef2f9 100%);
  }

  .vx-bg::before,
  .vx-bg::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: vxOrb 22s ease-in-out infinite;
  }
  .vx-bg::before {
    width: 480px; height: 480px;
    background: linear-gradient(135deg, #93c5fd, #c4b5fd);
    top: -120px; left: -100px;
  }
  .vx-bg::after {
    width: 560px; height: 560px;
    background: linear-gradient(135deg, #6ee7b7, #a5f3fc);
    bottom: -180px; right: -140px;
    animation-delay: -11s;
    opacity: 0.4;
  }
  @keyframes vxOrb {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(60px, -40px) scale(1.15); }
  }

  /* Grade de pontos sutil */
  .vx-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      radial-gradient(circle, rgba(15,23,42,0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 40%, black 30%, transparent 80%);
    pointer-events: none;
  }

  /* ═══════════════════════════════════════════════════════
     WRAPPER
  ═══════════════════════════════════════════════════════ */
  .vx-wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    position: relative;
  }

  /* ═══════════════════════════════════════════════════════
     GLASS BASE — o coração do glassmorphism
  ═══════════════════════════════════════════════════════ */
  .vx-glass {
    background: rgba(255, 255, 255, 0.62);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.75);
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 8px 24px rgba(15, 23, 42, 0.06),
      0 24px 48px -20px rgba(15, 23, 42, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  /* ═══════════════════════════════════════════════════════
     HEADER
  ═══════════════════════════════════════════════════════ */
  .vx-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 22px;
    border-radius: 20px;
    margin-bottom: 22px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .vx-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .vx-avatar {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 17px;
    color: white;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow:
      0 4px 12px rgba(59,130,246,0.28),
      inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
  }
  .vx-avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .vx-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .vx-greeting {
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .vx-date {
    font-size: 11.5px;
    color: #64748b;
    font-weight: 500;
    margin-top: 3px;
    letter-spacing: 0.1px;
  }

  .vx-btn-nova {
    background: linear-gradient(135deg, #0f172a 0%, #1e3c72 100%);
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    box-shadow:
      0 4px 14px rgba(15,23,42,0.22),
      inset 0 1px 0 rgba(255,255,255,0.15);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.2px;
  }
  .vx-btn-nova:hover {
    transform: translateY(-2px);
    box-shadow:
      0 8px 24px rgba(15,23,42,0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .vx-btn-nova:active { transform: translateY(0); }

  /* ═══════════════════════════════════════════════════════
     BLOCO META VIVA
  ═══════════════════════════════════════════════════════ */
  .vx-meta {
    border-radius: 28px;
    padding: 34px 32px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.78) 0%, rgba(255,255,255,0.55) 100%);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    box-shadow:
      0 1px 2px rgba(15, 23, 42, 0.04),
      0 12px 32px rgba(15, 23, 42, 0.07),
      0 32px 64px -24px rgba(15, 23, 42, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  /* Brilho interno no canto superior direito */
  .vx-meta::before {
    content: '';
    position: absolute;
    top: -100px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(139,92,246,0.18), transparent 65%);
    pointer-events: none;
  }
  /* Brilho inferior esquerdo */
  .vx-meta::after {
    content: '';
    position: absolute;
    bottom: -120px; left: -60px;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(59,130,246,0.14), transparent 65%);
    pointer-events: none;
  }

  .vx-meta-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 1.6px;
    color: #3b82f6;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding: 5px 12px;
    background: rgba(59,130,246,0.09);
    border: 1px solid rgba(59,130,246,0.18);
    border-radius: 20px;
    position: relative;
    z-index: 1;
  }

  .vx-meta-titulo {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1.2px;
    line-height: 1.15;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .vx-meta-titulo b {
    background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 900;
  }
  .vx-meta-titulo.ritmo-ok b {
    background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .vx-meta-titulo.ritmo-atraso b {
    background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Barra de progresso global */
  .vx-barra {
    height: 14px;
    background: rgba(15, 23, 42, 0.06);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
  }
  .vx-barra-fill {
    height: 100%;
    width: 0%;
    border-radius: 100px;
    background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 50%, #a855f7 100%);
    transition: width 1.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    position: relative;
    box-shadow:
      0 0 20px rgba(139,92,246,0.4),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  /* Brilho passando na barra */
  .vx-barra-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.5) 50%,
      transparent 100%);
    background-size: 200% 100%;
    animation: vxShine 3s ease-in-out infinite;
  }
  @keyframes vxShine {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .vx-barra-pct {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12.5px;
    color: #64748b;
    font-weight: 500;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
  }
  .vx-barra-pct b {
    color: #0f172a;
    font-weight: 800;
    font-size: 16px;
    font-family: 'Poppins', sans-serif;
    letter-spacing: -0.5px;
  }

  /* ═══════════════════════════════════════════════════════
     QUEBRA POR MODALIDADE
  ═══════════════════════════════════════════════════════ */
  .vx-quebra {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
    position: relative;
    z-index: 1;
  }

  .vx-quebra-item {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 18px;
    padding: 18px 18px 16px;
    box-shadow:
      0 2px 6px rgba(15, 23, 42, 0.04),
      0 12px 24px -10px rgba(15, 23, 42, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.3s;
    position: relative;
    overflow: hidden;
  }
  /* Faixa colorida no topo de cada card */
  .vx-quebra-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--cor);
    opacity: 0.85;
  }
  .vx-quebra-item:hover {
    transform: translateY(-3px);
    box-shadow:
      0 4px 12px rgba(15, 23, 42, 0.06),
      0 20px 40px -14px rgba(15, 23, 42, 0.14),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .vx-quebra-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .vx-quebra-nome {
    font-size: 10px;
    font-weight: 800;
    color: #64748b;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .vx-quebra-num {
    font-size: 11px;
    font-weight: 700;
    color: #334155;
    font-variant-numeric: tabular-nums;
  }

  .vx-quebra-barra {
    height: 6px;
    background: rgba(15, 23, 42, 0.06);
    border-radius: 100px;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  .vx-quebra-barra > div {
    height: 100%;
    border-radius: 100px;
    transition: width 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
    box-shadow: 0 0 12px var(--glow);
  }

  .vx-quebra-pct {
    font-size: 13px;
    font-weight: 800;
    font-family: 'Poppins', sans-serif;
    letter-spacing: -0.3px;
    font-variant-numeric: tabular-nums;
  }

  /* ═══════════════════════════════════════════════════════
     RODAPÉ — projeção + status
  ═══════════════════════════════════════════════════════ */
  .vx-meta-rodape {
    padding-top: 22px;
    border-top: 1px solid rgba(15, 23, 42, 0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    position: relative;
    z-index: 1;
  }

  .vx-projecao {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vx-projecao::before {
    content: '📊';
    font-size: 14px;
    opacity: 0.7;
  }
  .vx-projecao b {
    color: #0f172a;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .vx-status-ritmo {
    font-size: 11px;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 100px;
    letter-spacing: 0.6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.6),
      0 2px 8px rgba(0,0,0,0.04);
  }
  .vx-status-ritmo.ok {
    background: rgba(16,185,129,0.14);
    color: #047857;
    border: 1px solid rgba(16,185,129,0.25);
  }
  .vx-status-ritmo.atencao {
    background: rgba(245,158,11,0.14);
    color: #b45309;
    border: 1px solid rgba(245,158,11,0.28);
  }
  .vx-status-ritmo.critico {
    background: rgba(239,68,68,0.12);
    color: #b91c1c;
    border: 1px solid rgba(239,68,68,0.25);
  }

  /* Pulso discreto no status crítico */
  .vx-status-ritmo.critico::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 0 0 rgba(239,68,68,0.6);
    animation: vxPulse 1.8s infinite;
  }
  @keyframes vxPulse {
    0%   { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); }
    70%  { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
  }
  .vx-status-ritmo.ok::before,
  .vx-status-ritmo.atencao::before {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.9;
  }

  /* ═══════════════════════════════════════════════════════
     SKELETON (carregando)
  ═══════════════════════════════════════════════════════ */
  .vx-skel {
    background: linear-gradient(90deg,
      rgba(15,23,42,0.05) 25%,
      rgba(15,23,42,0.09) 50%,
      rgba(15,23,42,0.05) 75%);
    background-size: 200% 100%;
    animation: vxSkel 1.5s infinite;
    border-radius: 10px;
  }
  @keyframes vxSkel {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ═══════════════════════════════════════════════════════
     ERRO
  ═══════════════════════════════════════════════════════ */
  .vx-erro {
    padding: 44px 24px;
    text-align: center;
    color: #b91c1c;
    background: rgba(254,226,226,0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 20px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(239,68,68,0.08);
  }

  /* ═══════════════════════════════════════════════════════
     RESPONSIVO
  ═══════════════════════════════════════════════════════ */
  @media (max-width: 720px) {
    .vx-wrap { padding: 18px 16px 48px; }
    .vx-header { padding: 14px 16px; border-radius: 18px; }
    .vx-meta { padding: 24px 20px; border-radius: 24px; }
    .vx-meta-titulo { font-size: 24px; letter-spacing: -0.8px; }
    .vx-barra-pct b { font-size: 15px; }
    .vx-btn-nova { padding: 10px 16px; font-size: 12px; }
    .vx-quebra { grid-template-columns: 1fr; gap: 12px; }
    .vx-meta-rodape { flex-direction: column; align-items: stretch; }
    .vx-status-ritmo { justify-content: center; }
  }
</style>
</head>
<body>

<!-- Fundo decorativo -->
<div class="vx-bg"></div>
<div class="vx-grid"></div>

<div class="vx-wrap">

  <!-- ═══ HEADER ═══ -->
  <div class="vx-header vx-glass">
    <div class="vx-header-left">
      <div class="vx-avatar" id="vx-avatar">--</div>
      <div>
        <div class="vx-greeting" id="vx-greeting">Carregando...</div>
        <div class="vx-date" id="vx-date">--</div>
      </div>
    </div>
    <button class="vx-btn-nova"
            onclick="if(window.parent && window.parent.abrirModulo) window.parent.abrirModulo('vendas');">
      <span style="font-size: 14px;">＋</span> Nova venda
    </button>
  </div>

  <!-- ═══ META VIVA ═══ -->
  <div id="vx-meta-container">
    <div class="vx-meta">
      <div class="vx-skel" style="width: 180px; height: 22px; margin-bottom: 18px; border-radius: 20px;"></div>
      <div class="vx-skel" style="width: 65%; height: 30px; margin-bottom: 28px;"></div>
      <div class="vx-skel" style="width: 100%; height: 14px; margin-bottom: 14px; border-radius: 100px;"></div>
      <div class="vx-skel" style="width: 40%; height: 12px; margin-bottom: 30px;"></div>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
        <div class="vx-skel" style="height: 90px; border-radius: 18px;"></div>
        <div class="vx-skel" style="height: 90px; border-radius: 18px;"></div>
        <div class="vx-skel" style="height: 90px; border-radius: 18px;"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================================
// VEXO — Meu Dia — Bloco 1: Meta Viva (Light Glass)
// ============================================================

const VX_HOST = window.location.hostname;
const VX_IS_DEV =
  VX_HOST.includes('vercel.app') ||
  VX_HOST.startsWith('dev.') ||
  VX_HOST === 'localhost' ||
  VX_HOST === '127.0.0.1';

console.log(`🎯 VEXO Meu Dia (Light) — Ambiente: ${VX_IS_DEV ? 'DEV' : 'PROD'} | Host: ${VX_HOST}`);

const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MESES_NUM = {'JANEIRO':1,'FEVEREIRO':2,'MARÇO':3,'MARCO':3,'ABRIL':4,'MAIO':5,'JUNHO':6,'JULHO':7,'AGOSTO':8,'SETEMBRO':9,'OUTUBRO':10,'NOVEMBRO':11,'DEZEMBRO':12};

function vxParseValor(v) {
  if (!v) return 0;
  let s = String(v).replace('R$', '').trim();
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s.replace(/[^\d.-]/g, '')) || 0;
}

function vxParseData(str) {
  if (!str) return null;
  str = String(str).trim();
  if (str === '' || str === '-') return null;
  if (str.includes('T') || /^\d{4}-\d{2}-\d{2}/.test(str)) {
    const d = new Date(str);
    return isNaN(d.getTime()) ? null : d;
  }
  const p = str.split(' ')[0].split(/[\/\-]/);
  if (p.length === 3) {
    let ano = parseInt(p[2]); if (ano < 100) ano += 2000;
    const d = new Date(ano, parseInt(p[1]) - 1, parseInt(p[0]));
    return isNaN(d.getTime()) ? null : d;
  }
  return null;
}

function vxDiasUteis(ano, mes) {
  const dias = new Date(ano, mes, 0).getDate();
  let uteis = 0;
  for (let d = 1; d <= dias; d++) {
    const dow = new Date(ano, mes - 1, d).getDay();
    if (dow !== 0 && dow !== 6) uteis++;
  }
  return uteis;
}
function vxDiasUteisDecorridos(ano, mes) {
  const hoje = new Date();
  if (ano > hoje.getFullYear() || (ano === hoje.getFullYear() && mes > hoje.getMonth() + 1)) return 0;
  if (ano < hoje.getFullYear() || (ano === hoje.getFullYear() && mes < hoje.getMonth() + 1)) return vxDiasUteis(ano, mes);
  let uteis = 0;
  for (let d = 1; d <= hoje.getDate(); d++) {
    const dow = new Date(ano, mes - 1, d).getDay();
    if (dow !== 0 && dow !== 6) uteis++;
  }
  return uteis;
}

async function vxCarregarMeuDia() {
  try {
    await new Promise(res => {
      let tent = 0;
      const check = () => {
        if (window.sb) return res();
        if (++tent > 30) return res();
        setTimeout(check, 100);
      };
      check();
    });

    if (!window.sb) throw new Error('Supabase não carregou');

    const { data: { user } } = await sb.auth.getUser();
    if (!user) throw new Error('Usuário não logado');

    const { data: perfil } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (!perfil) throw new Error('Perfil não encontrado');

    console.log(`👤 ${perfil.nome} | cargo: ${perfil.role} | flag: ${perfil.use_new_dashboard}`);

    const hoje = new Date();
    const mesAtual = hoje.getMonth() + 1;
    const anoAtual = hoje.getFullYear();
    const mesNome = MESES[mesAtual - 1];

    const matricula = String(perfil.matricula || '').trim().toUpperCase();
    let metaFat = 0, metaPort = 0, metaAdit = 0;
    try {
      const { data: metas } = await sb
        .from('metas_time_mes')
        .select('*')
        .eq('ano', anoAtual);

      if (metas && metas.length) {
        const minhaMeta = metas.find(m => {
          const mNum = MESES_NUM[String(m.mes).toUpperCase()] || parseInt(m.mes);
          const mat = String(m.matricula || '').trim().toUpperCase();
          return mNum === mesAtual && mat === matricula;
        });
        if (minhaMeta) {
          metaFat = Number(minhaMeta.meta_target_fat) || 0;
          metaPort = Number(minhaMeta.meta_target_port) || 0;
          metaAdit = Number(minhaMeta.meta_target_adit) || 0;
        }
      }
    } catch (e) { console.warn('metas_time_mes:', e.message); }

    const { data: vendas } = await sb.from('VENDAS').select('*');

    let realGross = 0, realPort = 0, realAdit = 0;

    (vendas || []).forEach(v => {
      const status = String(v.status_do_pedido || '').toUpperCase().trim();
      if (status.includes('CANCELADO')) return;

      const d = vxParseData(v.data_de_ativacao_no_radar);
      if (!d) return;
      if (d.getMonth() + 1 !== mesAtual || d.getFullYear() !== anoAtual) return;

      const mat = String(v.consultor_que_vendeu || '').trim().toUpperCase();
      if (mat !== matricula) return;

      const mod = String(v.modalidade || '').toUpperCase();
      const valor = vxParseValor(v.valor_contratado);

      if (mod.includes('PORTABIL')) {
        realPort += valor;
      } else if (mod.includes('ADITIVO')) {
        realAdit += valor;
      } else if (mod.includes('ATIVA') || mod.includes('MIGRA')) {
        realGross += valor;
      }
    });

    renderizarMeuDia({
      perfil, mesNome, anoAtual, mesAtual,
      metaFat, metaPort, metaAdit,
      realGross, realPort, realAdit
    });

  } catch (err) {
    console.error('❌ Meu Dia erro:', err);
    document.getElementById('vx-meta-container').innerHTML = `
      <div class="vx-erro">
        <div style="font-size: 32px; margin-bottom: 10px;">⚠️</div>
        <b>Não foi possível carregar sua meta</b><br>
        <span style="color: #991b1b; font-size: 11.5px; opacity: 0.8;">${err.message}</span>
      </div>`;
  }
}

function renderizarMeuDia(d) {
  const { perfil, mesNome, anoAtual, metaFat, metaPort, metaAdit, realGross, realPort, realAdit } = d;

  // ---- Header ----
  const nome = [perfil.nome, perfil.sobrenome].filter(Boolean).join(' ') || 'Consultor';
  const iniciais = nome.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
  const avatarEl = document.getElementById('vx-avatar');
  if (perfil.photo_url) {
    avatarEl.innerHTML = `<img src="${perfil.photo_url}" alt="">`;
  } else {
    avatarEl.textContent = iniciais;
  }
  document.getElementById('vx-greeting').innerText = `Olá, ${nome.split(' ')[0]}`;

  const diasUteisTotal = vxDiasUteis(anoAtual, d.mesAtual);
  const diasUteisDec = vxDiasUteisDecorridos(anoAtual, d.mesAtual);
  document.getElementById('vx-date').innerText =
    `${mesNome.charAt(0) + mesNome.slice(1).toLowerCase()} ${anoAtual} · Dia útil ${diasUteisDec} de ${diasUteisTotal}`;

  // ---- Meta global ----
  const metaTotal = metaFat + metaPort + metaAdit;
  const realTotal = realGross + realPort + realAdit;
  const faltaTotal = Math.max(0, metaTotal - realTotal);
  const pctGlobal = metaTotal > 0 ? Math.min((realTotal / metaTotal) * 100, 100) : 0;

  const ritmo = diasUteisDec > 0 ? realTotal / diasUteisDec : 0;
  const projecao = ritmo * diasUteisTotal;
  const pctProjecao = metaTotal > 0 ? (projecao / metaTotal) * 100 : 0;

  let statusClasse, statusTexto, tituloClasse;
  if (metaTotal === 0) {
    statusClasse = 'atencao'; statusTexto = 'SEM META'; tituloClasse = '';
  } else if (pctProjecao >= 100) {
    statusClasse = 'ok'; statusTexto = 'NO RITMO'; tituloClasse = 'ritmo-ok';
  } else if (pctProjecao >= 80) {
    statusClasse = 'atencao'; statusTexto = 'ATENÇÃO'; tituloClasse = '';
  } else {
    statusClasse = 'critico'; statusTexto = 'ATRASADO'; tituloClasse = 'ritmo-atraso';
  }

  const fmt = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  let tituloHTML;
  if (metaTotal === 0) {
    tituloHTML = `Nenhuma meta definida pra <b>${mesNome}</b>`;
  } else if (faltaTotal <= 0) {
    tituloHTML = `🏆 <b>Meta batida!</b> Cada venda agora é bônus`;
  } else {
    tituloHTML = `Faltam <b>${fmt(faltaTotal)}</b> pra bater ${mesNome.charAt(0) + mesNome.slice(1).toLowerCase()}`;
  }

  // ---- Quebras ----
  const quebras = [
    { nome: 'Gross',       feito: realGross, meta: metaFat,  cor: '#3b82f6', glow: 'rgba(59,130,246,0.5)',  pct: metaFat  > 0 ? Math.min((realGross/metaFat)*100, 100)  : 0 },
    { nome: 'Portabilidade', feito: realPort, meta: metaPort, cor: '#8b5cf6', glow: 'rgba(139,92,246,0.5)', pct: metaPort > 0 ? Math.min((realPort/metaPort)*100, 100) : 0 },
    { nome: 'Aditivo',     feito: realAdit,  meta: metaAdit, cor: '#10b981', glow: 'rgba(16,185,129,0.5)', pct: metaAdit > 0 ? Math.min((realAdit/metaAdit)*100, 100)  : 0 }
  ];

  const quebraHTML = quebras.map(q => `
    <div class="vx-quebra-item" style="--cor: ${q.cor}; --glow: ${q.glow};">
      <div class="vx-quebra-topo">
        <span class="vx-quebra-nome">${q.nome}</span>
        <span class="vx-quebra-num">${fmt(q.feito)} / ${fmt(q.meta)}</span>
      </div>
      <div class="vx-quebra-barra">
        <div style="width: ${q.pct}%; background: linear-gradient(90deg, ${q.cor}, ${q.cor}dd);"></div>
      </div>
      <div class="vx-quebra-pct" style="color: ${q.cor};">${q.pct.toFixed(0)}%</div>
    </div>
  `).join('');

  const projecaoTexto = metaTotal > 0
    ? (pctProjecao >= 100
        ? `Projeção: bate meta em <b>${Math.ceil((metaTotal / (ritmo || 1)))}</b> dias úteis`
        : `No ritmo atual, você bate <b>${pctProjecao.toFixed(0)}%</b> da meta`)
    : 'Defina uma meta pra ver a projeção';

  const container = document.getElementById('vx-meta-container');
  container.innerHTML = `
    <div class="vx-meta">
      <div class="vx-meta-label">
        <span>🎯</span> Meta Viva · ${mesNome} ${anoAtual}
      </div>
      <div class="vx-meta-titulo ${tituloClasse}">${tituloHTML}</div>

      <div class="vx-barra">
        <div class="vx-barra-fill" style="width: ${pctGlobal}%;"></div>
      </div>
      <div class="vx-barra-pct">
        <span>${fmt(realTotal)} de ${fmt(metaTotal)}</span>
        <b>${pctGlobal.toFixed(1)}%</b>
      </div>

      <div class="vx-quebra">${quebraHTML}</div>

      <div class="vx-meta-rodape">
        <div class="vx-projecao">${projecaoTexto}</div>
        <div class="vx-status-ritmo ${statusClasse}">${statusTexto}</div>
      </div>
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', vxCarregarMeuDia);
</script>
</body>
</html>
