<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  .rc-wrap { font-family: 'Poppins', sans-serif; color: #0f172a; padding: 4px; }

  /* ═══════════ TOGGLE LOJA/PARCEIROS ═══════════ */
  .rc-toggle {
    display: inline-flex; background: #f1f5f9; border-radius: 14px;
    padding: 4px; gap: 4px; margin-bottom: 20px; border: 1px solid #e2e8f0;
  }
  .rc-toggle-btn {
    padding: 12px 24px; border: none; background: transparent;
    font-family: inherit; font-size: 13px; font-weight: 700;
    color: #64748b; cursor: pointer; border-radius: 10px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: 0.2s;
  }
  .rc-toggle-btn:hover { color: #0f172a; }
  .rc-toggle-btn.ativo {
    background: white; color: #0b1a3a;
    box-shadow: 0 2px 8px rgba(11,26,58,0.12);
  }

  /* ═══════════ FILTROS ═══════════ */
  .rc-filters {
    background: white; border-radius: 14px; padding: 20px 22px;
    border: 1px solid #e2e8f0; margin-bottom: 22px;
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
  }
  .rc-field { display: flex; flex-direction: column; gap: 5px; min-width: 140px; }
  .rc-field label { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .rc-field input, .rc-field select {
    padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
    font-family: inherit; font-size: 13px; outline: none; transition: 0.2s;
    background: white;
  }
  .rc-field input:focus, .rc-field select:focus { border-color: #0b1a3a; box-shadow: 0 0 0 3px rgba(11,26,58,0.08); }
  .rc-btn { padding: 10px 20px; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
  .rc-btn-primary { background: #0b1a3a; color: white; }
  .rc-btn-primary:hover:not(:disabled) { background: #1a3060; }
  .rc-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .rc-btn-soft { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .rc-btn-soft:hover { background: #e2e8f0; }
  .rc-btn-pdf { background: #dc2626; color: white; }
  .rc-btn-pdf:hover:not(:disabled) { background: #b91c1c; }
  .rc-btn-xls { background: #16a34a; color: white; }
  .rc-btn-xls:hover:not(:disabled) { background: #15803d; }
  .rc-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ═══════════ KPIs COM COMPARATIVO ═══════════ */
  .rc-kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 22px;
  }
  .rc-kpi {
    background: white; border-radius: 14px; padding: 16px 18px;
    border: 1px solid #e2e8f0; position: relative;
  }
  .rc-kpi::before { content: ''; position: absolute; top: 0; left: 0; height: 3px; width: 100%; border-radius: 14px 14px 0 0; background: var(--c, #0b1a3a); }
  .rc-kpi-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .rc-kpi-value { font-size: 22px; font-weight: 800; color: #0f172a; margin-top: 4px; }
  .rc-kpi-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .rc-kpi-delta {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 800; padding: 2px 7px;
    border-radius: 8px; margin-top: 6px;
  }
  .rc-delta-up   { background: #dcfce7; color: #166534; }
  .rc-delta-down { background: #fee2e2; color: #991b1b; }
  .rc-delta-flat { background: #f1f5f9; color: #64748b; }

  /* ═══════════ PIPELINE ═══════════ */
  .rc-pipe {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 22px;
  }
  .rc-pipe-card {
    background: white; border-radius: 12px; padding: 14px 16px;
    border: 1px solid #e2e8f0; text-align: center;
  }
  .rc-pipe-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .rc-pipe-val { font-size: 22px; font-weight: 900; }
  .rc-pipe-card.ok    .rc-pipe-label { color: #166534; }
  .rc-pipe-card.pend  .rc-pipe-label { color: #92400e; }
  .rc-pipe-card.cancel .rc-pipe-label { color: #991b1b; }
  .rc-pipe-card.taxa  .rc-pipe-label { color: #1e40af; }
  .rc-pipe-card.ok    .rc-pipe-val { color: #059669; }
  .rc-pipe-card.pend  .rc-pipe-val { color: #d97706; }
  .rc-pipe-card.cancel .rc-pipe-val { color: #dc2626; }
  .rc-pipe-card.taxa  .rc-pipe-val { color: #3b82f6; }

  /* ═══════════ GRÁFICO ═══════════ */
  .rc-graf-box {
    background: white; border-radius: 14px; border: 1px solid #e2e8f0;
    padding: 20px 24px; margin-bottom: 22px;
  }
  .rc-graf-box h3 { margin: 0 0 4px; font-size: 14px; font-weight: 800; color: #0b1a3a; }
  .rc-graf-box p { margin: 0 0 16px; font-size: 11px; color: #64748b; }
  .rc-graf-inner { position: relative; height: 320px; }

  /* ═══════════ TABELA ═══════════ */
  .rc-tabela { background: white; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; }
  .rc-thead {
    padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
  }
  .rc-thead h3 { margin: 0; font-size: 13px; font-weight: 800; color: #0b1a3a; }
  .rc-thead span { font-size: 11px; color: #64748b; }
  .rc-scroll { max-height: 620px; overflow-y: auto; }
  .rc-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
  .rc-tab th {
    text-align: left; padding: 10px 14px; background: #f8fafc;
    color: #475569; font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.5px;
    border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 2;
  }
  .rc-tab td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; }
  .rc-tab tr:hover td { background: #f8fafc; }
  .rc-tab td.r { text-align: right; font-weight: 700; }
  .rc-tab td.mono { font-family: monospace; font-size: 11px; color: #1e3c72; }
  .rc-tab td.c { text-align: center; }

  .rc-pos {
    display: inline-block; width: 28px; height: 28px; line-height: 28px;
    border-radius: 50%; text-align: center; font-weight: 800; font-size: 12px;
    background: #f1f5f9; color: #475569;
  }
  .rc-pos.p1 { background: #fef3c7; color: #92400e; }
  .rc-pos.p2 { background: #e2e8f0; color: #475569; }
  .rc-pos.p3 { background: #fed7aa; color: #9a3412; }

  .rc-bar-mini {
    height: 6px; border-radius: 6px; background: #f1f5f9;
    overflow: hidden; margin-top: 4px;
  }
  .rc-bar-mini > div { height: 100%; background: #10b981; transition: width 0.6s; }

  .rc-badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
  .rc-badge.terceiro   { background: #dbeafe; color: #1e40af; }
  .rc-badge.freelancer { background: #fce7f3; color: #9d174d; }

  .rc-vazio { padding: 60px; text-align: center; color: #94a3b8; }

  /* ═══════════ MULTI-SELECT (padrão MVMulti) ═══════════ */
  .rc-multi { position: relative; min-width: 180px; }
  .rc-multi-trigger {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border: 1.5px solid #cbd5e1; border-radius: 9px;
    background: white; cursor: pointer; font-size: 13px;
    font-family: inherit; min-height: 38px;
    transition: 0.2s; user-select: none;
  }
  .rc-multi-trigger:hover { border-color: #0b1a3a; }
  .rc-multi-trigger.aberto { border-color: #0b1a3a; box-shadow: 0 0 0 3px rgba(11,26,58,0.08); }
  .rc-multi-label { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #0f172a; }
  .rc-multi-label.vazio { color: #94a3b8; }
  .rc-multi-seta { font-size: 10px; color: #64748b; margin-left: 8px; transition: transform 0.2s; }
  .rc-multi-trigger.aberto .rc-multi-seta { transform: rotate(180deg); }
  .rc-multi-painel {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: white; border: 1.5px solid #cbd5e1; border-radius: 10px;
    box-shadow: 0 12px 28px -8px rgba(15,23,42,0.18);
    z-index: 100; display: none; max-height: 340px; overflow: hidden;
    flex-direction: column;
  }
  .rc-multi-painel.aberto { display: flex; }
  .rc-multi-busca { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
  .rc-multi-busca input {
    width: 100%; padding: 7px 10px; border: 1px solid #e2e8f0;
    border-radius: 7px; font-size: 12px; outline: none; font-family: inherit;
    box-sizing: border-box;
  }
  .rc-multi-lista { overflow-y: auto; padding: 6px; flex: 1; }
  .rc-multi-opt {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; color: #334155; user-select: none;
    transition: background 0.15s;
  }
  .rc-multi-opt:hover { background: #f1f5f9; }
  .rc-multi-opt input { accent-color: #0b1a3a; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
  .rc-multi-opt.escondido { display: none; }
  .rc-multi-rodape {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #f8fafc; gap: 8px;
  }
  .rc-multi-rodape button {
    padding: 6px 12px; border: none; border-radius: 7px;
    font-family: inherit; font-size: 11px; font-weight: 700;
    cursor: pointer; transition: 0.15s;
  }
  .rc-multi-limpar { background: #f1f5f9; color: #475569; }
  .rc-multi-aplicar { background: #0b1a3a; color: white; }
</style>

<div class="rc-wrap" id="rc-wrap">

  <!-- TOGGLE -->
  <div class="rc-toggle">
    <button class="rc-toggle-btn ativo" id="rc-tab-loja" onclick="RC.setModo('loja')">
      🏢 Consolidado da Loja
    </button>
    <button class="rc-toggle-btn" id="rc-tab-parceiros" onclick="RC.setModo('parceiros')">
      🤝 Consolidado de Parceiros
    </button>
  </div>

  <!-- FILTROS -->
  <div class="rc-filters">
    <div class="rc-field">
      <label>Mês</label>
      <select id="rc-mes">
        <option value="1">Janeiro</option><option value="2">Fevereiro</option>
        <option value="3">Março</option><option value="4">Abril</option>
        <option value="5">Maio</option><option value="6">Junho</option>
        <option value="7">Julho</option><option value="8">Agosto</option>
        <option value="9">Setembro</option><option value="10">Outubro</option>
        <option value="11">Novembro</option><option value="12">Dezembro</option>
      </select>
    </div>
    <div class="rc-field">
      <label>Ano</label>
      <select id="rc-ano">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
      </select>
    </div>
    <div class="rc-field">
      <label>Data Início (opcional)</label>
      <input type="date" id="rc-ini">
    </div>
    <div class="rc-field">
      <label>Data Fim (opcional)</label>
      <input type="date" id="rc-fim">
    </div>

    <div class="rc-field" id="rc-field-tipo" style="display:none;">
      <label>Tipo</label>
      <select id="rc-tipo">
        <option value="">Todos</option>
        <option value="TERCEIRO">Terceiros</option>
        <option value="FREELANCER">Freelancers</option>
      </select>
    </div>

    <div class="rc-field">
      <label>Modalidades</label>
      <div class="rc-multi" id="rc-multi-modalidade" data-tipo="modalidade">
        <div class="rc-multi-trigger" data-tipo="modalidade">
          <span class="rc-multi-label vazio" id="rc-label-modalidade">Todas</span>
          <span class="rc-multi-seta">▼</span>
        </div>
        <div class="rc-multi-painel" id="rc-painel-modalidade">
          <div class="rc-multi-busca">
            <input type="text" placeholder="🔍 Buscar..." data-busca-tipo="modalidade">
          </div>
          <div class="rc-multi-lista" id="rc-lista-modalidade"></div>
          <div class="rc-multi-rodape">
            <button class="rc-multi-limpar" data-acao="limpar" data-tipo="modalidade">Limpar</button>
            <button class="rc-multi-aplicar" data-acao="aplicar" data-tipo="modalidade">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="rc-field">
      <label>Status</label>
      <div class="rc-multi" id="rc-multi-status" data-tipo="status">
        <div class="rc-multi-trigger" data-tipo="status">
          <span class="rc-multi-label vazio" id="rc-label-status">Todos</span>
          <span class="rc-multi-seta">▼</span>
        </div>
        <div class="rc-multi-painel" id="rc-painel-status">
          <div class="rc-multi-lista" id="rc-lista-status"></div>
          <div class="rc-multi-rodape">
            <button class="rc-multi-limpar" data-acao="limpar" data-tipo="status">Limpar</button>
            <button class="rc-multi-aplicar" data-acao="aplicar" data-tipo="status">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <button class="rc-btn rc-btn-primary" id="rc-btn-filtrar" onclick="RC.filtrar()">🔍 Filtrar</button>
    <button class="rc-btn rc-btn-soft" onclick="RC.limpar()">Limpar</button>
    <button class="rc-btn rc-btn-pdf" id="rc-btn-pdf" onclick="RC.exportarPDF()" disabled>📄 PDF</button>
    <button class="rc-btn rc-btn-xls" id="rc-btn-xls" onclick="RC.exportarExcel()" disabled>📊 Excel</button>
  </div>

  <!-- KPIs -->
  <div class="rc-kpis" id="rc-kpis"></div>

  <!-- PIPELINE -->
  <div class="rc-pipe" id="rc-pipe"></div>

  <!-- GRÁFICO -->
  <div class="rc-graf-box">
    <h3 id="rc-graf-titulo">📈 Evolução dos Últimos 12 Meses</h3>
    <p id="rc-graf-sub">Faturamento ativado mês a mês</p>
    <div class="rc-graf-inner">
      <canvas id="rc-grafico"></canvas>
    </div>
  </div>

  <!-- TABELA -->
  <div class="rc-tabela">
    <div class="rc-thead">
      <h3 id="rc-titulo-tabela">📋 Consolidado por Consultor</h3>
      <span id="rc-info"></span>
    </div>
    <div class="rc-scroll">
      <table class="rc-tab">
        <thead id="rc-thead-tabela"></thead>
        <tbody id="rc-tbody">
          <tr><td colspan="10" class="rc-vazio">Selecione o período e clique em Filtrar.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const fmt = (v) => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtInt = (v) => Number(v || 0).toLocaleString('pt-BR');
  const fmtPerc = (v) => Number(v || 0).toFixed(1) + '%';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const soDigitos = (s) => String(s ?? '').replace(/\D/g, '');

  let MODO = 'loja';
  let DADOS_ATUAIS = null;
  let CHART = null;

  function getSb() {
    if (window.sb) return window.sb;
    try { if (typeof sb !== 'undefined' && sb) return sb; } catch(e) {}
    return null;
  }

  // ═══════════════════════════════════════════════════════════
  // MULTI-SELECT (versão simplificada do MVMulti)
  // ═══════════════════════════════════════════════════════════
  const RCMulti = (function() {
    const estado = {
      modalidade: { aplicados: new Set(), temp: new Set(), opcoes: [] },
      status:     { aplicados: new Set(), temp: new Set(), opcoes: [] }
    };

    const STATUS_OPCOES = [
      { valor: 'PENDENTE DE INPUT',        label: 'Pendente' },
      { valor: '1. INPUT REALIZADO',       label: 'Input Realizado' },
      { valor: '2. ANTIFRAUDE APROVADO',   label: 'Antifraude' },
      { valor: '3. DOCS VALIDADOS BOC',    label: 'Docs BOC' },
      { valor: '4. NOTA FISCAL EMITIDA',   label: 'NF Emitida' },
      { valor: '5. CONFIRMAÇÃO LOGÍSTICA', label: 'Logística' },
      { valor: '6. ATIVADO',               label: 'Ativado' }
    ];

    function getTipo(tipo) {
      if (tipo === 'status') return STATUS_OPCOES;
      return estado[tipo].opcoes;
    }

    function toggle(tipo) {
      const painel = document.getElementById('rc-painel-' + tipo);
      const trigger = document.querySelector('#rc-multi-' + tipo + ' .rc-multi-trigger');
      if (!painel || !trigger) return;
      const abrindo = !painel.classList.contains('aberto');
      ['modalidade','status'].forEach(t => {
        const p = document.getElementById('rc-painel-' + t);
        const tr = document.querySelector('#rc-multi-' + t + ' .rc-multi-trigger');
        if (p) p.classList.remove('aberto');
        if (tr) tr.classList.remove('aberto');
      });
      if (abrindo) {
        estado[tipo].temp = new Set(estado[tipo].aplicados);
        renderLista(tipo);
        painel.classList.add('aberto');
        trigger.classList.add('aberto');
      }
    }

    function fechar(tipo) {
      const painel = document.getElementById('rc-painel-' + tipo);
      const trigger = document.querySelector('#rc-multi-' + tipo + ' .rc-multi-trigger');
      if (painel) painel.classList.remove('aberto');
      if (trigger) trigger.classList.remove('aberto');
    }

    function renderLista(tipo) {
      const lista = document.getElementById('rc-lista-' + tipo);
      if (!lista) return;
      const opcoes = getTipo(tipo);
      if (opcoes.length === 0) {
        lista.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:12px;">Nenhuma opção</div>';
        return;
      }
      lista.innerHTML = opcoes.map(op => {
        const valor = typeof op === 'string' ? op : op.valor;
        const label = typeof op === 'string' ? op : op.label;
        const marcado = estado[tipo].temp.has(valor);
        return `<label class="rc-multi-opt" data-valor="${esc(valor)}" data-busca="${esc(label.toLowerCase())}">
          <input type="checkbox" ${marcado ? 'checked' : ''} data-item-tipo="${tipo}" data-item-valor="${esc(valor)}">
          <span>${esc(label)}</span>
        </label>`;
      }).join('');
    }

    function toggleItem(tipo, valor) {
      if (estado[tipo].temp.has(valor)) estado[tipo].temp.delete(valor);
      else estado[tipo].temp.add(valor);
    }

    function limpar(tipo) { estado[tipo].temp.clear(); renderLista(tipo); }

    function aplicar(tipo) {
      estado[tipo].aplicados = new Set(estado[tipo].temp);
      atualizarLabel(tipo);
      fechar(tipo);
    }

    function atualizarLabel(tipo) {
      const label = document.getElementById('rc-label-' + tipo);
      if (!label) return;
      const sel = Array.from(estado[tipo].aplicados);
      if (sel.length === 0) {
        label.textContent = tipo === 'status' ? 'Todos' : 'Todas';
        label.classList.add('vazio');
      } else if (sel.length === 1) {
        const opcoes = getTipo(tipo);
        const op = opcoes.find(o => (typeof o === 'string' ? o : o.valor) === sel[0]);
        label.textContent = typeof op === 'string' ? op : (op?.label || sel[0]);
        label.classList.remove('vazio');
      } else {
        label.textContent = `${sel.length} selecionados`;
        label.classList.remove('vazio');
      }
    }

    function filtrarBusca(tipo, termo) {
      const lista = document.getElementById('rc-lista-' + tipo);
      if (!lista) return;
      const t = termo.toLowerCase().trim();
      lista.querySelectorAll('.rc-multi-opt').forEach(el => {
        el.classList.toggle('escondido', t && !(el.dataset.busca || '').includes(t));
      });
    }

    function setOpcoes(tipo, arr) {
      estado[tipo].opcoes = (arr || []).filter(Boolean).map(String).sort((a,b) => a.localeCompare(b, 'pt-BR'));
    }

    function getValores(tipo) {
      const arr = Array.from(estado[tipo].aplicados);
      return arr.length === 0 ? null : arr;
    }

    function limparTudo() {
      ['modalidade','status'].forEach(t => {
        estado[t].aplicados.clear();
        estado[t].temp.clear();
        atualizarLabel(t);
      });
    }

    function initTriggers() {
      document.querySelectorAll('.rc-multi-trigger').forEach(trigger => {
        if (trigger.dataset.bind) return;
        trigger.dataset.bind = '1';
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          toggle(trigger.dataset.tipo);
        });
      });
      document.querySelectorAll('.rc-multi-lista').forEach(lista => {
        if (lista.dataset.bind) return;
        lista.dataset.bind = '1';
        lista.addEventListener('click', (e) => e.stopPropagation());
        lista.addEventListener('change', (e) => {
          const input = e.target;
          if (input.matches('input[type="checkbox"][data-item-tipo]')) {
            toggleItem(input.dataset.itemTipo, input.dataset.itemValor);
          }
        });
      });
      document.querySelectorAll('.rc-multi-rodape button').forEach(btn => {
        if (btn.dataset.bind) return;
        btn.dataset.bind = '1';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const t = btn.dataset.tipo;
          const a = btn.dataset.acao;
          if (a === 'limpar') limpar(t);
          else if (a === 'aplicar') aplicar(t);
        });
      });
      document.querySelectorAll('input[data-busca-tipo]').forEach(input => {
        if (input.dataset.bind) return;
        input.dataset.bind = '1';
        input.addEventListener('click', (e) => e.stopPropagation());
        input.addEventListener('input', (e) => filtrarBusca(input.dataset.buscaTipo, e.target.value));
      });
      if (!window._rcMultiGlobal) {
        window._rcMultiGlobal = true;
        document.addEventListener('click', (e) => {
          ['modalidade','status'].forEach(tipo => {
            const box = document.getElementById('rc-multi-' + tipo);
            if (box && box.contains(e.target)) return;
            fechar(tipo);
          });
        });
      }
    }

    return { setOpcoes, getValores, limparTudo, initTriggers };
  })();

  // TOGGLE DE MODO
  // ═══════════════════════════════════════════════════════════
  function setModo(novoModo) {
    MODO = novoModo;
    $('rc-tab-loja').classList.toggle('ativo', novoModo === 'loja');
    $('rc-tab-parceiros').classList.toggle('ativo', novoModo === 'parceiros');
    $('rc-field-tipo').style.display = novoModo === 'parceiros' ? 'flex' : 'none';
    $('rc-titulo-tabela').textContent = novoModo === 'loja' 
      ? '📋 Consolidado por Consultor' 
      : '📋 Consolidado por TBP';
    $('rc-graf-sub').textContent = novoModo === 'loja'
      ? 'Faturamento ativado mês a mês (loja interna)'
      : 'Faturamento ativado mês a mês (parceiros + freelancers)';
    filtrar();
  }

  function initMesAno() {
    const hoje = new Date();
    $('rc-mes').value = String(hoje.getMonth() + 1);
    $('rc-ano').value = String(hoje.getFullYear());
  }

  // ═══════════════════════════════════════════════════════════
  // FILTRAR
  // ═══════════════════════════════════════════════════════════
  async function filtrar() {
    const sb = getSb();
    if (!sb) return alert('Supabase indisponível');

    const btn = $('rc-btn-filtrar');
    btn.disabled = true; btn.textContent = '⏳ Carregando...';
    $('rc-tbody').innerHTML = `<tr><td colspan="10" class="rc-vazio">Carregando...</td></tr>`;

    const mes = parseInt($('rc-mes').value);
    const ano = parseInt($('rc-ano').value);
    const ini = $('rc-ini').value || null;
    const fim = $('rc-fim').value || null;
    const modalidades = RCMulti.getValores('modalidade');
    const statuses = RCMulti.getValores('status');

    try {
      let data, error;
      if (MODO === 'loja') {
        ({ data, error } = await sb.rpc('gestao_consolidado_loja', {
          p_mes: mes, p_ano: ano,
          p_inicio: ini, p_fim: fim,
          p_modalidades: modalidades,
          p_statuses: statuses
        }));
      } else {
        ({ data, error } = await sb.rpc('gestao_consolidado_parceiros', {
          p_mes: mes, p_ano: ano,
          p_inicio: ini, p_fim: fim,
          p_tipo: $('rc-tipo').value || null,
          p_modalidades: modalidades,
          p_statuses: statuses
        }));
      }

      if (error) throw error;
      if (!data?.success) throw new Error(data?.message || 'Erro');

      DADOS_ATUAIS = data;
      render(data);

      $('rc-btn-pdf').disabled = false;
      $('rc-btn-xls').disabled = false;
    } catch (e) {
      console.error(e);
      $('rc-tbody').innerHTML = `<tr><td colspan="10" class="rc-vazio" style="color:#ef4444;">❌ ${esc(e.message||e)}</td></tr>`;
    } finally {
      btn.disabled = false; btn.textContent = '🔍 Filtrar';
    }
  }

  // ═══════════════════════════════════════════════════════════
  // COMPARATIVO (▲/▼)
  // ═══════════════════════════════════════════════════════════
  function delta(atual, anterior) {
    const a = Number(atual) || 0;
    const b = Number(anterior) || 0;
    if (b === 0 && a === 0) return '<span class="rc-kpi-delta rc-delta-flat">—</span>';
    if (b === 0) return '<span class="rc-kpi-delta rc-delta-up">▲ novo</span>';
    const perc = ((a - b) / b) * 100;
    if (Math.abs(perc) < 0.5) return '<span class="rc-kpi-delta rc-delta-flat">▬ 0%</span>';
    if (perc > 0) return `<span class="rc-kpi-delta rc-delta-up">▲ ${perc.toFixed(1)}%</span>`;
    return `<span class="rc-kpi-delta rc-delta-down">▼ ${Math.abs(perc).toFixed(1)}%</span>`;
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════
  function render(d) {
    const t = d.totais || {};
    const ta = d.totais_anterior || {};

    renderKPIs(d, t, ta);

    renderGrafico(d);
    renderTabela(d);

  // ═══════════════════════════════════════════════════════════
  // EXPORTAR EXCEL
  // ═══════════════════════════════════════════════════════════
  function exportarExcel() {
    if (!DADOS_ATUAIS) return;
    const d = DADOS_ATUAIS;
    const isLoja = MODO === 'loja';
    const arr = isLoja ? (d.por_consultor || []) : (d.por_tbp || []);

    let dados, cols, nomeArquivo;

    if (isLoja) {
      dados = arr.map((r, i) => ({
        'Posição': i + 1,
        'Consultor': r.nome_completo || r.consultor || '',
        'Matrícula': r.matricula || '',
        'Vendas': r.qtd_total,
        'Ativadas': r.qtd_ativadas,
        'Pendentes': r.qtd_pendentes,
        'Valor Total': Number(r.valor_total) || 0,
        'Valor Ativado': Number(r.valor_ativado) || 0,
        'Meta Target': Number(r.meta_target_fat) || 0,
        '% Atingimento': Number((r.perc_fat || 0).toFixed(1)),
        'Ticket Médio': Number(r.ticket_medio) || 0,
        'Portabilidades': r.qtd_portabilidade,
        'Renegociações': r.qtd_renegociacao
      }));
      cols = [{wch:8},{wch:30},{wch:12},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14}];
      nomeArquivo = `consolidado_loja_${d.periodo.mes_nome}_${d.periodo.ano}`;
    } else {
      dados = arr.map((r, i) => ({
        'Posição': i + 1,
        'TBP': r.nome_tbp || r.razao_social || '',
        'Tipo': r.tipo || '',
        'CNPJ/CPF': soDigitos(r.cnpj_cpf),
        'Cidade': r.cidade || '',
        'UF': r.uf || '',
        'Vendas': r.qtd_total,
        'Ativadas': r.qtd_ativadas,
        'Pendentes': r.qtd_pendentes,
        'Valor Total': Number(r.valor_total) || 0,
        'Valor Ativado': Number(r.valor_ativado) || 0,
        '💰 Comissão Estimada': Number(r.comissao_estimada) || 0,
        'Ticket Médio': Number(r.ticket_medio) || 0,
        'Portabilidades': r.qtd_portabilidade,
        'Renegociações': r.qtd_renegociacao,
        'Migrações': r.qtd_migracao,
        'Aditivos': r.qtd_aditivo
      }));
      cols = [{wch:8},{wch:32},{wch:12},{wch:20},{wch:14},{wch:5},{wch:10},{wch:10},{wch:10},{wch:14},{wch:14},{wch:18},{wch:14},{wch:14},{wch:14},{wch:12},{wch:12}];
      nomeArquivo = `consolidado_parceiros_${d.periodo.mes_nome}_${d.periodo.ano}`;
    }

    const ws = XLSX.utils.json_to_sheet(dados);
    ws['!cols'] = cols;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, isLoja ? 'Loja' : 'Parceiros');
    XLSX.writeFile(wb, `${nomeArquivo}.xlsx`);
  }

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  function init() {
    initMesAno();
    RCMulti.initTriggers();
    setTimeout(filtrar, 300);
  }

  window.RC = { setModo, filtrar, limpar, exportarPDF, exportarExcel };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else setTimeout(init, 100);
})();
